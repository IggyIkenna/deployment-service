# AWS CodeBuild Buildspec Template — Unified Trading System Services
#
# CANONICAL TEMPLATE for service buildspec.aws.yaml files.
# Mirrors cloudbuild.yaml architecture: build → QG inside container → push.
#
# Required environment variables (set in CodeBuild project):
#   AWS_ACCOUNT_ID       — AWS account ID
#   AWS_DEFAULT_REGION   — ap-northeast-1 (Tokyo — matches GCP asia-northeast1)
#
# Required secrets (AWS Secrets Manager):
#   github-pat           — GitHub PAT for PM clone + deploy dispatch
#   gcp-sa-key           — GCP service account JSON for AR cross-cloud pull
#
# Placeholders (replace per service):
#   SERVICE_NAME         — e.g. instruments-service
#   REGISTRY_REPO        — e.g. unified-trading-system

version: 0.2

env:
  variables:
    SERVICE_NAME: "my-service"
    REGISTRY_REPO: "unified-trading-system"
    AWS_DEFAULT_REGION: "ap-northeast-1"
  secrets-manager:
    GH_PAT: "github-pat:token"
    GCP_SA_KEY: "gcp-sa-key:json"
  exported-variables:
    - IMAGE_TAG

phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      # Extract version from pyproject.toml
      - VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//') && export VERSION && echo "$VERSION" > VERSION
      - echo "Building version $VERSION"
      - export IMAGE_TAG=$VERSION

  pre_build:
    commands:
      # ECR login
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      # Ensure ECR repo exists
      - aws ecr describe-repositories --repository-names $SERVICE_NAME --region $AWS_DEFAULT_REGION 2>/dev/null || aws ecr create-repository --repository-name $SERVICE_NAME --region $AWS_DEFAULT_REGION
      # GCP AR auth for pulling UTL base image (cross-cloud)
      - |
        if [ -n "$GCP_SA_KEY" ]; then
          echo "$GCP_SA_KEY" | docker login -u _json_key --password-stdin https://asia-northeast1-docker.pkg.dev
          echo "GCP AR auth OK"
        else
          echo "WARNING: GCP_SA_KEY not set — Docker build will fail on FROM clause"
        fi
      # Clone unified-trading-pm for quality-gates base scripts
      - |
        if [ -n "$GH_PAT" ] && [ ! -d "unified-trading-pm" ]; then
          git clone --depth=1 --branch live-defi-rollout \
            "https://$GH_PAT@github.com/IggyIkenna/unified-trading-pm.git" \
            unified-trading-pm
          echo "Cloned unified-trading-pm"
        else
          echo "Skipping PM clone (PAT unavailable or already cloned)"
        fi

  build:
    commands:
      - VERSION=$(cat VERSION)
      - ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$SERVICE_NAME
      # Build Docker image (PROJECT_ID for UTL base image FROM clause)
      - GCP_PROJECT_ID=$(echo "$GCP_SA_KEY" | python3 -c "import json,sys;print(json.load(sys.stdin).get('project_id','central-element-323112'))" 2>/dev/null || echo "central-element-323112")
      - docker build -f Dockerfile --build-arg PROJECT_ID=$GCP_PROJECT_ID -t $ECR_REPO:$VERSION -t $ECR_REPO:latest .
      # Run quality gates INSIDE the image with PM scripts mounted
      - |
        docker run --rm \
          --entrypoint "" \
          -v $(pwd)/unified-trading-pm:/workspace/unified-trading-pm \
          -e CLOUD_BUILD=true \
          -e CLOUD_MOCK_MODE=true \
          -e CLOUD_PROVIDER=aws \
          -e AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION \
          -e WORKSPACE_ROOT=/workspace \
          -e REPO_ROOT=/workspace \
          $ECR_REPO:$VERSION \
          /bin/bash -c "scripts/quality-gates.sh --no-fix --quick"
      # Push ONLY if QG passed
      - docker push $ECR_REPO:$VERSION
      - docker push $ECR_REPO:latest

  post_build:
    commands:
      - VERSION=$(cat VERSION)
      - ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$SERVICE_NAME
      # Optional: notify deployment-service via GitHub dispatch
      - |
        if [ -n "$GH_PAT" ]; then
          IMAGE="$ECR_REPO:$VERSION"
          curl -sS -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/IggyIkenna/deployment-service/dispatches \
            -d "{\"event_type\":\"service-deployed\",\"client_payload\":{\"service_name\":\"$SERVICE_NAME\",\"version\":\"$VERSION\",\"image\":\"$IMAGE\",\"cloud\":\"aws\"}}" || true
        fi

artifacts:
  files:
    - "**/*"

cache:
  paths:
    - "/root/.cache/uv/**/*"
