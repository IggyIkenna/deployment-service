# Cloud Build — deployment-service maintenance-jobs image
#
# Publishes `<region>-docker.pkg.dev/<project>/unified-trading-system/deployment-service:latest`
# (+ :$SHORT_SHA), built from the Dockerfile `api` stage which now contains `scripts/`.
#
# Why a dedicated config (not the main cloudbuild.yaml): the main config builds the
# `deployment-dashboard` Cloud Run SERVICE (api/QG/deploy/scan/set-iam). This image is
# only the base for short-lived maintenance Cloud Run JOBS that override the CMD:
#   - terraform/gcp/tarball_cleanup_scheduler.tf   -> scripts/vm/cleanup_old_tarballs.py
#   - terraform/gcp/vm_log_archival_scheduler.tf   -> python -m scripts.vm.vm_log_archival_cron
#   - terraform/gcp/live_event_log/compaction_job.tf -> python -m deployment_service.jobs.live_event_log_compactor
# The jobs run in every environment off the SAME image (one GCP project, env via TF var).
#
# Run:
#   gcloud builds submit --config=cloud-build/deployment-service-jobs-image.cloudbuild.yaml \
#     --region=asia-northeast1 --project=<project>
# Plan: plans/active/issues/deployment_scripts_bucket_softdelete_log_churn_2026_06_01.md

substitutions:
  _REGION: asia-northeast1
  _REGISTRY_REPO: unified-trading-system
  _IMAGE_NAME: deployment-service
  _GIT_SHA: manual # overridden by trigger or --substitutions=_GIT_SHA=<sha>

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args: ["auth", "configure-docker", "${_REGION}-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  # Pull the UTL base explicitly so the Dockerfile FROM-line hits local cache (AR auth quirk).
  #
  # DIGEST-AWARE (FROM-digest ratchet, 2026-06-10): the Dockerfile pins
  # `ARG BASE_IMAGE_DIGEST=sha256:<64-hex>` and builds `FROM ...@${BASE_IMAGE_DIGEST}`.
  # A bare `:latest` pre-pull warms a DIFFERENT manifest, so the in-build FROM @<pinned>
  # falls through to a daemon-side registry pull which is UNAUTHENTICATED → "denied"
  # (live incident 2026-06-22). Pre-pull the PINNED manifest authenticated first; :latest
  # is also pulled so unpinned/legacy Dockerfiles keep working. Mirrors mtds cloudbuild.yaml.
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    waitFor: ["configure-docker"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        # NOTE: double-dollar escapes shell vars from Cloud Build's OWN substitution pass
        # (PROJECT_ID is deliberately single-dollar — it IS a Cloud Build substitution).
        # The substitution validator scans this WHOLE block INCLUDING comment lines,
        # so even prose may not contain dollar-PIN/dollar-BASE.
        BASE="${_REGION}-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library"
        PIN=$$(sed -n 's/^ARG BASE_IMAGE_DIGEST=\(sha256:[0-9a-f]\{64\}\).*/\1/p' Dockerfile | head -1 || true)
        if [ -n "$$PIN" ]; then
          echo "pinned base digest: $$PIN — pre-pulling the PINNED manifest"
          docker pull "$${BASE}@$${PIN}"
        fi
        docker pull "$${BASE}:latest" || true

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    waitFor: ["pull-base-image"]
    args:
      - "build"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_REPO}/${_IMAGE_NAME}:latest"
      - "--build-arg"
      - "PROJECT_ID=${PROJECT_ID}"
      - "--target"
      - "maintenance-jobs"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_REPO}/${_IMAGE_NAME}:${_GIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_REPO}/${_IMAGE_NAME}:latest"
      - "."

  # Push explicitly (not via the `images:` block) so the push completes BEFORE the
  # redeploy step below — `images:` pushes only after ALL steps finish, which would leave
  # redeploy-jobs re-resolving the OLD :latest.
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    waitFor: ["build"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_REPO}/${_IMAGE_NAME}"
        docker push "$${BASE}:${_GIT_SHA}"
        docker push "$${BASE}:latest"

  # Re-resolve the maintenance Cloud Run Jobs to the freshly-pushed :latest digest.
  # Cloud Run Jobs pin the image digest at deploy time, so a rebuilt :latest is NOT picked
  # up until the job is updated — this makes the jobs track each build automatically.
  # Failure-tolerant: a job absent in this env logs a WARN and does not fail the build
  # (the image push already succeeded). Requires the Cloud Build SA to have roles/run.developer
  # + roles/iam.serviceAccountUser on the jobs' runtime SA (granted 2026-06-02).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "redeploy-jobs"
    waitFor: ["push"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_REPO}/${_IMAGE_NAME}:latest"
        for job in uts-prod-tarball-cleanup vm-log-archival-prd live-event-log-compactor; do
          echo "Re-resolving $${job} -> $${IMG}"
          gcloud run jobs update "$${job}" --image="$${IMG}" --region="${_REGION}" --project="${PROJECT_ID}" \
            || echo "WARN: could not update $${job} (may not exist in this env) — image push still succeeded"
        done

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"
