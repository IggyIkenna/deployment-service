# Cloud Run service spec for market-data-processing-service (MDPS).
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1 (co-located with GCS market-data bucket).
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: MDPS processes raw ticks → OHLCV + indicators and publishes to PubSub.
# Streaming processor runs as background thread inside FastAPI lifespan (Phase E.2).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: market-data-processing-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      market-data-processing-service (MDPS) — raw tick → OHLCV + indicator pipeline.
      Streams processed data to unified-trading-market-data-prod bucket + PubSub.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: mdps-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 3600
      containerConcurrency: 20
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/market-data-processing-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: GCS_REGION
              value: "asia-northeast1"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
