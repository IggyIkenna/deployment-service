# Cloud Run service spec for fund-administration-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fund-administration-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      fund-administration-service — NAV calculation, subscription/redemption processing,
      fee accrual, and investor statement generation.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: fund-admin-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 300
      containerConcurrency: 20
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/fund-administration-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: GCS_REGION
              value: "asia-northeast1"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
  traffic:
    - latestRevision: true
      percent: 100
