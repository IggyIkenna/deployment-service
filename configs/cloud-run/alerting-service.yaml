# Cloud Run service spec for alerting-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1 (co-located with GCS data and other services).
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alerting-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      alerting-service — Telegram/Slack/PagerDuty alert delivery for CI failures,
      data-pipeline events, and trading anomalies.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: alerting-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 60
      containerConcurrency: 80
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/alerting-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
  traffic:
    - latestRevision: true
      percent: 100
