# Cloud Run service spec for execution-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
#
# Architecture note: execution-service manages live order-flow and is stateful
# (open positions, WebSocket connections to venues). Cloud Run gen2 with minScale=1
# keeps one warm instance alive to prevent mid-trade cold-starts. Per-client
# isolation is enforced as one subprocess per client (CLIENT_ISOLATION_MODE=subprocess).
# SSOT: codex/04-architecture/per-client-isolation-architecture.md

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: execution-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      execution-service — CeFi/DeFi order execution (Binance, Deribit, OKX, Bybit,
      Hyperliquid). Manages live order-flow; per-client subprocess isolation.
spec:
  template:
    metadata:
      annotations:
        # Always-on: stateful trading service — no cold-starts on order flow.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: execution-prod@central-element-323112.iam.gserviceaccount.com
      # Extended timeout for long-running trade session connections.
      timeoutSeconds: 3600
      containerConcurrency: 10
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/execution-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: CLIENT_ISOLATION_MODE
              value: "subprocess"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
