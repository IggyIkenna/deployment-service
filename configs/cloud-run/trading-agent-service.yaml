# Cloud Run service spec for trading-agent-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: trading-agent-service coordinates between strategy and execution; it is
# stateful (active agent sessions, order confirmations). minScale=1, maxScale=1.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: trading-agent-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      trading-agent-service — coordination layer between strategy-service and
      execution-service. Manages active agent sessions and order lifecycle.
spec:
  template:
    metadata:
      annotations:
        # Stateful: single instance to prevent duplicate order submissions.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: trading-agent-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 3600
      containerConcurrency: 10
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/trading-agent-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
