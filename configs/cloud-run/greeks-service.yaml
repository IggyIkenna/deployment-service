# Cloud Run service spec for greeks-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: greeks-service computes options Greeks (delta/gamma/vega/theta/rho) on demand
# — computation-bound; 2 vCPU + 4Gi handles concurrent pricing requests.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: greeks-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      greeks-service — real-time options Greeks computation (Black-Scholes + Heston)
      for risk and strategy services.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: greeks-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 60
      containerConcurrency: 40
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/greeks-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
  traffic:
    - latestRevision: true
      percent: 100
