# Cloud Run service spec for instruments-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: instruments-service owns reference data + venue URLs/universe (URDI).
# It is the SSOT for all instrument metadata; Cloud Run jobs (sports-trigger-instruments,
# catalogue refresh) also pull from this image.
# SSOT: codex/04-architecture/instruments-service-as-ssot-for-mtds.md

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: instruments-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      instruments-service — reference data + venue universe SSOT (URDI). All other
      services (MTDS, MDPS, execution) read instrument metadata from this service.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: instruments-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 120
      containerConcurrency: 80
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/instruments-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: GCS_REGION
              value: "asia-northeast1"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
