# Cloud Run service spec for strategy-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: strategy-service runs the strategy supervisor + signal generation loop.
# It is stateful (open positions, strategy state machines); minScale=1, maxScale=1
# prevents split-brain across concurrent instances.
# SSOT: codex/09-strategy/architecture-v2/, codex/04-architecture/promote-workflow-architecture.md

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: strategy-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      strategy-service — strategy supervisor + signal generation for all asset-groups
      (cefi / defi / tradfi / sports / prediction). Stateful; one instance only.
spec:
  template:
    metadata:
      annotations:
        # Stateful: single instance to prevent split-brain position tracking.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: strategy-prod@central-element-323112.iam.gserviceaccount.com
      timeoutSeconds: 3600
      containerConcurrency: 10
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/strategy-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: GCS_REGION
              value: "asia-northeast1"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
