# Cloud Run service spec for ml-service.
# Declarative reference; actual deployment via scripts/cloud-run/deploy.sh.
# Region: asia-northeast1.
# Health endpoints: /health, /readiness, /liveness (UTL make_health_router STEP 5.62).
# Note: ml-service runs model inference (LSTM, Transformer, XGBoost). Numba JIT +
# model loading on cold-start requires extended startup probe window.
# Lazy-import heavy ML deps per coding standards (TID251).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ml-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: >
      ml-service — ML model inference (LSTM / Transformer / XGBoost) for strategy
      signal generation and feature importance ranking.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ml-prod@central-element-323112.iam.gserviceaccount.com
      # Extended: model load + numba JIT on cold-start.
      timeoutSeconds: 300
      containerConcurrency: 20
      containers:
        - image: asia-northeast1-docker.pkg.dev/central-element-323112/unified-trading/ml-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
          env:
            - name: DEPLOYMENT_ENV
              value: "prod"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: GCP_PROJECT_ID
              value: "central-element-323112"
            - name: GCS_REGION
              value: "asia-northeast1"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
            timeoutSeconds: 15
  traffic:
    - latestRevision: true
      percent: 100
