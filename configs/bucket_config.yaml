# Bucket Configuration — registry of genuine, hand-managed infra buckets.
#
# Rewritten 2026-07-14 (`bucket_estate_consolidation_to_sub100_2026_07_13.md`
# Deferred #8): `setup-buckets.py` now derives every service/data bucket name
# from the canonical `cloud-providers.yaml` matrix via the UTL SSOT resolver
# (`unified_trading_library.resolve_bucket_name`), NOT from this file. This
# file is ONLY the registry of genuine infra buckets that don't belong in the
# canonical per-kind matrix (terraform-state, deployment-orchestration,
# build-metadata, databento-batch-registry, backtest-results,
# client-reporting-data, events, unified-deployment-state, ...) — the data
# buckets that used to duplicate cloud-providers.yaml here (eigenlayer-rewards,
# ml-configs-store, features-volatility-defi + their -test twins) were
# stripped, along with the dead `aws_bucket_mappings` (superseded by the AWS
# side of cloud-providers.yaml, which mirrors GCP 1:1) / `test_buckets`
# (superseded by `deployment_env="test"` resolution) / `validation` (superseded
# by cloud-providers.yaml's dict shape, which only ever has valid
# kind+asset_group combinations) sections — all three were consumed solely by
# the old local resolver this rewrite deleted.
#
# `shared_bucket_services` / `service_categories` stay: `setup-buckets.py`
# doesn't read them any more, but
# `system-integration-tests/tests/conftest.py`'s own (separate)
# `dependencies.yaml`-driven bucket enumeration still does.
#
# See BUCKET_CONFIG_SCHEMA.md for documentation.

defaults:
  gcp:
    project_id: test-project
    region: asia-northeast1
  aws:
    region: ap-northeast-1

shared_bucket_services:
  - features-calendar-service
  - alerting-service
  - reconciliation-service

service_categories:
  restricted_categories:
    volatility: [cefi, tradfi]
    onchain: [cefi, defi]
    sports: [sports]
    prediction: [prediction]
    cross-instrument: [prediction]
    # execution/strategy only have financial categories
    execution: [cefi, tradfi, defi]
    strategy: [cefi, tradfi, defi]
    # risk/pnl/positions have all 5 categories
    risk: [cefi, tradfi, defi, prediction, sports]
    pnl: [cefi, tradfi, defi]
    positions: [cefi, tradfi, defi, prediction, sports]
  default_categories: [cefi, tradfi, defi, sports, prediction]

infrastructure_buckets:
  gcp:
    - name_template: "terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "deployment-orchestration-{project_id}"
      service: deployment-service
      type: infrastructure
      category: ALL
    # solana-defi, evm-defi, lending-indices, gas-fees REMOVED (bucket estate cleanup +
    # 2026-07-12 follow-up, [[gcs_bucket_estate_cleanup_2026_07_10]]) — confirmed zero
    # callers workspace-wide; real data goes to the shared market-data-tick-defi bucket
    # instead. See cloud-providers.yaml's matching removal comment for the full rationale.
    # dex-pools, lst-rates, perp-funding (+ -test variants) REMOVED 2026-07-13
    # ([[defi_dedicated_bucket_shared_migration_2026_07_13]]) — readers migrated to the
    # shared bucket, data gaps backfilled, dedicated buckets retired.
    # liquidations, dex-swaps, oracle-prices REMOVED 2026-07-10 (bucket estate cleanup) —
    # same rationale as solana-defi/evm-defi/lending-indices above.
    # eigenlayer-rewards + eigenlayer-rewards-test REMOVED 2026-07-14
    # ([[bucket_estate_consolidation_to_sub100_2026_07_13]] Deferred #8): this flat,
    # no-env-tier pair duplicated (and drifted from) cloud-providers.yaml's genuinely
    # env-tiered `eigenlayer-rewards: eigenlayer-rewards-${DEPLOYMENT_ENV_SHORT}-${pid}`
    # kind — setup-buckets.py now provisions the canonical env-tiered names via the
    # UTL resolver directly; this stale flat registration is no longer needed.
    # Infrastructure — shared buckets
    - name_template: "config-store-{project_id}"
      service: infrastructure
      type: config
      category: ALL
    - name_template: "{project_id}-events"
      service: infrastructure
      type: events
      category: ALL
    - name_template: "{project_id}-build-metadata"
      service: infrastructure
      type: build
      category: ALL
    - name_template: "client-reporting-data-{project_id}"
      service: client-reporting
      type: reporting
      category: ALL
    - name_template: "databento-batch-registry-asia-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: tradfi
    - name_template: "backtest-results-{project_id}"
      service: strategy-service
      type: results
      category: ALL
    # ml-configs-store + ml-configs-store-test REMOVED 2026-07-14
    # ([[bucket_estate_consolidation_to_sub100_2026_07_13]] Deferred #8): this flat,
    # no-env-tier pair duplicated (and drifted from) cloud-providers.yaml's genuinely
    # env-tiered `ml-configs-store: ml-configs-store-${DEPLOYMENT_ENV_SHORT}-${pid}`
    # kind — setup-buckets.py now provisions the canonical env-tiered names via the
    # UTL resolver directly; this stale flat registration is no longer needed.
    # Deployment state — per-env
    - name_template: "unified-deployment-state-{project_id}"
      service: deployment-service
      type: infrastructure
      category: ALL
    - name_template: "uts-terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    # Legacy risk-store naming (category-prefix instead of suffix) — REMOVED 2026-07-10
    # (bucket estate cleanup, [[gcs_bucket_estate_cleanup_2026_07_10]]): confirmed zero callers
    # workspace-wide, in ANY of the 3 legacy naming schemes tried (this one, the -{pid}-{ag}
    # suffix scheme, and cloud-providers.yaml's risk-store-defi flat key, also removed). Real
    # naming is unified_trading_library/config_interface/paths/registry.py PATH_REGISTRY's
    # risk-metrics-store-{pid}. risk-and-exposure-service doesn't exist as a repo.
    # features-volatility-defi + features-volatility-defi-test REMOVED 2026-07-14
    # ([[bucket_estate_consolidation_to_sub100_2026_07_13]] Deferred #8): this pair was a pure
    # duplicate of cloud-providers.yaml's `features-volatility.DEFI` kind (identical literal
    # name — features-volatility is env-split-rolled-back, so the canonical template already
    # produces the exact same flat name) — setup-buckets.py now provisions it via the UTL
    # resolver directly; this redundant registration is no longer needed.
  aws:
    - name_template: "unified-trading-terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    # unified-trading-solana-defi, unified-trading-evm-defi, unified-trading-lending-indices,
    # unified-trading-gas-fees REMOVED (bucket estate cleanup + 2026-07-12 follow-up) —
    # mirrors the GCP-section removal above.
    # unified-trading-dex-pools, unified-trading-lst-rates, unified-trading-perp-funding
    # (+ -test variants) REMOVED 2026-07-13 — mirrors the GCP-section removal above
    # ([[defi_dedicated_bucket_shared_migration_2026_07_13]]).
    # unified-trading-liquidations, unified-trading-dex-swaps, unified-trading-oracle-prices
    # REMOVED 2026-07-10 (bucket estate cleanup) — mirrors the GCP-section removal above.
    # unified-trading-eigenlayer-rewards + -test REMOVED 2026-07-14 — mirrors the GCP-section
    # eigenlayer-rewards removal above ([[bucket_estate_consolidation_to_sub100_2026_07_13]]
    # Deferred #8): duplicated cloud-providers.yaml's env-tiered `eigenlayer-rewards` kind.
    # TradFi reference data — Databento (upstream) + non-DeFi risk-store parity (slot 2 2026-05-19)
    - name_template: "unified-trading-databento-batch-registry-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: tradfi
    - name_template: "unified-trading-databento-batch-registry-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: tradfi
    # risk-store-{cefi,tradfi,prediction,sports} REMOVED 2026-07-10 (bucket estate cleanup) —
    # mirrors the GCP-section removal above (confirmed zero callers, real naming is UTL
    # PATH_REGISTRY's risk-metrics-store-{pid}).

bucket_settings:
  gcp:
    storage_class: STANDARD
    uniform_bucket_access: true
    versioning: true
    lifecycle_rules:
      production:
        age_days: 365
        action: SetStorageClass
        storage_class: NEARLINE
      test:
        age_days: 30
        action: SetStorageClass
        storage_class: NEARLINE
    labels:
      managed_by: setup-buckets
  aws:
    versioning: true
    encryption:
      algorithm: AES256
    tags:
      ManagedBy: setup-buckets
      Project: unified-trading-system
