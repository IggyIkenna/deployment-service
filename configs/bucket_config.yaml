# Bucket Configuration for Unified Trading System
# This file contains all bucket-related configuration extracted from setup-buckets.py

# Default values and settings
defaults:
  gcp:
    project_id: test-project
    region: asia-northeast1
  aws:
    region: ap-northeast-1

# Services that use shared buckets (no category dimension)
shared_bucket_services:
  - features-calendar-service
  - features-onchain-service
  - features-sports-service
  - ml-training-service
  - ml-inference-service
  - strategy-service
  - execution-service
  - position-balance-monitor-service

# Service categories and restrictions
service_categories:
  # Services with restricted categories (no DEFI)
  restricted_categories:
    volatility: [cefi, tradfi] # No DEFI options for volatility services

  # Default categories for most services
  default_categories: [cefi, tradfi, defi]

# Infrastructure buckets configuration
infrastructure_buckets:
  gcp:
    - name_template: "terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "deployment-orchestration-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "databento-batch-registry-asia-{project_id}"
      service: unified-trading-library
      type: infrastructure
      category: ALL
    - name_template: "config-store-{project_id}"
      service: unified-config-interface
      type: infrastructure
      category: ALL
    - name_template: "positions-store-{project_id}"
      service: position-balance-monitor-service
      type: infrastructure
      category: ALL
    - name_template: "ml-configs-store-{project_id}"
      service: ml-training-service
      type: infrastructure
      category: ALL

  aws:
    - name_template: "unified-trading-terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "unified-trading-deployment-orchestration-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "unified-trading-config-store-{project_id}"
      service: unified-config-interface
      type: infrastructure
      category: ALL
    - name_template: "unified-trading-positions-{project_id}"
      service: position-balance-monitor-service
      type: infrastructure
      category: ALL

# AWS bucket name conversion mappings
aws_bucket_mappings:
  instruments-store: "unified-trading-instruments-{category}-{account_id}"
  market-data-tick: "unified-trading-market-data-{category}-{account_id}"
  features-calendar: "unified-trading-features-calendar-{category}-{account_id}"
  features-delta-one: "unified-trading-features-delta-one-{category}-{account_id}"
  features-volatility: "unified-trading-features-volatility-{category}-{account_id}"
  features-onchain: "unified-trading-features-onchain-{category}-{account_id}"
  ml-models-store: "unified-trading-ml-models-{account_id}"
  ml-predictions-store: "unified-trading-ml-predictions-{account_id}"
  ml-configs: "unified-trading-ml-configs-{account_id}"
  strategy-store: "unified-trading-strategy-{category}-{account_id}"
  execution-store: "unified-trading-execution-{category}-{account_id}"
  config-store: "unified-trading-config-store-{account_id}"
  pnl-store: "unified-trading-pnl-{account_id}-{category}"
  positions-store: "unified-trading-positions-{account_id}-{category}"
  risk-store: "unified-trading-risk-{account_id}-{category}"

# Bucket creation settings
bucket_settings:
  gcp:
    storage_class: STANDARD
    uniform_bucket_access: true
    versioning: true
    lifecycle_rules:
      production:
        age_days: 365
        action: SetStorageClass
        storage_class: NEARLINE
      test:
        age_days: 30
        action: SetStorageClass
        storage_class: NEARLINE
    labels:
      managed_by: setup_buckets
      # service, category, environment labels are added dynamically

  aws:
    versioning: true
    encryption:
      algorithm: AES256
    lifecycle_rules:
      production:
        age_days: 365
        action: transition
        storage_class: STANDARD_IA
      test:
        age_days: 30
        action: transition
        storage_class: STANDARD_IA
    tags:
      ManagedBy: setup-buckets
      Project: unified-trading
      # Service, Category, Environment tags are added dynamically

# Test bucket naming configuration
test_buckets:
  # Pattern for generating test bucket names from production names
  naming_pattern: "infix" # insert '-test' before project_id
  fallback_pattern: "suffix" # append '-test' if project_id not found in name

# Validation rules for bucket names and categories
validation:
  # Invalid category combinations
  invalid_combinations:
    - template_contains: volatility
      invalid_category: defi
      reason: "No volatility for DEFI"
    - template_contains: onchain
      invalid_category: tradfi
      reason: "No onchain for TRADFI"

# Environment variable suggestions for services
env_var_patterns:
  service_bucket: "{service_upper}_GCS_BUCKET_{category}_TEST"
  service_bucket_no_category: "{service_upper}_GCS_BUCKET_TEST"
  # Remove '_SERVICE' from service names for env vars
  service_name_cleanup: "_SERVICE"
