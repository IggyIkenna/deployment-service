# Bucket Configuration — SSOT for setup-buckets.py
#
# Defines default categories, service restrictions, infrastructure buckets,
# AWS naming mappings, bucket creation settings, test bucket naming, and
# validation rules.
#
# See BUCKET_CONFIG_SCHEMA.md for documentation.

defaults:
  gcp:
    project_id: test-project
    region: asia-northeast1
  aws:
    region: ap-northeast-1

shared_bucket_services:
  - features-calendar-service
  - alerting-service
  - reconciliation-service

service_categories:
  restricted_categories:
    volatility: [cefi, tradfi]
    onchain: [cefi, defi]
    sports: [sports]
    prediction: [prediction]
    cross-instrument: [prediction]
    # execution/strategy only have financial categories
    execution: [cefi, tradfi, defi]
    strategy: [cefi, tradfi, defi]
    # risk/pnl/positions have all 5 categories
    risk: [cefi, tradfi, defi, prediction, sports]
    pnl: [cefi, tradfi, defi]
    positions: [cefi, tradfi, defi, prediction, sports]
  default_categories: [cefi, tradfi, defi, sports, prediction]

infrastructure_buckets:
  gcp:
    - name_template: "terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "deployment-orchestration-{project_id}"
      service: deployment-service
      type: infrastructure
      category: ALL
    - name_template: "gas-fees-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "gas-fees-test-{project_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # solana-defi, evm-defi, lending-indices REMOVED 2026-07-10 (bucket estate cleanup,
    # [[gcs_bucket_estate_cleanup_2026_07_10]]) — confirmed zero callers workspace-wide;
    # real data goes to the shared market-data-tick-defi bucket instead. See
    # cloud-providers.yaml's matching removal comment for the full rationale.
    - name_template: "dex-pools-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "dex-pools-test-{project_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    - name_template: "lst-rates-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "lst-rates-test-{project_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    - name_template: "perp-funding-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "perp-funding-test-{project_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # liquidations, dex-swaps, oracle-prices REMOVED 2026-07-10 (bucket estate cleanup) —
    # same rationale as solana-defi/evm-defi/lending-indices above.
    - name_template: "eigenlayer-rewards-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "eigenlayer-rewards-test-{project_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # Infrastructure — shared buckets
    - name_template: "config-store-{project_id}"
      service: infrastructure
      type: config
      category: ALL
    - name_template: "{project_id}-events"
      service: infrastructure
      type: events
      category: ALL
    - name_template: "{project_id}-build-metadata"
      service: infrastructure
      type: build
      category: ALL
    - name_template: "client-reporting-data-{project_id}"
      service: client-reporting
      type: reporting
      category: ALL
    - name_template: "databento-batch-registry-asia-{project_id}"
      service: market-tick-data-service
      type: reference_data
      category: tradfi
    - name_template: "backtest-results-{project_id}"
      service: strategy-service
      type: results
      category: ALL
    # ML configs — shared across categories
    - name_template: "ml-configs-store-{project_id}"
      service: ml-service
      type: config
      category: ALL
    - name_template: "ml-configs-store-test-{project_id}"
      service: ml-service
      type: config_test
      category: ALL
    # Deployment state — per-env
    - name_template: "unified-deployment-state-{project_id}"
      service: deployment-service
      type: infrastructure
      category: ALL
    - name_template: "uts-terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    # Legacy risk-store naming (category-prefix instead of suffix) — REMOVED 2026-07-10
    # (bucket estate cleanup, [[gcs_bucket_estate_cleanup_2026_07_10]]): confirmed zero callers
    # workspace-wide, in ANY of the 3 legacy naming schemes tried (this one, the -{pid}-{ag}
    # suffix scheme, and cloud-providers.yaml's risk-store-defi flat key, also removed). Real
    # naming is unified_trading_library/config_interface/paths/registry.py PATH_REGISTRY's
    # risk-metrics-store-{pid}. risk-and-exposure-service doesn't exist as a repo.
    # Volatility defi (was missing from restricted_categories)
    - name_template: "features-volatility-defi-{project_id}"
      service: features-volatility-service
      type: output
      category: defi
    - name_template: "features-volatility-defi-test-{project_id}"
      service: features-volatility-service
      type: test
      category: defi
  aws:
    - name_template: "unified-trading-terraform-state-{project_id}"
      service: infrastructure
      type: infrastructure
      category: ALL
    - name_template: "unified-trading-gas-fees-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "unified-trading-gas-fees-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # unified-trading-solana-defi, unified-trading-evm-defi, unified-trading-lending-indices
    # REMOVED 2026-07-10 (bucket estate cleanup) — mirrors the GCP-section removal above.
    - name_template: "unified-trading-dex-pools-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "unified-trading-dex-pools-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    - name_template: "unified-trading-lst-rates-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "unified-trading-lst-rates-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    - name_template: "unified-trading-perp-funding-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "unified-trading-perp-funding-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # unified-trading-liquidations, unified-trading-dex-swaps, unified-trading-oracle-prices
    # REMOVED 2026-07-10 (bucket estate cleanup) — mirrors the GCP-section removal above.
    - name_template: "unified-trading-eigenlayer-rewards-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: defi
    - name_template: "unified-trading-eigenlayer-rewards-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: defi
    # TradFi reference data — Databento (upstream) + non-DeFi risk-store parity (slot 2 2026-05-19)
    - name_template: "unified-trading-databento-batch-registry-{account_id}"
      service: market-tick-data-service
      type: reference_data
      category: tradfi
    - name_template: "unified-trading-databento-batch-registry-test-{account_id}"
      service: market-tick-data-service
      type: reference_data_test
      category: tradfi
    # risk-store-{cefi,tradfi,prediction,sports} REMOVED 2026-07-10 (bucket estate cleanup) —
    # mirrors the GCP-section removal above (confirmed zero callers, real naming is UTL
    # PATH_REGISTRY's risk-metrics-store-{pid}).

aws_bucket_mappings:
  instruments-store: "unified-trading-instruments-{category}-{account_id}"
  market-data-tick: "unified-trading-market-data-{category}-{account_id}"
  # market-data-candles retired 2026-04-18: MDPS writes co-located under
  # market-data-tick-{category}-* in `processed_candles/` subprefix
  # (see unified-trading-pm/plans/active/data_pipeline_completion_2026_04_18.md Phase 5a).
  features-delta-one: "unified-trading-features-delta-one-{category}-{account_id}"
  features-volatility: "unified-trading-features-volatility-{category}-{account_id}"
  features-onchain: "unified-trading-features-onchain-{category}-{account_id}"
  features-calendar: "unified-trading-features-calendar-{account_id}"
  features-sports: "unified-trading-features-sports-{account_id}"
  features-prediction: "unified-trading-features-prediction-{account_id}"
  features-cross-instrument: "unified-trading-features-cross-instrument-{category}-{account_id}"
  execution-store: "unified-trading-execution-{category}-{account_id}"
  strategy-store: "unified-trading-strategy-{category}-{account_id}"
  # risk-store, pnl-store, positions-store, solana-defi, evm-defi, lending-indices,
  # liquidations, dex-swaps, oracle-prices REMOVED 2026-07-10 (bucket estate cleanup,
  # [[gcs_bucket_estate_cleanup_2026_07_10]]) — confirmed zero resolve_bucket_name() callers
  # workspace-wide for all of these kinds (code-level finding, applies to both clouds).
  ml-models-store: "unified-trading-ml-models-{account_id}"
  ml-predictions-store: "unified-trading-ml-predictions-{account_id}"
  ml-configs-store: "unified-trading-ml-configs-{account_id}"
  ml-training-artifacts: "unified-trading-ml-training-artifacts-{account_id}"
  gas-fees: "unified-trading-gas-fees-{account_id}"
  dex-pools: "unified-trading-dex-pools-{account_id}"
  lst-rates: "unified-trading-lst-rates-{account_id}"
  perp-funding: "unified-trading-perp-funding-{account_id}"
  eigenlayer-rewards: "unified-trading-eigenlayer-rewards-{account_id}"

bucket_settings:
  gcp:
    storage_class: STANDARD
    uniform_bucket_access: true
    versioning: true
    lifecycle_rules:
      production:
        age_days: 365
        action: SetStorageClass
        storage_class: NEARLINE
      test:
        age_days: 30
        action: SetStorageClass
        storage_class: NEARLINE
    labels:
      managed_by: setup-buckets
  aws:
    versioning: true
    encryption:
      algorithm: AES256
    tags:
      ManagedBy: setup-buckets
      Project: unified-trading-system

test_buckets:
  naming_pattern: "infix"
  fallback_pattern: "suffix"

validation:
  invalid_combinations:
    - template_contains: volatility
      invalid_category: defi
      reason: "No volatility features for DEFI category"
    - template_contains: onchain
      invalid_category: tradfi
      reason: "No onchain features for TRADFI category"
    - template_contains: sports
      invalid_category: cefi
      reason: "Sports buckets are sports-category only"
    - template_contains: sports
      invalid_category: tradfi
      reason: "Sports buckets are sports-category only"
    - template_contains: sports
      invalid_category: defi
      reason: "Sports buckets are sports-category only"
    - template_contains: prediction
      invalid_category: cefi
      reason: "Prediction buckets are prediction-category only"
    - template_contains: prediction
      invalid_category: tradfi
      reason: "Prediction buckets are prediction-category only"
    - template_contains: prediction
      invalid_category: defi
      reason: "Prediction buckets are prediction-category only"
    - template_contains: execution-store
      invalid_category: sports
      reason: "Execution store is financial categories only"
    - template_contains: execution-store
      invalid_category: prediction
      reason: "Execution store is financial categories only"
    - template_contains: strategy-store
      invalid_category: sports
      reason: "Strategy store is financial categories only"
    - template_contains: strategy-store
      invalid_category: prediction
      reason: "Strategy store is financial categories only"
