# Deployment readiness delta — canonical compliance checklist: unified-trading-codex/10-audit/batch|live/checklist.template.yaml
# Service Production Readiness Checklist Template
# ==============================================
# Copy this template to checklist.{service}.yaml and fill in status for each item.
#
# Status values:
#   - done: Item is complete
#   - partial: Item is partially complete (add notes)
#   - pending: Item needs work
#   - n/a: Not applicable to this service
#
# Each item has:
#   - status: Current status
#   - notes: Optional notes about current state or what's needed
#   - verified_date: Date when item was last verified (YYYY-MM-DD)
#
# =============================================================================
# STANDARDS REFERENCE — Audit Document Alignment
# =============================================================================
# Checklist standards align with architectural standards defined in:
#
#   .cursor/audits/MASTER_AUDIT_SUMMARY_2026-02-09.md
#     - Issue categories, severity, systemic patterns
#     - Config management (03b, 03c), error handling (04b), UTC (04f), cloud-agnostic (06b)
#
#   .cursor/audits/REMEDIATION_ROADMAP_2026-02-09.md
#     - Phase 1-2 patterns: broken code, bare except, ruff bypasses, get_config fallbacks
#     - Config migration (03b/03c), error handling (04b), quality gates (09b)
#
#   .cursor/audits/CLOUD_AGNOSTIC_FIX_MASTER_PLAN.md
#     - Testing strategy: unified-trading-library ONLY runs integration tests with real APIs
#     - Consuming services: unit tests with mocks only (no real GCS)
#
#   .cursor/audits/CLOUD_AGNOSTIC_FIX_unified-trading-library.md
#     - Storage/BigQuery API usage, CloudTarget validation
#     - dependency_checker, storage_abstraction, cloud_data_provider patterns
#
#   .cursor/audits/CLOUD_AGNOSTIC_FIX_instruments-service.md
#     - CloudTarget must include bigquery_dataset (required param)
#     - get_config() anti-patterns: use config attributes instead
#     - StandardizedDomainCloudService usage
#
#   .cursor/audits/CLOUD_AGNOSTIC_FIX_market-tick-data-service.md
#     - Dependency checker usage; blocked by unified-trading-library PR #27
#     - Config provides CloudTarget params; no direct google.cloud imports in prod
#
#   .cursor/audits/CLOUD_AGNOSTIC_FIX_deployment-service.md
#     - storage_facade for GCS; bigquery_facade; no hardcoded project IDs
#     - API routes, backends, scripts refactored to use abstractions
#
#   .cursor/audits/VERIFICATION_REPORT_2026-02-10.md
#     - Phase 5 data synergy fixes (distinct from remediation)
#     - Local vs remote sync status (e.g. ml-inference git pull)
# =============================================================================

service_name: "{SERVICE_NAME}"
last_updated: "YYYY-MM-DD"
owner: ""

# =============================================================================
# AUTH SETUP (SSOT for auth_smoke_test.py — see 07-security/service-to-service-auth.md)
# =============================================================================
auth_setup:
  local_auth_method: "adc" # adc | sa_key_file | none
  github_secret_name: "GH_PAT" # Secret name for GitHub Actions (clone private deps)
  cloudbuild_sa_roles: [] # IAM roles required for Cloud Build service account
  inter_service_auth: "none" # none | oauth | mtls
  aws_secret_name: null # AWS Secrets Manager secret name (mirrors GCP Secret Manager)

