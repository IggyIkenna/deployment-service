      - ".env file exists with all required env var names"
      - "All required env vars documented"
      - "No actual secrets in .env (only secret names for Secret Manager lookup)"

  item_03b_unified_config_class:
    description: "Service config extends UnifiedCloudServicesConfig from unified-trading-library"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Config class in {service}/config.py extends UnifiedCloudServicesConfig"
      - "from unified_trading_library import UnifiedCloudServicesConfig"
      - "No direct os.getenv() calls anywhere in codebase (grep -r 'os.getenv' returns 0)"
      - "All env vars accessed via config instance: config.field_name"
      - "Domain-specific fields use Pydantic Field() with validation_alias"
      - "Config singleton pattern: _config = None; def get_config() -> ServiceConfig"
    anti_patterns:
      - "os.getenv('KEY', 'default') anywhere outside config.py"
      - "Own BaseSettings class not extending UnifiedCloudServicesConfig"
      - "Inline dict defaults for complex config"
      - "Multiple config loading mechanisms (YAML + env + hardcoded)"
    reference: ".cursor/audits/MASTER_AUDIT_SUMMARY_2026-02-09.md (Pattern 1), REMEDIATION_ROADMAP_2026-02-09.md (Pattern 3A/3B)"

  item_03c_no_hardcoded_config:
    description: "Domain-specific configuration extracted to config class or centralized YAML"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "No inline dictionaries for instrument/venue/exchange mappings in code"
      - "No hardcoded date ranges, timeframes, or time windows"
      - "No default API URLs hardcoded (use config fields)"
      - "Exchange/venue mappings use VenueMapping from unified-trading-library"
      - "All magic numbers extracted to config with descriptive field names"
      - "Config extractable to YAML without code changes (for infrastructure team)"
    anti_patterns:
      - "KNOWN_ETFS = ['SPY', 'QQQ', ...]"
      - "TICK_WINDOWS = [('2023-05-01', '2023-05-31'), ...]"
      - "DEFAULT_CONFIG = {'key': 'hardcoded_value', ...}"
      - "if exchange == 'binance': ..."

  item_04_standardized_logging:
    description: "Uses setup_cloud_logging() from unified-trading-library (JSON format, GCP logging integration)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "from unified_trading_library import setup_cloud_logging"
      - "setup_cloud_logging() called early in main/CLI"
      - "JSON format enabled for Cloud Logging"
      - "Third-party loggers suppressed appropriately"

  item_04b_unified_error_handling:
    description: "Service uses GenericErrorHandlingService or error handling decorators from unified-trading-library"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "API/network calls use @handle_api_errors decorator or execute_with_error_handling()"
      - "Storage operations use @handle_storage_errors decorator"
      - "from unified_trading_library import ErrorCategory, ErrorSeverity, ErrorContext"
      - "No duplicate error category/severity enums in service code"
      - "Errors classified with ErrorCategory, not just string messages"
      - "Retry logic uses unified-trading-library (not custom implementation)"
    anti_patterns:
      - "class ErrorType(Enum) or class ErrorSeverity(Enum) in service code"
      - "Custom retry decorators"
      - "Bare try/except with only logger.error()"
      - "Hardcoded retry counts/delays outside config"
    reference: ".cursor/audits/MASTER_AUDIT_SUMMARY_2026-02-09.md (Pattern 3), REMEDIATION_ROADMAP_2026-02-09.md (Pattern 1B, 4A/4B/4C)"

  item_04c_multicloud_logging:
    description: "Logging works correctly on GCP (Cloud Run/VM) and AWS (ECS/Lambda)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Uses setup_cloud_logging() from unified-trading-library"
      - "JSON format enabled (CloudRunJSONFormatter for GCP, equivalent for AWS)"
      - "Log levels configurable via --log-level CLI arg (not env var)"
      - "Third-party loggers suppressed to WARNING"
      - "Structured logging with context: log_with_context(), log_error_with_context()"
      - "No print() statements for logging (grep -r 'print(' returns only debug/test)"
    cloud_specific:
      gcp:
        - "Logs appear in Cloud Logging with correct severity"
        - "Trace context propagated for distributed tracing"
      aws:
        - "Logs appear in CloudWatch with correct severity"
        - "X-Ray trace context propagated (if enabled)"

  item_04d_resource_monitoring:
    description: "Uses PerformanceMonitor for continuous resource logging (CPU/memory/disk) to aid crash diagnostics"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "setup_cloud_logging(enable_resource_monitoring=True) called in main/CLI"
      - "Resource metrics logged to Cloud Logging every 30s (default interval)"
      - "High memory warnings logged at >85% threshold with resource_alert context"
      - "CRITICAL memory alerts logged at >90% threshold (potential OOM imminent)"
      - "High CPU warnings logged at >90% threshold"
      - "High disk warnings logged at >90% threshold"
      - "Logs persist in Cloud Logging even after crash (UnbufferedStreamHandler)"
    why_required: |
      When services crash due to OOM or resource exhaustion, we need:
      1. Historical resource metrics leading up to the crash
      2. Warning logs when thresholds were exceeded
      3. Ability to analyze resource trends in Cloud Logging
      Without this, crash root cause analysis is guesswork.

  item_04e_graceful_shutdown:
    description: "Implements SIGTERM/SIGINT handlers for graceful shutdown with final resource state dump"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "GracefulShutdownHandler or setup_graceful_shutdown() from unified-trading-library imported and initialized"
      - "Final resource state logged on shutdown (CPU/memory/disk at termination time)"
      - "Cleanup callback provided and executed before exit"
      - "Logs flushed before process exit"
      - "KeyboardInterrupt (Ctrl+C) handled gracefully with cleanup"
    why_required: |
      Cloud Run and VMs send SIGTERM before termination. Without handlers:
      1. In-flight operations may be lost without cleanup
      2. Final resource state is not logged for post-mortem analysis
      3. Logs may not be flushed, losing the last moments before crash
    example: |
      from unified_trading_library import setup_cloud_logging
      from unified_trading_library.core.signal_handler import GracefulShutdownHandler

      def main():
          setup_cloud_logging(enable_resource_monitoring=True)
          shutdown_handler = GracefulShutdownHandler(cleanup_callback=cleanup)
          # ... service logic ...

  item_04f_utc_datetime_compliance:
    description: "All datetime operations use UTC-aware datetimes; no naive datetime usage in production code"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "No datetime.now() without timezone.utc (grep -r 'datetime.now()' returns 0 outside comments)"
      - "No datetime.utcnow() calls (deprecated in Python 3.12+)"
      - "No datetime.fromtimestamp() without tz=timezone.utc"
      - "No datetime() constructors without tzinfo=timezone.utc (in production code)"
      - "No .replace(tzinfo=None) unless documented with # TZ-NAIVE: intentional for {library}"
      - "No pd.to_datetime() without utc=True (when input is UTC data)"
      - "No datetime.strptime() results used as datetime without .replace(tzinfo=timezone.utc)"
      - "All log timestamps are UTC"
      - "from datetime import timezone present in every file using datetime"
    anti_patterns:
      - "datetime.now() -- uses local timezone, breaks T+1 backfills in non-UTC zones"
      - "datetime.utcnow() -- deprecated, returns naive UTC (no tzinfo attached)"
      - "datetime.fromtimestamp(x) -- uses local timezone for conversion"
      - "pd.to_datetime(col) without utc=True -- produces tz-naive timestamps"
      - "time.localtime() -- converts to local timezone"
    why_required: |
      When running T+1 backfills from a GMT-8 machine at 11 PM local time,
      the system must know it is actually 7 AM UTC the next day. Without
      explicit UTC awareness, date boundaries are wrong, data is misaligned,
      and logs cannot be correlated across services in different timezones.
    example: |
      # WRONG
      now = datetime.now()           # Local timezone -- 11 PM PST
      today = datetime.now().date()  # 2026-02-06 (PST) vs 2026-02-07 (UTC)

      # CORRECT
      from datetime import datetime, timezone
      now = datetime.now(timezone.utc)         # Always UTC
      today = datetime.now(timezone.utc).date() # 2026-02-07 (UTC)

  item_04g_strict_exit_codes:
    description: "CLI/entrypoint exits non-zero on ANY failure (no silent failures in VM/Cloud Run)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "sys.exit(1) on any non-success status (error, partial, warning)"
      - "Only sys.exit(0) when status is explicitly 'success'"
      - "No fallback patterns like result.get('success', True) that default to success"
      - "Handler exceptions propagate to non-zero exit"
      - "Unit tests verify exit code for success, error, partial, and warning states"
    anti_patterns:
      - "sys.exit(0) unconditionally at end of main()"
      - "result.get('success', True) -- defaults to success when key is missing"
      - "except Exception: sys.exit(0) -- swallows errors silently"
      - "Returning status='partial' but exiting 0 -- hides VM failures"
    why_required: |
      In VM and Cloud Run deployments, the orchestrator (systemd, Cloud Run,
      Kubernetes) relies on exit codes to detect failures and trigger retries
      or alerts. An exit code of 0 tells the orchestrator "everything is fine"
      even when instruments generation failed, data was missing, or only some
      dates succeeded. This creates silent failures that go undetected until
      downstream services break hours or days later.

