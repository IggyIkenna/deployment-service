      - "from google.cloud import storage; client = storage.Client()"
      - "get_config('GCP_PROJECT_ID', instruments_config.gcp_project_id) — use config attribute"
      - "CloudTarget(project_id=..., gcs_bucket=...) without bigquery_dataset"
    reference: ".cursor/audits/CLOUD_AGNOSTIC_FIX_MASTER_PLAN.md, CLOUD_AGNOSTIC_FIX_instruments-service.md"

  item_06c_setup_script:
