  item_06b_cloud_agnostic_design:
    description: "Service uses unified-trading-library abstractions for multi-cloud portability (GCP/AWS)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Uses get_storage_client() instead of direct google.cloud.storage imports"
      - "Uses get_secret_client() instead of direct secretmanager imports"
