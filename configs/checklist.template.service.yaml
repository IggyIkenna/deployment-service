      - "Failures in any environment block deployment"
    dependency_checkout:
      pattern: "Use git clone for private dependencies (NOT actions/checkout@v4)"
      unified_trading_library: "REQUIRED - fail if unavailable"
      deployment_service: "OPTIONAL - skip smoke tests if unavailable"
      github_actions_example: |
        # CORRECT: git clone for private repos
        git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/IggyIkenna/unified-trading-library.git

        # WRONG: actions/checkout@v4 has permission issues with private repos
        # - uses: actions/checkout@v4
        #   with:
        #     repository: IggyIkenna/unified-trading-library
        #     token: ${{ secrets.GH_PAT }}
    smoke_test_fallback: |
      Smoke tests should be SKIPPED (not failed) if deployment-service configs are unavailable.
      Use environment variable to track: DEPLOYMENT_CONFIGS_AVAILABLE=true/false
    pytest_exit_code_5: |
      Pytest exit code 5 (no tests collected) should be treated as SUCCESS, not failure.
      This happens when test filters like -k "not gcs" exclude all tests in a directory.

