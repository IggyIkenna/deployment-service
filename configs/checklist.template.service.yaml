      - "CloudTarget uses config attributes, not get_config() with fallbacks"
      - "CLOUD_PROVIDER env var documented in .env file"
      - "AWS buildspec.aws.yaml exists alongside GCP cloudbuild.yaml"
      - "Lazy imports for cloud-specific libraries (google.cloud.*, boto3)"
