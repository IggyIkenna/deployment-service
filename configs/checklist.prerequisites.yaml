# =============================================================================
# Quick Start Commands
# =============================================================================
quick_start:
  gcp:
    description: "Commands to verify and set up GCP prerequisites"
    commands:
      - "gcloud auth list                                           # Check authentication"
      - "gcloud services list --enabled                             # Check APIs enabled"
      - "gsutil ls                                                  # List existing buckets"
      - "python scripts/setup-buckets.py --cloud gcp --list-only   # List required buckets"
      - "python scripts/setup-buckets.py --cloud gcp --dry-run     # Preview bucket creation"
      - "python scripts/setup-buckets.py --cloud gcp               # Create missing buckets"
      - "python deploy.py validate-buckets --service instruments-service --cloud gcp  # Verify"
      - "gcloud artifacts repositories list --location=asia-northeast1"
      - "gcloud secrets list"
      - "gcloud builds triggers list"

  aws:
    description: "Commands to set up AWS prerequisites"
    commands:
      - "aws sts get-caller-identity                               # Check authentication"
      - "cd terraform/shared/aws && terraform init && terraform apply  # Create shared infra"
      - "python scripts/setup-buckets.py --cloud aws --list-only   # List required buckets"
      - "python scripts/setup-buckets.py --cloud aws --dry-run     # Preview bucket creation"
      - "python scripts/setup-buckets.py --cloud aws               # Create missing buckets"
      - "python deploy.py validate-buckets --service instruments-service --cloud aws  # Verify"
      - "cd terraform/cloud-build/aws && terraform init && terraform apply"
      - "aws s3 ls"
      - "aws ecr describe-repositories"
      - "aws secretsmanager list-secrets"
      - "aws codebuild list-projects"
