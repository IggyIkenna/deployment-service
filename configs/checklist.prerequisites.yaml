# Deployment readiness delta — canonical compliance checklist: unified-trading-codex/10-audit/batch|live/checklist.prerequisites.yaml
# One-Time Prerequisites Checklist
# =================================
# This checklist covers infrastructure that must be set up ONCE before any services
# can be deployed. These are one-time setup tasks that create foundational resources.
#
# Run this checklist when:
# - Setting up a new cloud environment (GCP or AWS)
# - Migrating to a new cloud provider
# - Setting up a new AWS account or GCP project
#
# Status values:
#   - done: Item is complete
#   - partial: Item is partially complete (add notes)
#   - pending: Item needs work
#   - n/a: Not applicable

checklist_type: prerequisites
last_updated: "2026-01-28"
owner: ""

# =============================================================================
# AUTH SETUP PREREQUISITES (One-time, required for all deployments)
# =============================================================================
auth_setup_prerequisites:
  secret_manager:
    description: "Secret Manager (GCP) or Secrets Manager (AWS) API enabled and configured"
    gcp: "Secret Manager API enabled; secrets created per credentials-registry.yaml"
    aws: "Secrets Manager available; secret names mirror GCP convention"
    verification: "gcloud secrets list (GCP) or aws secretsmanager list-secrets (AWS)"
  gcp_service_account:
    description: "GCP Service Account with IAM roles for Cloud Build and deployments"
    roles:
      - "roles/cloudbuild.builds.builder"
      - "roles/storage.objectAdmin (or scoped to buckets)"
      - "roles/secretmanager.secretAccessor"
    verification: "gcloud projects get-iam-policy --format=json"
  github_secrets:
    description: "GitHub repository secrets configured for CI/CD"
    required_secrets:
      - "GH_PAT — clone private deps (unified-trading-library, etc.)"
      - "GOOGLE_APPLICATION_CREDENTIALS — GCP SA key JSON (or use Workload Identity)"
    verification: "GitHub repo Settings → Secrets and variables → Actions"

# =============================================================================
# GCP Prerequisites
# =============================================================================
gcp_prerequisites:

  authentication:
    description: "GCP authentication and access configured"
    items:
      gcloud_auth:
        description: "gcloud CLI authenticated with appropriate account"
        status: done
        notes: "gcloud auth login / gcloud auth application-default login"
        verification: "gcloud auth list shows correct account"

      service_account:
        description: "Service account JSON available for CI/CD"
        status: done
        notes: "Used by Cloud Build and service deployments"
        verification: "GOOGLE_APPLICATION_CREDENTIALS set or ADC configured"

      required_apis_enabled:
        description: "All required GCP APIs enabled"
        status: done
        notes: ""
        verification: "gcloud services list --enabled"
        apis:
          - Cloud Run API
          - Cloud Build API
          - Compute Engine API
          - Cloud Storage API
          - Cloud Workflows API
          - Cloud Scheduler API
          - Secret Manager API
          - Artifact Registry API
          - BigQuery API (for market-tick-data-service)

  shared_infrastructure:
    description: "Shared infrastructure created via Terraform"
    items:
      terraform_state_bucket:
        description: "GCS bucket for Terraform state exists"
        status: done
        notes: "terraform-state-test-project"
        verification: "gsutil ls gs://terraform-state-test-project"
        command: "gsutil mb -l asia-northeast1 gs://terraform-state-test-project"

      all_service_buckets:
        description: "All required GCS buckets created for services"
        status: done
        notes: "Use setup-buckets.py script to create missing buckets"
        verification: "python deploy.py validate-buckets --service <service> --cloud gcp"
        commands:
          - "python scripts/setup-buckets.py --cloud gcp --list-only  # List required buckets"
          - "python scripts/setup-buckets.py --cloud gcp --dry-run    # Show what would be created"
          - "python scripts/setup-buckets.py --cloud gcp              # Create missing buckets"

      artifact_registry:
        description: "Artifact Registry repositories created for all 11 services"
        status: done
        notes: "Created via terraform/shared/gcp"
        verification: "gcloud artifacts repositories list --location=asia-northeast1"
        repositories:
          - instruments
          - market-data-tick-handler
          - market-data-processing-service
          - features-calendar-service
          - features-delta-one-service
          - features-volatility-service
          - features-onchain-service
          - ml-training-service
          - ml-inference-service
          - strategy-service
