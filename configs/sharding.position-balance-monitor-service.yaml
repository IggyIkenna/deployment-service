# Sharding Configuration: position-balance-monitor-service
# Calculates positions across venues (domain data engine)

service: position-balance-monitor-service
description: Calculate positions from execution/trade data across venues

# Docker image (used by both Cloud Run and VM)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/position-balance-monitor-service/position-balance-monitor-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: position-balance-monitor-service-job

# Sharding dimensions (order defines hierarchy - most decisive first)
dimensions:
  - name: category
    type: fixed
    values: [CEFI, TRADFI, DEFI]
    description: Market category to calculate positions for

  - name: venue
    type: fixed
    values:
      # Dynamically populated from venues.yaml per category
      # CEFI: BINANCE-SPOT, BINANCE-FUTURES, OKX, UPBIT, COINBASE, HYPERLIQUID, ASTER
      # DEFI: AAVE_V3_ETH, UNISWAPV2-ETH, UNISWAPV3-ETH, COMPOUND_V3_ETH
      # TRADFI: CME, CBOE, NYSE
    description: Venue to calculate positions for

  - name: date
    type: date_range
    granularity: daily
    description: Date to calculate positions for

# CLI argument mappings
cli_args:
  category: --category
  venue: --venue
  start_date: --start-date
  end_date: --end-date

# Service-specific CLI flags
cli_flags:
  operation: "--operation monitor"
  mode: "--mode batch"

# Compute recommendations
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 30
    description: Position calculation from execution data
    gcsfuse_buckets: []
  cloud_run:
    memory: 4Gi
    cpu: 2
    timeout_seconds: 3600

# Estimated runtime per shard (category × venue × date)
runtime:
  estimated_minutes: 10
  notes: Varies by trading volume on venue/date

# Data dependencies (inputs)
input_data:
  - service: execution-service
    bucket_pattern: "execution-store-{project_id}"  # Single execution bucket for all categories
    path_pattern: "results/date={date}/strategy_id=*/instruction_type=*/run_id=*/positions.parquet"  # Read positions from execution results
    required: true

  - service: instruments-service
    bucket_pattern: "instruments-store-{project_id}"
    path_pattern: "instruments/{category}/{venue}/{date}/instruments_*.parquet"
    required: true

# Data outputs
output_data:
  bucket_pattern: "positions-store-{project_id}-{category_lower}"
  path_pattern: "positions/{venue}/{date}/positions_{timestamp}.parquet"
  schema_ref: "position-balance-monitor-service/schemas/output_schemas.py"

# Missing data handling
missing_data_strategy:
  execution_data_missing: "Skip date (no executions = no position changes)"
  instruments_data_missing: "Fail loudly (need instrument metadata for position calculation)"

# Sharding alignment
sharding_alignment:
  failure_isolation: "Shard-level (one venue/date failure does not affect other shards)"
  completion_check: "Per category×venue×date (matches sharding dimension)"
  rationale: "Position calculation is independent per venue/date; failure in one shard does not block others"

# Notes
notes:
  - "Position-balance-monitor is NOT a UI - it's a domain data engine"
  - "Calculates positions used by strategy-service and risk-and-exposure-service"
  - "Live mode: Single deployment per category, parallel threads per venue"
  - "Batch mode: Parallel jobs per category×venue×date"
  - "Output is domain data (positions) stored in GCS and published to Pub/Sub"
