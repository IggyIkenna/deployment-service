# items that still carried the retired repo name). The 2 ids unique to v2.0 (BASE-19,
# BASE-22) were added verbatim. Result: 86 + 24 + 2 = 112 items total.
#
# This file's PATH (deployment-service/configs/checklist.template.yaml) was already what 5
# other docs across unified-trading-pm and deployment-service cited as THE checklist before
# this reconciliation -- it did not previously exist on disk. Three different stale item
# counts (51 / 52 / 37) had accumulated in codex/06-coding-standards/README.md, all tracing
# back to a since-deleted ancestor of this same path (52 items / 7 phases); all three are
# corrected to 112 as part of this same change.
#
# Both source templates are RETAINED at their original codex/10-audit/ paths (marked
# "preserved for reference" already) with a header pointer added to this file -- they are
# not deleted, but they are no longer the citation target for new work.
#
# SEPARATE, live per-repo system -- NOT superseded by this file: codex/10-audit/README.md's
# v3.0 CR/DR/BR (Code/Deployment/Business Readiness) per-repo readiness model
# (REPO_READINESS_CHECKLIST.yaml + codex/10-audit/repos/*.yaml, 65 populated repo files)
# already reconciled the v2.0 "enhanced" file's content into its own `code_audit_items`
# cross-reference in March 2026 -- per codex/10-audit/consolidation-gap-analysis.md: "Net
# gap: Zero items from v2.0 are uncovered by the v3.0 CR/DR/BR model." This file's role is
# the STANDALONE checklist-item reference the 5 legacy citing docs already expected at this
# exact path -- it is not a competing live tracker. Fully reconciling the two systems (so a
# per-repo audit and this generic template never drift) is flagged as separate follow-up
# work, out of scope for this reconciliation.
#
# 2026-08-08 status-correction pass: of the 9 items tagged [PLANNED] in the v1.0 source,
# all 9 were re-checked against current codex SSOTs for real live-infra backing. 4 flipped
# to [LIVE] (ANL-02, WRK-02, WRK-03, OBS-14), 5 flipped to [PARTIALLY LIVE] with an honest
# caveat (WRK-04, WRK-05, SEC-07, ANL-03, ANL-04) -- each carries a `ssot_ref` citing the
# doc that proves it. No new item ids were authored in this pass.
#
# Copy this file to checklist.{service}.yaml and assess each item.
#
# Status values:
#   pass          - Item fully satisfied; evidence confirms compliance
#   fail          - Item not satisfied; remediation required
#   partial       - Partially satisfied; some aspects need work
#   not_assessed  - Not yet evaluated
#   na            - Not applicable to this service (document reason in notes)
#
# Priority levels:
#   P0 - Critical: blocks production deployment
#   P1 - High: must fix before live trading
#   P2 - Medium: technical debt; fix when capacity allows
#   P3 - Low: best-practice polish
#
# Mode:
#   batch - Applies only to batch/pipeline services
#   live  - Applies only to live trading services
#   both  - Applies to all services
#
# Enhanced fields (carried from v2.0, present on the 24 items merged from that template):
