# Sharding Configuration: features-delta-one-service
# Generates delta-one features (technical indicators, moving averages, etc.)

service: features-delta-one-service
description: Generate delta-one features from candle data

# Docker image (used by both Cloud Run and VM)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/features/delta-one-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: features-delta-one-service-job

# Sharding dimensions (order defines hierarchy - most decisive first)
dimensions:
  - name: category
    type: fixed
    values: [CEFI, TRADFI, DEFI]
    description: Market category to process

  - name: feature_group
    type: fixed
    values:
      - technical_indicators
      - moving_averages
      - price_momentum
      - volume_profile
      - funding_oi
      - liquidation_intensity
      - premium_basis
      - orderbook_imbalance
      - volatility_regime
      - correlation_features
      - regime_labels
      - rolling_returns
      - price_levels
      - swing_outcome_targets
      - target_labels
      - time_features
      - vwap_features
    description: Feature group to generate (orthogonal groups)

  - name: date
    type: date_range
    granularity: weekly
    description: Date range split into 7-day chunks

# CLI argument mappings
cli_args:
  category: --category
  feature_group: --feature-group
  start_date: --start-date
  end_date: --end-date

# Service-specific CLI flags (per codex cli-standards: --operation compute --mode batch)
cli_flags:
  operation: "--operation compute"
  mode: "--mode batch"

# Compute recommendations
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 50
    description: Memory-intensive feature calculation
    gcsfuse_buckets: []
      # Disabled: Large buckets cause OOM; use GCS API instead
  cloud_run:
    memory: 8Gi
    cpu: 2
    timeout_seconds: 7200

# Estimated runtime per shard
runtime:
  estimated_minutes: 45
  notes: Varies by feature_group - technical_indicators is heaviest
