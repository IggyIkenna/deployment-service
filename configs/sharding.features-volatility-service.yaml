# Sharding Configuration: features-volatility-service
# Generates volatility features (IV surfaces, term structure, basis)

service: features-volatility-service
description: Generate volatility features from options/futures data

# Docker image (used by both Cloud Run and VM)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/features/volatility-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: features-volatility-service-job

# Sharding dimensions (order defines hierarchy - most decisive first)
dimensions:
  - name: category
    type: fixed
    values: [CEFI, TRADFI]  # DEFI not supported (no options data)
    description: Market category to process

  - name: feature_group
    type: fixed
    values:
      - options_iv
      - options_term_structure
      - futures_basis
      - futures_term_structure
    description: Volatility feature group to generate

  - name: date
    type: date_range
    granularity: daily
    description: Date range split into daily chunks

# CLI argument mappings
cli_args:
  category: --category
  feature_group: --feature-group
  start_date: --start-date
  end_date: --end-date

# Service-specific CLI flags (per codex: --operation compute --mode batch)
cli_flags:
  operation: "--operation compute"
  mode: "--mode batch"

# Compute recommendations
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 30
    description: Heavy math for IV surface fitting
    gcsfuse_buckets: []
      # Disabled: Large buckets cause OOM; use GCS API instead
  cloud_run:
    memory: 8Gi
    cpu: 2
    timeout_seconds: 3600

# Estimated runtime per shard
runtime:
  estimated_minutes: 20
  notes: options_iv is heaviest (surface fitting)
