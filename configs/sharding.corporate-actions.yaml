# Sharding Configuration: corporate-actions
# Processes corporate actions data (dividends, splits, earnings)

service: corporate-actions
description: Process corporate actions for all venues

# Docker image (uses same instruments-service image with different mode)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/instruments/instruments-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: instruments-service

# =============================================================================
# SHARDING DIMENSIONS
# These define how work is split into parallel shards
# Order defines hierarchy - dimensions are combined as cartesian product
#
# corporate-actions: category × 1 = 1 shard total (TRADFI only)
# Note: Corporate actions only apply to TRADFI equities (dividends, splits, earnings)
# CEFI and DEFI do not have traditional corporate actions.
#
# DATE GRANULARITY: none
# yfinance has no date filter on API calls - we fetch ALL data for all tickers
# in a single bulk download, then filter and upload into daily partitions locally.
# The start-date / end-date are NOT passed to the service CLI.
# =============================================================================
dimensions:
  - name: category
    type: fixed
    values: [TRADFI]
    description: Market category to process (corporate actions are TRADFI-only)

  - name: date
    type: date_range
    granularity: none
    description: >
      No date sharding - yfinance has no date filter. The service fetches
      all corporate actions data in bulk and materializes daily partitions.

# =============================================================================
# GCS OUTPUT STRUCTURE (new layout)
# =============================================================================
# gs://instruments-store-tradfi-test-project/corporate_actions/
# ├── by_ticker/              # Raw data from yfinance (append-only)
# │   ├── AAPL/
# │   │   ├── dividends.csv
# │   │   ├── splits.csv
# │   │   └── earnings.csv
# │   └── ... (all tickers)
# │
# ├── by_date/                # Materialized view (generated from by_ticker)
# │   ├── day-2024-02-09/
# │   │   ├── dividends.parquet
# │   │   ├── splits.parquet
# │   │   └── earnings.parquet
# │   └── ... (one folder per date with events)
# │
# ├── metadata/
# │   ├── ticker_registry.yaml
# │   └── coverage_report.json
# │
# └── config/
#     └── last_update.yaml     # When each ticker was last fetched

# =============================================================================
# CLI ARGUMENTS
# All arguments passed to the service container
# =============================================================================

# Required mode for the service
cli_flags:
  operation: "--operation corporate_actions"
  mode: "--mode batch"
  upload_to_gcs: --upload-to-gcs

# Mapping: dimension name -> CLI argument
# These are populated from shard dimensions
cli_args:
  category: --category
  date: null # granularity=none means no --start-date/--end-date passed

# Optional arguments that can be passed via deploy CLI --extra-args
# Listed here for documentation
cli_optional:
  - name: force
    flag: --force
    description: Force processing all tickers (overrides last_update checks)
  - name: gcs-bucket
    flag: --gcs-bucket
    description: Override GCS bucket (uses category-specific defaults otherwise)

# =============================================================================
# COMPUTE CONFIGURATION
# =============================================================================
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 40 # >= 2x RAM (16GB) for swap
    preemptible: false # Non-preemptible: PREEMPTIBLE_CPUS quota is only 16 in asia-northeast1
    timeout_seconds: 86400 # 24 hours (maximum)
    self_delete: true
    description: Moderate workload - API calls + data processing
    gcsfuse_buckets: []
      # Disabled: Use GCS API for all I/O

  cloud_run:
    memory: 4Gi
    cpu: "2"
    timeout_seconds: 86400 # 24 hours (maximum)
    max_retries: 3

# =============================================================================
# RUNTIME ESTIMATES
# =============================================================================
runtime:
  estimated_minutes: 30
  notes: |
    Single-shard bulk download - TRADFI-only (crypto/defi do not have corporate actions):
    - Fetches all tickers from yfinance (no date filter on API)
    - Saves raw CSVs per ticker in by_ticker/
    - Materializes daily parquet partitions in by_date/
    - Updates ticker_registry.yaml and coverage_report.json
