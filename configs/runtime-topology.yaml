version: 1
ssot_ref: unified-trading-pm/configs/runtime-topology.yaml

# ===========================================================================
# EXECUTION SERVICE — ORDER LIFECYCLE EVENTS
# topology-execution-order-lifecycle
# ===========================================================================
#
# Full order lifecycle PubSub publishing.
# execution-service must publish ORDER_CREATED, ORDER_UPDATED, ORDER_CANCELLED,
# ORDER_FILLED, ORDER_REJECTED to PubSub so that:
#   - position-balance-monitor-service can reconcile positions in real-time
#   - pnl-attribution-service can attribute PnL at fill time
#   - strategy-service receives order acknowledgement (handshake)
#
# Implementation note:
#   - In live mode: publish each event to PubSub topic 'order-lifecycle'
#   - In batch mode: persist to GCS path:
#       gs://execution-store-{project}/order_lifecycle/by_date/day={date}/
#   - Correlation ID must be propagated end-to-end (order → fill → PBM → risk)
# ===========================================================================

topology_execution_order_lifecycle:
  id: topology-execution-order-lifecycle
  producer: execution-service
  consumers:
    - position-balance-monitor-service
    - pnl-attribution-service
    - strategy-service
  data: order_lifecycle_events
  event_types:
    - ORDER_CREATED
    - ORDER_UPDATED
    - ORDER_CANCELLED
    - ORDER_FILLED
    - ORDER_REJECTED
  modes:
    batch:
      transport: gcs
      gcs_path: "gs://execution-store-{project}/order_lifecycle/by_date/day={date}/"
      format: parquet
    live:
      transport: pubsub
      topic: order-lifecycle
      persistence:
        sink: gcs
        path: "gs://execution-store-{project}/order_lifecycle/by_date/day={date}/"
  required_fields:
    - client_order_id
    - exchange_order_id
    - exchange_timestamp
    - instrument_id
    - side
    - quantity
    - price
    - status
    - correlation_id
  status: pending_implementation
  implementation_todo: |
    1. Add order lifecycle event publisher to execution_service/engine/execution/
    2. Publish events via UCI get_event_bus() — never direct PubSub import
    3. Add correlation_id to all order events
    4. Write integration test verifying all 5 event types are emitted per order
    5. Add quality gate: check order lifecycle events emitted in test run

# ===========================================================================
# T+1 RECONCILIATION — EXECUTION RECON
# topology-t1-execution-recon
# ===========================================================================
#
# Execution T+1 reconciliation compares live fills vs benchmark execution
# (TWAP / VWAP / arrival price) to calculate execution alpha PnL.
#
# This is a BATCH operation — triggered by Cloud Scheduler daily after
# batch pipeline completes. It does NOT require live PubSub.
#
# Formula:
#   execution_alpha_pnl = actual_fill_price vs benchmark_price x notional
#   dimensions: [client, subaccount, venue, date]
#
# Output:
#   gs://execution-store-{project}/t1_recon/by_date/day={date}/
#   + sent to pnl-attribution-service for aggregation with strategy T+1
#
# Implementation note:
#   - Reads from: gs://execution-store-{project}/order_lifecycle/by_date/day={date}/
#   - Reads benchmark from: TWAP/VWAP/arrival computed from market-tick-data
#   - Writes to: gs://execution-store-{project}/t1_recon/by_date/day={date}/
# ===========================================================================

topology_t1_execution_recon:
  id: topology-t1-execution-recon
  producer: execution-service
  consumers:
    - pnl-attribution-service
  data: execution_t1_recon_output
  mode: batch_only
  trigger: cloud_scheduler_daily
  schedule: "0 6 * * *"  # 06:00 UTC daily, after batch pipeline completes
  inputs:
    - source: gcs
      path: "gs://execution-store-{project}/order_lifecycle/by_date/day={date}/"
      description: Live order fills from order lifecycle events
    - source: gcs
      path: "gs://market-data-tick-cefi-{project}/raw_tick_data/by_date/day={date}/"
      description: Market tick data for benchmark price calculation
  output:
    transport: gcs
    path: "gs://execution-store-{project}/t1_recon/by_date/day={date}/"
    format: parquet
    schema:
      - client_id: string
      - subaccount_id: string
      - venue: string
      - instrument_id: string
      - date: date
      - actual_fill_price: float
      - benchmark_price: float
      - benchmark_type: string  # TWAP | VWAP | ARRIVAL
      - execution_alpha_bps: float
      - execution_alpha_usd: float
      - notional_usd: float
  benchmark_types:
    - TWAP
    - VWAP
    - ARRIVAL
  aggregation:
    formula: "overall_pnl = strategy_pnl + execution_alpha_pnl"
    description: Aggregated with strategy T+1 in pnl-attribution-service
  status: pending_implementation
  implementation_todo: |
    1. Create execution_service/recon/t1_execution_recon.py module
    2. Implement benchmark price calculators (TWAP, VWAP, arrival)
    3. Read live fills from GCS order_lifecycle path
    4. Calculate execution alpha per fill vs benchmark
    5. Write output parquet to t1_recon GCS path
    6. Add Cloud Scheduler job definition in terraform/services/execution-service/
    7. Wire output to pnl-attribution-service input in PM runtime-topology.yaml
    8. Add unit tests: test_t1_execution_recon.py

