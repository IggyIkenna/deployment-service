# Dependency Health Policies — per-dependency timing + fallback registry
#
# Schema: unified_api_contracts.canonical.crosscutting.dependency.DependencyHealthPolicy
# Loader:  deployment-service/scripts/load_dependency_policies.py
# Plan:    plans/active/connectivity_dependency_buffer_policy_2026_05_23.md
#
# All timing values are marked # TUNE — operator must calibrate to real SLA data.
# Escalation ladder (outage_seconds evaluated greatest-first):
#   outage > hard_escalation_seconds OR fallback_available=False → SEV0
#   outage > expected + warning + human_investigation (default 900s) → SEV1
#   outage > expected + warning → WARN
#   outage <= expected → None (no alert)

