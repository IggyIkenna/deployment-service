cluster: full
description: Full pipeline — all services, all categories
category: ALL
services:
  - instruments-service
  # corporate-actions: repo not yet created — uncomment when available
  # - corporate-actions
  - market-tick-data-service
  - market-data-processing-service
  - features-calendar-service
  - features-delta-one-service
  - features-volatility-service
  - features-onchain-service
  - features-cross-instrument-service
  - features-multi-timeframe-service
  - features-sports-service
  - features-commodity-service
  # ml-training-service + ml-inference-service removed 2026-05-21: consolidated into ml-service (ml_repo_consolidation_2026_05_19.md)
  - ml-service
  - strategy-service
  - execution-service # LIVE operational mode (automated strategies)
  - execution-service:manual # MANUAL operational mode (operator booking + backup)
  # position-balance-monitor-service, pnl-attribution-service, risk-and-exposure-service
  # removed 2026-05-21: consolidated into strategy-service (strategy_repo_consolidation_2026_05_19.md)
  # risk-management-service: repo not yet created — uncomment when available
  # - risk-management-service
  - alerting-service
  - batch-live-reconciliation-service
  - trading-agent-service

# Batch scheduling
schedule:
  cron: "0 6 * * *" # 6am UTC daily
  as_of: yesterday # T+1 convention
  timezone: UTC

# Live mode settings
live:
  health_check_interval_s: 30
  readiness_timeout_s: 120
