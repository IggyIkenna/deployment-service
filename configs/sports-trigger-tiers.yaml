# Sports Trigger Tiers — fixture-proximate job scheduling
#
# Defines what data to collect relative to fixture kickoff times.
# The sports trigger scheduler reads the fixture calendar from GCS,
# determines which fixtures are at which T-minus stage, and fires
# standard batch CLI invocations.
#
# Sports "live" = batch with a fixture-proximate or rolling date window,
# fired from Cloud Run jobs (warm-start ~1s) for periodic tiers and from
# the scheduler for per-fixture triggers.
#
# SSOT: unified-trading-pm/codex/02-data/sports-scheduling-and-sharding.md
#
# Cloud Run dispatch
# ------------------
# Each service entry carries an optional ``cloud_run_job_name`` field naming
# the GCP Cloud Run Job to trigger when the scheduler runs with
# ``--backend cloud``.  If the field is absent or empty the scheduler logs a
# warning and skips the cloud dispatch for that service.  ``cloud_run_config``
# must be supplied to ``SportsTriggerScheduler`` with ``project_id``,
# ``region``, and ``service_account_email`` (the CLI's ``--cloud-run-*``
# flags, defaulted from ``DeploymentConfig`` — see
# ``deployment_service/cli/commands/sports_trigger.py``).
#
# 2026-07-08 fix (unified-trading-pm/plans/active/issues/
# sports_trigger_scheduler_cloud_dispatch_broken_2026_07_08.md): the
# ``cloud_run_job_name`` values below point at REAL, ALREADY-DEPLOYED Cloud Run
# Jobs, NOT a set of scheduler-specific ``sports-trigger-*`` jobs (those were
# never provisioned; verified via `gcloud run jobs list` returning zero matches
# for any of them). Each job's container ``command`` is unset (image
# ENTRYPOINT handles the module invocation) and ``args`` is CLI-flags-only —
# ``CloudRunBackend.deploy_shard`` overrides only ``args`` per execution, so
# every dispatch here must NOT include a "python -m <module>" prefix
# (``SportsTriggerScheduler._strip_python_module_prefix`` handles this). No
# dedicated ml-service job exists yet — that entry ships with an empty
# ``cloud_run_job_name`` so the gap fails loudly (a warning log) instead of
# pointing at a non-existent name.
#
# 2026-07-13 fix (instruments-service SPORTS dispatches OOM'd
# uts-prod-instruments-service-t1-recon, 4cpu/8Gi — a legacy, RETIRED all-AG
# job now baked in as a DEFI-only default, per t1_batch_scheduler.tf's own
# comment): every SPORTS-entity ``instruments-service`` dispatch below now
# points at ``uts-prod-instruments-service-sports-fixtures`` (8cpu/32Gi,
# confirmed via `gcloud run jobs describe` — the same job the fixture-proximate
# 4x-daily cron already uses successfully for the full multi-entity sports
# fetch). Other dispatches (``uts-prod-market-tick-data-service-fast-t1-recon``,
# ``features-service-sports-job``) are unaffected — only the misrouted
# instruments-service SPORTS entries changed.
#
# 2026-07-15 fix (features_sports_service_consolidation_deploy_2026_07_15.md,
# todo 7 prerequisite): the two ``features-service`` feature-compute entries
# (features_pre_match, features_post_match) were repointed from the retired
# legacy ``features-sports-service-job`` to the consolidated
# ``features-service-sports-job``. The consolidated image's baked entrypoint is
# the multi-family dispatcher (``python -m features_service``), so the scheduler
# now injects ``--feature-family sports`` before the family flags — see
# ``SportsTriggerScheduler._build_cli_cmd`` / ``_MULTI_FAMILY_DISPATCH_SERVICES``.

# Tier 1: Discovery — periodic, not fixture-proximate.
# Refreshes the fixture calendar and slow-changing reference data on a
# rolling window: every run, re-fetch [today - lookback_days, today +
# lookahead_days] and OVERWRITE existing parquets. Without overwrite, newly
# announced fixtures (cup draws, TV reschedules, playoff brackets) never
# hit the manifest and stay as stale "missing" / "empty_confirmed".
#
# lookahead_days=7 is the API-Football confirmed-schedule horizon. Beyond
# that, schedule shifts mean we'd freeze invalid data. See codex §4.
discovery:
  description: Fixture calendar + slow-changing reference data (rolling)
  frequency_hours: 6
  rolling_window:
    lookback_days: 1 # absorbs late API-Football schedule corrections
    lookahead_days: 7 # API-Football confirmed-schedule horizon
    force_overwrite: true # disable skip-if-exists inside the window
  services:
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: FIXTURES
      description: Refresh fixture calendar (rolling today-1..today+7)
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: STANDINGS
      description: Refresh league standings

# Tier 2: Reference refresh — daily or at window boundaries
# Injuries, transfers, team rosters — changes more frequently
reference:
  description: Daily reference data refresh (injuries, transfers, rosters)
  frequency_hours: 24
  window_aware: true # Only run transfer-related items during transfer windows
  services:
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: INJURIES
      description: Refresh injury/suspension data for all leagues
      run_always: true
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: TRANSFERS
      description: Refresh transfer data (only during transfer windows)
      run_always: false
      window_condition: transfer_window_open
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: LEAGUES
      description: Refresh leagues roster (season-boundary only — promotion/relegation)
      run_always: false
      window_condition: season_boundary
    - service: instruments-service
      operation: instruments
      category: SPORTS
      cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
      args:
        --sports-entity: TEAMS
      description: Refresh per-league team roster (season-boundary only)
      run_always: false
      window_condition: season_boundary

# Tier 3: Pre-match — fixture-proximate trigger windows
# Fires at specific T-minus offsets before kickoff
pre_match:
  description: Fixture-proximate data collection
  triggers:
    - name: odds_t24h
      offset_hours: -24
      tolerance_minutes: 30
      services:
        - service: market-tick-data-service
          operation: download
          category: SPORTS
          cloud_run_job_name: "uts-prod-market-tick-data-service-fast-t1-recon"
          description: Odds snapshot at T-24h
        - service: instruments-service
          operation: instruments
          category: SPORTS
          cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
          args:
            --sports-entity: PREDICTIONS
          description: Pre-match predictions

    - name: odds_t6h
      offset_hours: -6
      tolerance_minutes: 30
      services:
        - service: market-tick-data-service
          operation: download
          category: SPORTS
          cloud_run_job_name: "uts-prod-market-tick-data-service-fast-t1-recon"
          description: Odds snapshot at T-6h

    - name: odds_t1h
      offset_hours: -1
      tolerance_minutes: 15
      services:
        - service: market-tick-data-service
          operation: download
          category: SPORTS
          cloud_run_job_name: "uts-prod-market-tick-data-service-fast-t1-recon"
          description: Closing odds snapshot at T-1h
        - service: instruments-service
          operation: instruments
          category: SPORTS
          cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
          args:
            --sports-entity: LINEUPS
          description: Confirmed lineups (when available)
        - service: instruments-service
          operation: instruments
          category: SPORTS
          cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
          args:
            --sports-entity: WEATHER
          description: Match-day weather nowcast

    - name: features_pre_match
      offset_hours: -1
      tolerance_minutes: 15
      depends_on: odds_t1h
      services:
        - service: features-service
          operation: compute
          category: SPORTS
          # Consolidated multi-family job (2026-05-08 features-repo consolidation;
          # legacy features-sports-service-job retired). Its baked entrypoint is
          # `python -m features_service` (the multi-family dispatcher), so the
          # scheduler injects `--feature-family sports` before these flags —
          # see SportsTriggerScheduler._build_cli_cmd / _MULTI_FAMILY_DISPATCH_SERVICES.
          cloud_run_job_name: "features-service-sports-job"
          args:
            --tables: fixture_features,odds_features
          description: Compute pre-match features (fixture + odds velocity/CLV/steam) from all collected data

    - name: inference_pre_match
      offset_hours: -1
      tolerance_minutes: 10
      depends_on: features_pre_match
      services:
        - service: ml-service
          operation: infer
          category: SPORTS
          # No dedicated Cloud Run Job exists for ml-service yet (verified
          # 2026-07-08: `gcloud run jobs list` has no ml-service job in prod,
          # only a manifest-consolidator job). Left empty so the dispatcher's
          # existing "No cloud_run_job_name — skipping" warning fires loudly
          # instead of pointing at a name that doesn't resolve. Provisioning
          # a real ml-service Cloud Run Job is tracked separately (see
          # unified-trading-pm/plans/active/issues/
          # sports_trigger_scheduler_cloud_dispatch_broken_2026_07_08.md).
          cloud_run_job_name: ""
          description: Run ML inference for pre-match predictions

# Tier 4: Post-match — after fixture completion
# Fires at T+offset after final whistle
post_match:
  description: Post-match data collection
  triggers:
    - name: stats_immediate
      offset_minutes: 30
      services:
        - service: instruments-service
          operation: instruments
          category: SPORTS
          cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
          args:
            --sports-entity: FIXTURE_STATS
          description: Final match stats (goals, shots, cards, etc.)

    - name: stats_delayed
      offset_hours: 24
      services:
        - service: instruments-service
          operation: instruments
          category: SPORTS
          cloud_run_job_name: "uts-prod-instruments-service-sports-fixtures"
          args:
            --sports-entity: XG
          description: Delayed advanced stats (xG from Understat/FootyStats)

    - name: features_post_match
      offset_hours: 25
      tolerance_minutes: 60
      depends_on: stats_delayed
      services:
        - service: features-service
          operation: compute
          category: SPORTS
          # Consolidated multi-family job (see features_pre_match note above) —
          # scheduler injects `--feature-family sports` before these flags.
          cloud_run_job_name: "features-service-sports-job"
          args:
            --tables: derived_features
          description: Compute post-match derived features (footystats/understat final stats), T+25h after final whistle

# GCS fixture calendar source
# Primary path: sports_reference/fixtures/day={date}/ (legacy, has historical data)
# Fallback: instrument_availability/by_date/day={date}/league={league}/venue=API_FOOTBALL_FIXTURES/
# Future: sports_reference/by_date/day={date}/entity=fixtures/ (new convention, not yet populated)
fixture_calendar:
  bucket_template: instruments-store-sports-{project_id}
  path_templates:
    - sports_reference/fixtures/day={date}/
    - sports_reference/by_date/day={date}/entity=fixtures/
  kickoff_field: kickoff_utc
  league_field: league_id
  fixture_id_field: fixture_id
