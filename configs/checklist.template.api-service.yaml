# API Service Production Readiness Checklist Template
# ===================================================
# Copy this template to checklist.{api-service}.yaml and fill in status for each item.
#
# Status values:
#   - done: Item is complete
#   - partial: Item is partially complete (add notes)
#   - pending: Item needs work
#   - n/a: Not applicable to this service
#
# Each item has:
#   - status: Current status
#   - notes: Optional notes about current state or what's needed
#   - verified_date: Date when item was last verified (YYYY-MM-DD)
#
# =============================================================================
# STANDARDS REFERENCE
# =============================================================================
# This checklist covers API-service-specific concerns:
#   - FastAPI endpoints (REST + SSE)
#   - Authentication (OAuth/JWT)
#   - Health probes (/health, /readiness)
#   - Event logging with correlation_id
#   - Structured error responses
#   - Observability compliance per REQUIRED_EVENT_FIELDS
# =============================================================================

service_name: "{API_SERVICE_NAME}"
last_updated: "YYYY-MM-DD"
owner: ""

# =============================================================================
# PHASE 1: Repository Foundation (Items 1-6)
# =============================================================================
auth_setup:
  local_auth_method: "adc" # adc | sa_key_file | none
  github_secret_name: "GH_PAT"
  cloudbuild_sa_roles: []
  inter_service_auth: "none" # none | oauth | mtls
  aws_secret_name: null
  # Venue credential secrets (Tranche B execution clients only)
  # Pattern: exec-{client}-{venue}-{account_type}
  # Resolved via CredentialsRegistry.exec_secret_for_client() in UCI
  exec_credentials_pattern: "exec-{client}-{venue}-{account_type}"
  # Service account secret (used for S2S auth Phase 0)
  # Pattern: {service}-service-account
  service_account_secret: null # e.g. execution-service-service-account

phase_1_repository_foundation:
  item_01_repository_exists:
    description: "API service repo is present in workspace"
    status: pending
    notes: ""
    verified_date: null

  item_02_dependency_management:
    description: "pyproject.toml with all dependencies pinned; uv.lock committed (UV for installs)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "pyproject.toml exists with requires-python >=3.13,<3.14"
      - "uv.lock exists and is committed"
      - "UV used for all installs (uv pip install or uv sync)"
      - "FastAPI, uvicorn, and pydantic listed as dependencies"
      - "No version conflicts"
    reference: "unified-trading-codex/06-coding-standards/dependency-management.md"

  item_03_ci_cd_pipeline:
    description: ".github/workflows/quality-gates.yml and cloudbuild.yaml configured"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "quality-gates.yml runs on push/PR to main"
      - "cloudbuild.yaml builds Docker image after quality gates pass"
      - "Image pushed to Artifact Registry"
      - "scripts/quality-gates.sh exists and is executable"
      - "scripts/quickmerge.sh exists; runs quality gates before creating PR"

  item_04_quality_gates:
    description: "Ruff linting, basedpyright type checking, pytest all pass"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "ruff check passes with no errors"
      - "basedpyright passes with no reportAny violations"
      - "pytest runs without errors"
      - "Coverage > 30%"
      - "NO continue-on-error or || true bypasses"

  item_05_dockerfile:
    description: "Dockerfile exposes the correct port and runs uvicorn"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Dockerfile exists at repo root"
      - "Uses UV for installs: pip install uv then uv pip install --system -e '.[dev]'"
      - "EXPOSE directive matches uvicorn port"
      - "CMD runs uvicorn with --host 0.0.0.0"
      - "Non-root user for security"

  item_06_no_secrets_in_code:
    description: "API keys and tokens use get_secret_client() (Secret Manager)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "No hardcoded API keys or tokens in source code"
      - "Uses get_secret_client() for sensitive values"
      - "Secret names documented in .env file"
      - "No actual secrets in .env (only names for Secret Manager lookup)"

# =============================================================================
# PHASE 2: API Endpoints (Items 7-12)
# =============================================================================
phase_2_api_endpoints:
  item_07_fastapi_app:
    description: "FastAPI application with proper lifespan, CORS, and middleware"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "FastAPI app created with lifespan context manager"
      - "CORS middleware configured for allowed origins"
      - "Request ID middleware adds correlation_id to every request"
      - "No synchronous blocking calls in async endpoints"
    reference: "unified-trading-codex/04-architecture/api-services.md"

  item_08_rest_endpoints:
    description: "REST endpoints follow consistent patterns (response models, status codes)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "All endpoints have Pydantic response_model defined"
      - "Correct HTTP status codes (200, 201, 400, 401, 404, 500)"
      - "Path parameters validated with type hints"
      - "Query parameters use Pydantic models for complex filters"
      - "No dict[str, Any] return types"

  item_09_sse_endpoints:
    description: "SSE (Server-Sent Events) endpoints for real-time data streams (if applicable)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "SSE endpoints use EventSourceResponse from sse-starlette"
      - "Heartbeat events sent to keep connection alive"
      - "Client disconnect handled gracefully (no zombie generators)"
      - "Backpressure handled (slow consumers don't block producers)"
    applies_if: "Service provides real-time data streams"

  item_10_openapi_docs:
    description: "OpenAPI documentation auto-generated and accessible at /docs"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "/docs endpoint serves Swagger UI"
      - "/openapi.json returns valid OpenAPI 3.x spec"
      - "All endpoints have docstrings and summary fields"
      - "Request/response examples provided via Pydantic model_config"
      - "Tags organize endpoints by domain"

  item_11_request_validation:
    description: "All request bodies and query parameters validated via Pydantic"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Request bodies use Pydantic BaseModel (not raw dict)"
      - "Query params use Annotated[type, Query(...)] with constraints"
      - "Path params use Annotated[type, Path(...)] with constraints"
      - "Custom validators for domain-specific rules"
      - "422 Validation Error responses include field-level details"

  item_12_api_versioning:
    description: "API versioned via URL prefix (/v1/) or header"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "API version prefix in URL (e.g., /api/v1/)"
      - "Router includes version in prefix"
      - "Breaking changes require new version"

# =============================================================================
# PHASE 3: Authentication (Items 13-16)
# =============================================================================
phase_3_authentication:
  item_13_auth_middleware:
    description: "Authentication middleware validates tokens on protected endpoints"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "OAuth2 or JWT authentication configured"
      - "Token validation middleware applied to protected routes"
      - "Public endpoints explicitly marked (health, docs)"
      - "Invalid tokens return 401 with clear error message"

  item_14_per_endpoint_auth:
    description: "Per-endpoint authorization based on scopes or roles"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Endpoints declare required scopes/roles via Depends()"
      - "Insufficient permissions return 403"
      - "Admin endpoints restricted to admin role"
      - "Read-only endpoints accept viewer role"

  item_15_google_oauth:
    description: "Google OAuth integration for user authentication (where applicable)"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Google OAuth2 client configured via Secret Manager"
      - "Token exchange endpoint exists (/auth/callback)"
      - "Refresh token rotation implemented"
      - "Session management with secure cookies or JWT"
    applies_if: "Service requires user authentication via Google"

  item_16_service_to_service_auth:
    description: "Inter-service authentication for internal API calls"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Service account tokens validated for internal calls"
      - "IAM-based authentication for GCP services"
      - "No shared secrets between services"
    reference: "unified-trading-codex/07-security/service-to-service-auth.md"

# =============================================================================
# PHASE 4: Health Probes (Items 17-19)
# =============================================================================
phase_4_health_probes:
  item_17_health_endpoint:
    description: "/health endpoint returns 200 when service is alive"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - 'GET /health returns 200 with {"status": "healthy"}'
      - "Responds within 1 second"
      - "No authentication required"
      - "No dependency checks (liveness only)"
    reference: "runtime-topology.yaml health_probes"

  item_18_readiness_endpoint:
    description: "/readiness endpoint checks all dependencies before returning 200"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "GET /readiness returns 200 when all dependencies are reachable"
      - "Returns 503 when any critical dependency is down"
      - "Checks database connectivity (if applicable)"
      - "Checks upstream service availability (if applicable)"
      - "Response includes dependency status breakdown"

  item_19_startup_probe:
    description: "Startup probe configured in deployment manifest"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Cloud Run startup probe configured with appropriate timeout"
      - "Initial delay accounts for model loading or cache warming"
      - "Failure threshold allows for slow starts"

# =============================================================================
# PHASE 5: Event Logging (Items 20-23)
# =============================================================================
phase_5_event_logging:
  item_20_lifecycle_events:
    description: "Service logs all required lifecycle events via log_event()"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "STARTED logged on application boot"
      - "STOPPED logged on graceful shutdown"
      - "FAILED logged on unrecoverable errors with stack_trace"
      - "from unified_events_interface import setup_events, log_event"
      - "tests/unit/test_event_logging.py exists and passes"
    reference: "unified-trading-codex/03-observability/lifecycle-events.md"

  item_21_correlation_id:
    description: "Every request carries a correlation_id through the entire call chain"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Request middleware generates or extracts X-Correlation-ID header"
      - "correlation_id propagated to all log_event() calls within request"
      - "correlation_id included in responses for client-side tracing"
      - "Downstream service calls pass correlation_id in headers"

  item_22_request_logging:
    description: "All API requests logged with method, path, status, and duration"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Request/response logging middleware installed"
      - "Logs include: method, path, status_code, duration_ms, correlation_id"
      - "Request body NOT logged for sensitive endpoints"
      - "Slow requests (>5s) logged at WARNING level"

  item_23_event_test:
    description: "Unit tests verify all lifecycle events are emitted correctly"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "tests/unit/test_event_logging.py exists"
      - "Tests use MockEventSink to capture events"
      - "Tests verify STARTED, STOPPED, FAILED events emitted"
      - "Tests verify correlation_id present in all events"

# =============================================================================
# PHASE 6: Error Handling (Items 24-27)
# =============================================================================
phase_6_error_handling:
  item_24_structured_errors:
    description: "All error responses follow a consistent JSON structure"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Error responses include: error_code, message, detail, correlation_id"
      - "FastAPI exception handlers registered for common exceptions"
      - "Pydantic ValidationError mapped to 422 with field-level detail"
      - "Unhandled exceptions return 500 with correlation_id (no stack trace in response)"

  item_25_retry_policy:
    description: "Upstream API calls and storage operations have retry policies"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Uses @handle_api_errors or execute_with_error_handling() for external calls"
      - "Retry count and backoff configured via config class (not hardcoded)"
      - "Circuit breaker for frequently failing upstreams"
      - "Retries logged with attempt count"
    reference: "unified-trading-codex/06-coding-standards/error-handling.md"

  item_26_rate_limiting:
    description: "Rate limiting configured to prevent abuse"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Rate limiting middleware or dependency applied"
      - "Limits configurable per endpoint or globally"
      - "429 Too Many Requests returned when limit exceeded"
      - "Rate limit headers included in responses (X-RateLimit-*)"
    applies_if: "Service is externally accessible"

  item_27_graceful_degradation:
    description: "Service degrades gracefully when non-critical dependencies are unavailable"
    status: pending
    notes: ""
    verified_date: null
    validation:
      - "Non-critical dependencies have fallback behavior"
      - "Degraded state logged at WARNING level"
      - "/readiness reflects degraded state"
      - "Core functionality remains available during degradation"

# =============================================================================
# PHASE 7: Observability Compliance (Items 28-32)
# =============================================================================
phase_7_observability_compliance:
  - id: "28"
    category: observability_compliance
    description: "All events include correlation_id, service_version, local_timestamp"
    status: pending
    validation:
      - "All log_event() calls pass correlation_id"
      - "service_version populated from pyproject.toml"
    reference: "unified-internal-contracts/events.py REQUIRED_EVENT_FIELDS.ALL"
  - id: "29"
    category: observability_compliance
    description: "All FAILED events include stack_trace and error_category"
    status: pending
    reference: "unified-internal-contracts/events.py REQUIRED_EVENT_FIELDS.FAILED"
  - id: "30"
    category: observability_compliance
    description: "All COMPLETED events include duration_ms for performance tracking"
    status: pending
    reference: "unified-internal-contracts/events.py REQUIRED_EVENT_FIELDS.COMPLETED"
  - id: "31"
    category: observability_compliance
    description: "Health probe endpoints /health and /readiness return correct status codes"
    status: pending
    reference: "runtime-topology.yaml health_probes"
  - id: "32"
    category: observability_compliance
    description: "Request metrics (latency p50/p95/p99, error rate, throughput) available"
    status: pending
    validation:
      - "Metrics middleware captures request duration"
      - "Error rate tracked per endpoint"
      - "Metrics exportable to Cloud Monitoring or Prometheus"

# =============================================================================
# Summary
# =============================================================================
summary:
  total_items: 32
  done: 0
  partial: 0
  pending: 32
  not_applicable: 0
  completion_percentage: 0
  blockers: []
  next_actions: []
