# Valid Timeframes Configuration
# Maps data_types and instruments to their base granularity (smallest valid timeframe)
# Used by data_status to validate expected timeframes for market-data-processing-service
#
# If a data_type's base_granularity is "1m", then timeframes < 1m (like 15s) are NOT expected
# This prevents false "missing" reports for timeframes that can't exist

# =============================================================================
# Data Type Base Granularity
# Maps the original data source resolution to allowed timeframes
# =============================================================================
data_type_base_granularity:
  # CEFI tick data - high resolution (15s base for candle generation)
  trades: "15s"
  book_snapshot_5: "15s"
  derivative_ticker: "15s"
  liquidations: "15s"

  # Options/futures chains - processed at 15s granularity
  options_chain: "15s"
  futures_chain: "15s"

  # TRADFI data - varies by source
  ohlcv_1m: "1m"      # Databento equities, CME, ICE, NASDAQ, NYSE
  ohlcv_15m: "15m"    # CBOE VIX (Barchart source)
  ohlcv_24h: "24h"    # FX venue (KRW-USD, etc.) - data via Yahoo Finance
  tbbo: "1m"          # Top of book best offer

  # DEFI data - block-level granularity (~12s on ETH)
  swaps: "15s"
  utilization: "1h"               # Lending utilization (extracted from rate_indices, hourly)
  rate_indices: "1h"              # Interest rate indices
  oracle_prices: "15s"
  risk_params: "24h"              # Governance parameters (LTV, liquidation thresholds) - change rarely
  flash_loan_availability: "1h"   # Flash loan liquidity snapshots
  rewards: "24h"                  # Protocol rewards (EIGEN/ETHFI) - daily granularity
  # REMOVED: yields - deprecated, derive from oracle_prices

# =============================================================================
# Instrument-Specific Overrides
# For instruments that have different granularity than their data_type default
# =============================================================================
instrument_overrides:
  # VIX Index from CBOE - 15m resolution from Barchart
  CBOE:INDEX:VIX:
    base_granularity: "15m"
    valid_timeframes: ["15m", "1h", "4h", "24h"]
    reason: "Barchart source only provides 15m OHLCV for VIX"

  # FX pairs - daily only (data via Yahoo Finance)
  FX:SPOT_PAIR:KRW-USD:
    base_granularity: "24h"
    valid_timeframes: ["24h"]
    reason: "FX venue only provides daily data (Yahoo Finance source)"

  FX:SPOT_PAIR:JPY-USD:
    base_granularity: "24h"
    valid_timeframes: ["24h"]
    reason: "FX venue only provides daily data (Yahoo Finance source)"

# =============================================================================
# Standard Timeframe Hierarchy
# Defines the hierarchy of timeframes for aggregation
# =============================================================================
timeframe_hierarchy:
  # From smallest to largest
  - "15s"   # Base for tick data
  - "1m"    # 4x 15s
  - "5m"    # 5x 1m
  - "15m"   # 3x 5m
  - "1h"    # 4x 15m
  - "4h"    # 4x 1h
  - "24h"   # 6x 4h (or 24x 1h)

# =============================================================================
# Expected Timeframes by Service
# What timeframes each service should generate
# =============================================================================
service_timeframes:
  market-data-processing-service:
    # Standard set for all categories
    default: ["15s", "1m", "5m", "15m", "1h", "4h", "24h"]

    # Category-specific overrides
    TRADFI:
      # Most TRADFI starts at 1m (no tick data except during tick windows)
      default: ["1m", "5m", "15m", "1h", "4h", "24h"]

  features-delta-one-service:
    default: ["15s", "1m", "5m", "15m", "1h", "4h", "24h"]

  features-volatility-service:
    default: ["15s", "1m", "5m", "15m", "1h"]

  features-calendar-service:
    default: ["1h", "4h", "24h"]  # Calendar features make most sense at longer timeframes
