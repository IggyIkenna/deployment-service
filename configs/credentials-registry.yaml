# Credentials Registry
# Maps each external data provider to its Secret Manager secret name(s).
# All API keys and credentials are stored in GCP Secret Manager.
# This file contains ONLY metadata and secret name references.
#
# Convention:
#   secret_name: kebab-case name stored in GCP Secret Manager
#   env_var:     environment variable the service reads (for local dev / CI)
#   required_by: services that need this credential
#   free_tier:   true if a key is optional (provider offers unauthenticated access)
#
# NEVER commit: actual API keys, tokens, or any authentication secrets

credentials:
  # ── Market data ──────────────────────────────────────────────────────────

  databento:
    secret_name: databento-api-key
    env_var: DATABENTO_API_KEY
    required_by:
      - market-tick-data-service
    free_tier: false

  # ── Sentiment / news ─────────────────────────────────────────────────────

  cryptopanic:
    secret_name: cryptopanic-api-key
    env_var: CRYPTOPANIC_API_KEY
    required_by:
      - features-calendar-service
    free_tier: false

  lunarcrush:
    secret_name: lunarcrush-api-key
    env_var: LUNARCRUSH_API_KEY
    required_by:
      - features-calendar-service
    free_tier: false

  # ── Onchain / derivatives data ───────────────────────────────────────────

  cryptoquant:
    secret_name: cryptoquant-api-key
    env_var: CRYPTOQUANT_API_KEY
    required_by:
      - features-onchain-service
    free_tier: false

  coinglass:
    secret_name: coinglass-api-key
    env_var: COINGLASS_API_KEY
    required_by:
      - features-onchain-service
    free_tier: false

  # ── Price / market-cap ────────────────────────────────────────────────────

  coingecko:
    # CoinGecko public endpoints do not require authentication.
    # A Pro key unlocks higher rate limits and additional endpoints.
    secret_name: coingecko-api-key
    env_var: COINGECKO_API_KEY
    required_by: []
    free_tier: true
    notes: "No key required for public endpoints; Pro key optional for higher rate limits"

  # ── Sports: Betfair exchange ──────────────────────────────────────────────

  betfair:
    secret_name: betfair-api-key
    env_var: BETFAIR_API_KEY
    required_by:
      - features-sports-service
      - unified-market-interface
      - unified-sports-execution-interface
    free_tier: false
    notes: "Betfair Application Key (app_key). For login also provision betfair-username, betfair-password if using cert/SSO."

  # ── Historical data ──────────────────────────────────────────────────────

  tardis:
    secret_name: tardis-api-key
    env_var: TARDIS_API_KEY
    required_by:
      - market-tick-data-service
    free_tier: false
    variants:
      full_access:
        secret_name: tardis-api-key-full
        env_var: TARDIS_API_KEY_FULL_DATA
