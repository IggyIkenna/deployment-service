# Test Sample Instruments Configuration
# =====================================
# Stratified sample for pre-flight candle validation testing
#
# Test Period: May 23, 2023 with 30-day lookback (April 23 - May 22, 2023)
# Selection Criteria:
#   - Prefer BTC and ETH as base assets (or closest: WETH, stETH, WBTC)
#   - Cover all venues with data for the period
#   - Cover all data types per venue
#   - Cover all instrument types per venue
#
# Note: futures_chain and options_chain are treated as whole groups

test_period:
  test_date: "2023-05-23"
  lookback_days: 30
  lookback_start: "2023-04-23"
  lookback_end: "2023-05-22"

# =============================================================================
# CEFI - Centralized Finance (7 of 9 venues available for May 2023)
# =============================================================================
cefi:
  # Excluded venues (launched after April 2023):
  # - HYPERLIQUID: No trades until 2024-10-29
  # - ASTER: Launched 2024-10-01

  BINANCE-SPOT:
    instrument_types: [SPOT_PAIR]
    data_types: [trades, book_snapshot_5]
    instruments:
      - instrument_key: "BINANCE-SPOT:SPOT_PAIR:BTC-USDT"
        base_asset: BTC
        quote_asset: USDT
      - instrument_key: "BINANCE-SPOT:SPOT_PAIR:ETH-USDT"
        base_asset: ETH
        quote_asset: USDT

  BINANCE-FUTURES:
    instrument_types: [PERPETUAL, FUTURE]
    data_types: [trades, book_snapshot_5, derivative_ticker, liquidations]
    instruments:
      # Perpetuals
      - instrument_key: "BINANCE-FUTURES:PERPETUAL:BTC-USDT@LIN"
        base_asset: BTC
        quote_asset: USDT
        instrument_type: PERPETUAL
      - instrument_key: "BINANCE-FUTURES:PERPETUAL:ETH-USDT@LIN"
        base_asset: ETH
        quote_asset: USDT
        instrument_type: PERPETUAL
      # Futures (quarterly expiries around May 2023)
      - instrument_key: "BINANCE-FUTURES:FUTURE:BTC-USDT-230630@LIN"
        base_asset: BTC
        quote_asset: USDT
        instrument_type: FUTURE
        expiry: "2023-06-30"
      - instrument_key: "BINANCE-FUTURES:FUTURE:ETH-USDT-230630@LIN"
        base_asset: ETH
        quote_asset: USDT
        instrument_type: FUTURE
        expiry: "2023-06-30"

  DERIBIT:
    instrument_types: [PERPETUAL, FUTURE, OPTION]
    data_types: [trades, book_snapshot_5, derivative_ticker]
    instruments:
      # Perpetuals
      - instrument_key: "DERIBIT:PERPETUAL:BTC-PERPETUAL"
        base_asset: BTC
        quote_asset: USD
        instrument_type: PERPETUAL
      - instrument_key: "DERIBIT:PERPETUAL:ETH-PERPETUAL"
        base_asset: ETH
        quote_asset: USD
        instrument_type: PERPETUAL
      # Futures (quarterly)
      - instrument_key: "DERIBIT:FUTURE:BTC-30JUN23"
        base_asset: BTC
        quote_asset: USD
        instrument_type: FUTURE
        expiry: "2023-06-30"
      - instrument_key: "DERIBIT:FUTURE:ETH-30JUN23"
        base_asset: ETH
        quote_asset: USD
        instrument_type: FUTURE
        expiry: "2023-06-30"
    options_chain:
      # Options are treated as whole group - all BTC/ETH options
      description: "All BTC/ETH options around May 2023"
      base_assets: [BTC, ETH]
      data_types: [options_chain]

  BYBIT:
    instrument_types: [SPOT_PAIR, PERPETUAL]
    data_types: [trades, book_snapshot_5, derivative_ticker]
    instruments:
      # Spot
      - instrument_key: "BYBIT:SPOT_PAIR:BTC-USDT"
        base_asset: BTC
        quote_asset: USDT
        instrument_type: SPOT_PAIR
      - instrument_key: "BYBIT:SPOT_PAIR:ETH-USDT"
        base_asset: ETH
        quote_asset: USDT
        instrument_type: SPOT_PAIR
      # Perpetuals
      - instrument_key: "BYBIT:PERPETUAL:BTCUSDT"
        base_asset: BTC
        quote_asset: USDT
        instrument_type: PERPETUAL
      - instrument_key: "BYBIT:PERPETUAL:ETHUSDT"
        base_asset: ETH
        quote_asset: USDT
        instrument_type: PERPETUAL

  OKX:
    instrument_types: [SPOT_PAIR, PERPETUAL, FUTURE]
    data_types: [trades, derivative_ticker]
    instruments:
      # Spot
      - instrument_key: "OKX:SPOT_PAIR:BTC-USDT"
        base_asset: BTC
        quote_asset: USDT
        instrument_type: SPOT_PAIR
      - instrument_key: "OKX:SPOT_PAIR:ETH-USDT"
        base_asset: ETH
        quote_asset: USDT
        instrument_type: SPOT_PAIR
      # Perpetuals
      - instrument_key: "OKX:PERPETUAL:BTC-USDT-SWAP"
        base_asset: BTC
        quote_asset: USDT
