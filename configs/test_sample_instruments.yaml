        quote_asset: USDT
        instrument_type: PERPETUAL
      # Futures
      - instrument_key: "OKX:FUTURE:BTC-USD-230630"
        base_asset: BTC
        quote_asset: USD
        instrument_type: FUTURE
        expiry: "2023-06-30"
      - instrument_key: "OKX:FUTURE:ETH-USD-230630"
        base_asset: ETH
        quote_asset: USD
        instrument_type: FUTURE
        expiry: "2023-06-30"

  UPBIT:
    instrument_types: [SPOT_PAIR]
    data_types: [trades]
    instruments:
      - instrument_key: "UPBIT:SPOT_PAIR:BTC-KRW"
        base_asset: BTC
