# Protocol Configuration Schema
# Documents all PROTOCOL_* environment variables injected per-service per-deployment.
# Generated by: deployment-service/configs/protocol-config-schema.yaml
# Plan: service_protocol_abstraction.plan.md (p3-config-schema)
#
# How to use:
#   1. Deployment bootstrap injects SERVICE_MODE + PROTOCOL_* env vars into Cloud Run / ECS task.
#   2. Services call get_data_sink() / get_event_bus() from unified_cloud_interface — zero cloud knowledge.
#   3. UCI factory reads these vars at startup and returns the correct concrete implementation.
#
# Provider backends:
#   GCP:   CLOUD_PROVIDER=gcp  → gcs (storage), pubsub (queue), bigquery (analytics)
#   AWS:   CLOUD_PROVIDER=aws  → s3  (storage), sqs   (queue), athena    (analytics)
#   Local: CLOUD_PROVIDER=local → local filesystem + in-memory (dev/test, no credentials needed)

# =============================================================================
# GLOBAL / PER-DEPLOYMENT
# =============================================================================

SERVICE_MODE:
  required: true
  values: [batch, live]
  description: >
    Deployment-time mode. batch = high-throughput bulk storage protocols.
    live = low-latency streaming protocols. A service is NEVER both simultaneously.

# =============================================================================
# DATA SINK  (where the service writes structured data)
# =============================================================================

PROTOCOL_DATA_SINK_BACKEND:
  required: false
  default: local
  values: [gcs, s3, bigquery, athena, local]
  description: >
    Storage backend for data writes. Defaults to "local" (safe for dev/CI).
    GCP deployments use "gcs"; AWS deployments use "s3".
    Use "bigquery" for live-mode streaming inserts via BigQuery insertAll API.
    Use "athena" for AWS S3+Glue-compatible batch writes.

PROTOCOL_DATA_SINK_BUCKET:
  required: false # required when BACKEND != local and no routing-key overrides
  default: ""
  description: >
    Default bucket / S3 bucket name for data writes.
    For services that route by market category, use per-key overrides below instead.

# Per-routing-key bucket overrides (instruments-service, market-data, features, etc.)
# Pattern: PROTOCOL_DATA_SINK_BUCKET_{ROUTING_KEY_UPPER}
# Examples:
PROTOCOL_DATA_SINK_BUCKET_CEFI:
  required: false
  description: Bucket for CEFI (centralised crypto) data. Overrides PROTOCOL_DATA_SINK_BUCKET for routing_key="cefi".
PROTOCOL_DATA_SINK_BUCKET_TRADFI:
  required: false
  description: Bucket for TRADFI (traditional finance) data.
PROTOCOL_DATA_SINK_BUCKET_DEFI:
  required: false
  description: Bucket for DEFI (decentralised finance) data.

PROTOCOL_DATA_SINK_PATH_PREFIX:
  required: false
  default: ""
  description: >
    Path prefix prepended to all blobs written by this service.
    Example: "instrument_availability/by_date" for instruments-service.

PROTOCOL_DATA_SINK_FORMAT:
  required: false
  default: parquet
  values: [parquet, json, csv]
  description: Default serialisation format for DataFrame writes.

PROTOCOL_DATA_SINK_TABLE_PREFIX:
  required: false
  default: ""
  description: >
    BigQuery table name prefix (used when BACKEND=bigquery).
    Table is derived as "{TABLE_PREFIX}_{partition_day}" or just TABLE_PREFIX
    if no partition. Required when using BigQueryDataSink without a "table" partition key.

# =============================================================================
# DATA SOURCE  (where the service reads structured data)
# =============================================================================

PROTOCOL_DATA_SOURCE_BACKEND:
  required: false
  default: local
  values: [gcs, s3, local]
  description: Storage backend for data reads. Mirrors PROTOCOL_DATA_SINK_BACKEND in most deployments.

PROTOCOL_DATA_SOURCE_BUCKET:
  required: false
  default: ""
  description: Default bucket for data reads.

PROTOCOL_DATA_SOURCE_DIR:
  required: false
  default: ""
  description: Local filesystem directory used when BACKEND=local (dev/CI only).

# =============================================================================
# EVENT BUS  (pub/sub messaging between services)
# =============================================================================

PROTOCOL_EVENT_BUS_BACKEND:
  required: false
  default: local
  values: [pubsub, sqs, local]
  description: >
    Messaging backend. GCP uses "pubsub"; AWS uses "sqs"; dev/CI uses "local" (in-memory).

PROTOCOL_EVENT_BUS_PROJECT:
  required: false
  description: GCP project ID for Pub/Sub topics (required when BACKEND=pubsub).

PROTOCOL_EVENT_BUS_TOPIC_PREFIX:
  required: false
  default: ""
  description: >
    Topic name prefix. Service appends domain-specific suffix (e.g. "instruments.updated").
    Example: for instruments-service, TOPIC_PREFIX=instruments → topic "instruments.updated".

# =============================================================================
# ANALYTICS  (query engine for ad-hoc / ML queries)
# =============================================================================

PROTOCOL_ANALYTICS_BACKEND:
  required: false
  default: local
  values: [bigquery, athena, local]
  description: >
    Analytics query backend. GCP uses "bigquery"; AWS uses "athena";
    local uses SQLite (dev/CI only). Used by ml-training-service and etl scripts.

PROTOCOL_ANALYTICS_PROJECT:
  required: false
  description: GCP project ID for BigQuery (required when BACKEND=bigquery).

PROTOCOL_ANALYTICS_DATASET:
  required: false
  description: BigQuery dataset / Athena database name for analytics queries.

# =============================================================================
# CONFIG STORE  (secrets and runtime config)
# =============================================================================

PROTOCOL_CONFIG_STORE_BACKEND:
  required: false
  default: secretmanager # inherits from UCI SECRET_PROVIDER by default
  values: [secretmanager, ssm, local]
  description: >
    Secret/config backend. GCP uses "secretmanager"; AWS uses "ssm" (Parameter Store);
    local uses environment variables (dev/CI only).

# =============================================================================
# PER-SERVICE MATRIX
# Description of which env vars each service uses.
# Full env files live in: configs/services/<service-name>/batch.env and live.env
# =============================================================================

services:
  instruments-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SINK_BACKEND # gcs / s3 / local
      - PROTOCOL_DATA_SINK_BUCKET_CEFI
      - PROTOCOL_DATA_SINK_BUCKET_TRADFI
      - PROTOCOL_DATA_SINK_BUCKET_DEFI
      - PROTOCOL_DATA_SINK_PATH_PREFIX # instrument_availability/by_date
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND
      - PROTOCOL_EVENT_BUS_TOPIC_PREFIX # instruments

  market-tick-data-service:
    mode: live
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET_CEFI
      - PROTOCOL_DATA_SINK_BUCKET_TRADFI
      - PROTOCOL_DATA_SINK_BUCKET_DEFI
      - PROTOCOL_DATA_SINK_PATH_PREFIX # tick_data/raw
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND
      - PROTOCOL_EVENT_BUS_TOPIC_PREFIX # market_tick_data

  market-data-processing-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET_CEFI
      - PROTOCOL_DATA_SINK_BUCKET_TRADFI
      - PROTOCOL_DATA_SINK_BUCKET_DEFI
      - PROTOCOL_DATA_SOURCE_BACKEND
      - PROTOCOL_DATA_SOURCE_BUCKET # upstream: market-data buckets
      - PROTOCOL_DATA_SINK_PATH_PREFIX # candles/{timeframe}
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND

  execution-service:
    mode: live
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # execution store (no category split)
      - PROTOCOL_DATA_SINK_PATH_PREFIX # trades/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND
      - PROTOCOL_EVENT_BUS_TOPIC_PREFIX # execution

  ml-training-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SOURCE_BACKEND
      - PROTOCOL_DATA_SOURCE_BUCKET # features store
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # models store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # models/{model_id}/{version}
      - PROTOCOL_ANALYTICS_BACKEND # bigquery / athena / local
      - PROTOCOL_ANALYTICS_PROJECT
      - PROTOCOL_ANALYTICS_DATASET # features_data

  ml-inference-service:
    mode: live
    uses:
      - PROTOCOL_DATA_SOURCE_BACKEND
      - PROTOCOL_DATA_SOURCE_BUCKET # models store (read)
      - PROTOCOL_EVENT_BUS_BACKEND
      - PROTOCOL_EVENT_BUS_TOPIC_PREFIX # ml_predictions

  strategy-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SOURCE_BACKEND
      - PROTOCOL_DATA_SOURCE_BUCKET # features store (read)
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # strategy store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # signals/{strategy_id}/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND

  features-calendar-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # features store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # calendar/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet

  features-onchain-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # features store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # onchain/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet

  pnl-attribution-service:
    mode: batch
    uses:
      - PROTOCOL_DATA_SOURCE_BACKEND
      - PROTOCOL_DATA_SOURCE_BUCKET # execution store (read)
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # pnl store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # pnl/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet

  position-balance-monitor-service:
    mode: live
    uses:
      - PROTOCOL_DATA_SINK_BACKEND
      - PROTOCOL_DATA_SINK_BUCKET # positions store
      - PROTOCOL_DATA_SINK_PATH_PREFIX # positions/{date}
      - PROTOCOL_DATA_SINK_FORMAT # parquet
      - PROTOCOL_EVENT_BUS_BACKEND
      - PROTOCOL_EVENT_BUS_TOPIC_PREFIX # positions
