# =============================================================================
# FEATURE LOOKBACK REQUIREMENTS
# =============================================================================
# Max lookback periods by feature group (from features-delta-one-service buffer_manager.py)
# Used to calculate when features become valid:
#   earliest_valid_features = earliest_raw_data + (max_lookback * timeframe_seconds / 86400)
#
# Example: For 24h timeframe, moving_averages needs 200 days lookback
#          For 15s timeframe, moving_averages needs 200*15/86400 ≈ 0.035 days (immediate)

feature_lookback_periods:
  # Periods = number of candles needed for the feature
  technical_indicators: 50
  moving_averages: 200 # Longest lookback - SMA/EMA up to 200 periods
  oscillators: 14
  volatility_realized: 100
  momentum: 50
  volume_analysis: 120
  vwap: 48
  candlestick_patterns: 10
  market_structure: 200 # Tied with moving_averages for longest
  returns: 100
  round_numbers: 10
  streaks: 20
  microstructure: 50
  funding_oi: 48
  liquidations: 24
  temporal: 0 # No lookback needed
  economic_events: 0 # No lookback needed
  targets: 50

# Max lookback in DAYS by timeframe (for quick reference)
# Formula: max(feature_lookback_periods) * timeframe_seconds / 86400
max_lookback_days_by_timeframe:
  "15s": 1 # 200 * 15 / 86400 = 0.035 days → round up to 1
  "1m": 1 # 200 * 60 / 86400 = 0.14 days → round up to 1
  "5m": 1 # 200 * 300 / 86400 = 0.69 days → round up to 1
  "15m": 3 # 200 * 900 / 86400 = 2.08 days → round up to 3
  "1h": 9 # 200 * 3600 / 86400 = 8.33 days → round up to 9
  "4h": 34 # 200 * 14400 / 86400 = 33.33 days → round up to 34
  "24h": 200 # 200 * 86400 / 86400 = 200 days

# Earliest valid feature dates by category
# Calculated as: earliest_ACTUAL_raw_data_date + max_lookback_days_by_timeframe[timeframe]
#
# IMPORTANT: These are the dates when features-delta-one-service can produce
# valid output. Data requests before these dates should be skipped, not failed.
#
# For ML training: ML models need additional history of features
# earliest_valid_ml = earliest_valid_features + ml_lookback_period

earliest_valid_features:
  # For 24h timeframe (200-day lookback), using earliest raw data per category
  "24h":
    CEFI: "2019-10-16" # 2019-03-30 + 200 days (actual Tardis start)
    TRADFI: "2020-07-19" # 2020-01-01 + 200 days (Databento availability)
    DEFI: "2020-12-04" # 2020-05-18 + 200 days (Uniswap V2 launch - earliest DEFI)

  # For 1h timeframe (9-day lookback)
  "1h":
    CEFI: "2019-04-08" # 2019-03-30 + 9 days
    TRADFI: "2020-01-10" # 2020-01-01 + 9 days
    DEFI: "2020-05-27" # 2020-05-18 + 9 days (Uniswap V2)

  # For 15s/1m/5m timeframes (1-day lookback)
  "15s":
    CEFI: "2019-03-31" # 2019-03-30 + 1 day
    TRADFI: "2020-01-02" # 2020-01-01 + 1 day
    DEFI: "2020-05-19" # 2020-05-18 + 1 day (Uniswap V2)

