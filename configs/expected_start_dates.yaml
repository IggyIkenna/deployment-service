# Expected Start Dates Configuration
#
# This config defines the earliest expected data availability for each service/category.
# Used by data-status CLI to accurately calculate completion percentages.
#
# How it works:
# - For each category, we take the EARLIEST venue launch date
# - Days before this date are excluded from completion calculations
# - Days on/after this date should have data (flagged as missing if absent)
#
# Source: Hardcoded launch dates in service adapters (e.g., instruments-service/adapters/*.py)
#
# NOTE: Keep this in sync with the actual adapter code. When adding new venues/protocols,
# update both the adapter AND this config.
#
# =============================================================================
# SKIP INVALID DATES PHILOSOPHY
# =============================================================================
# Services should SKIP dates with insufficient data rather than FAIL.
#
# Usage pattern in services:
#   1. Load this config at startup
#   2. Check if requested date >= earliest_valid_date for (category, venue, timeframe)
#   3. If date < earliest_valid_date: log.info("Skipping date - insufficient lookback")
#   4. If date >= earliest_valid_date: proceed with processing
#
# This enables:
#   - Clean backfill operations (no artificial failures)
#   - Clear data availability timeline for downstream services
#   - Sanity checks before expensive processing
#
# See: unified-trading-library/domain/date_validation.py for helper utilities

# =============================================================================
# INSTRUMENTS SERVICE
# =============================================================================
instruments-service:
  CEFI:
    # CEFI venues - dates are ACTUAL Tardis data availability, NOT venue launch dates
    # Source: https://docs.tardis.dev/historical-data-details/*
    # Using 2019-03-30 as category start (earliest Tardis CEFI data)
    category_start: "2019-03-30"
    venues:
      # Tardis.dev actual data availability (NOT venue launch dates)
      BINANCE-SPOT: "2019-03-30" # Tardis: high caps since 2019-03-30, all since 2021-03-05
      BINANCE-FUTURES: "2019-11-17" # Tardis: all instruments since 2019-11-17
      DERIBIT: "2019-03-30" # Tardis: all instruments since 2019-03-30
      # Bybit has different data availability for futures vs spot:
      # - bybit (futures/inverse): 2019-11-07
      # - bybit-spot: 2021-12-04 (MUCH later!)
      # Using spot start date to avoid missing data for spot instruments
      BYBIT: "2021-12-04" # Tardis: bybit-spot since 2021-12-04 (futures earlier but spot later)
      OKX: "2019-03-30" # Tardis: swap since 2019-03-30, spot/futures similar
      UPBIT: "2021-09-01" # Tardis: verified from docs (examples start 2021-09-01)
      COINBASE: "2019-03-30" # Tardis: approximate based on API
      # On-chain CLOBs (reclassified from DEFI - CLOB-style like CeFi exchanges)
      HYPERLIQUID: "2023-05-01" # Hyperliquid S3 data start (L2 book) - actual data begins May 1
      ASTER: "2021-08-30" # Earliest aggTrades observed (BTCUSDT); trades-only; pre-launch data may be proxy/aggregated

  TRADFI:
    # Databento data availability (varies by dataset and instrument type)
    category_start: "2020-01-01"
    venues:
      CME: "2020-01-01" # Databento GLBX.MDP3 - Futures & Options
      CBOE: "2020-01-01" # Databento BARCHART - VIX Futures & Options
      ICE: "2018-12-23" # Databento IFUS.IMPACT (hardcoded in adapter)
      # NASDAQ/NYSE: S&P 500 equities via DBEQ.BASIC (tickers embedded in config.py)
      NASDAQ: "2020-01-01" # NASDAQ-listed S&P 500 stocks + Bitcoin ETFs (2024-01-11+)
      NYSE: "2020-01-01" # NYSE-listed S&P 500 stocks
      FX: "2020-01-01" # FX rates (KRW/USD, etc.) - data via Yahoo Finance
      # NOTE: Legacy data stored under venue-YAHOO_FINANCE/ is being deleted.
      # FX venue now writes to venue-FX/ (canonical name). Do NOT map to YAHOO_FINANCE.

  DEFI:
    # Earliest DEFI protocol is Uniswap V2 (launched 2020-05-18)
    # NOTE: HYPERLIQUID and ASTER removed - reclassified as CEFI (on-chain CLOBs)
    category_start: "2020-05-18"
    venues:
      # DEX protocols (earliest)
      UNISWAPV2-ETH: "2020-05-18" # Uniswap V2 launch - EARLIEST DEFI protocol
      UNISWAPV3-ETH: "2021-05-05" # Uniswap V3 launch
      UNISWAPV4-ETH: "2025-02-07" # 14-day buffer after first swap (Jan 24). Contracts deployed late 2024, first subgraph activity Jan 23 2025.

      # LST/Yield protocols
      LIDO: "2020-12-18" # Lido launch 2020-12-17, first data 2020-12-18
      ETHERFI: "2024-02-01" # EtherFi actual data start (was 2024-01-01 but no data until Feb)
      ETHENA: "2024-02-16" # Ethena launch (ethena_adapter.py:41)

      # Lending protocols
      MORPHO-ETHEREUM: "2024-01-08" # Morpho Blue launch (morpho_adapter.py:39)
      AAVE_V3_ETH: "2023-01-27" # Aave V3 Ethereum launch
      COMPOUND_V3_ETH: "2022-08-24" # Compound V3 Ethereum launch
      # EULER-PLASMA: "2024-03-01"    # TODO: Adapter not implemented - excluded from data-status
      # FLUID-PLASMA: "2024-06-01"    # TODO: Adapter not implemented - excluded from data-status

      CURVE-ETH: "2020-01-20" # Curve Ethereum (MetaRegistry RPC)

      # FUTURE IMPLEMENTATION - NOT MVP (data source issues)
      # BALANCER-ETH: "2020-03-31"      # TODO: The Graph deprecated, RPC fallback needs work

