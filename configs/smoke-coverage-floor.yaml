# Per (service, category) minimum green smoke-cell floor.
#
# Pattern mirrors unified-trading-pm/plans/active/coverage_ratchet_policy_2026_04_19.plan.md
# but is scoped to *smoke* coverage (institutional smoke matrix), not unit-test
# coverage. The enforcer (`scripts/enforce-smoke-coverage-floor.py`) reads the
# latest `summary.json` from a smoke-matrix run and fails the build if any
# (service, category) pair has fewer PASSing cells than the floor declared here.
#
# SSOT for context:
#   unified-trading-pm/plans/active/institutional_smoke_matrix_2026_04_20.plan.md
#   unified-trading-pm/plans/active/proper_coverage_roadmap_2026_04_20.plan.md
#   unified-trading-pm/codex/14-playbooks/smoke-testing-playbook.md
#
# Semantics (MUST read before editing):
# - Floor is a LOWER BOUND. The plan's actual target is 100% green per
#   proper_coverage_roadmap_2026_04_20.plan.md; this file exists ONLY to
#   block regressions below the historical baseline on merge.
# - `0` means "no baseline established yet". The first green nightly run of
#   `nightly-smoke-matrix.yml` will produce a summary.json; a subsequent PR
#   ratchets these numbers up to the observed green-cell counts. Until then,
#   the gate only blocks regressions from a zero floor (ie. it never fails).
# - `null` means "this (service, category) combination is architecturally
#   unsupported" — the enforcer skips it rather than treating it as zero.
#   (This matches the Phase 2 smoke-matrix convention where unsupported cells
#   emit SKIP, not FAIL.)
# - Ratcheting is additive only: a PR that INCREASES a floor is healthy (new
#   green territory), a PR that DECREASES is a regression unless accompanied
#   by an admin-override commit message (see
#   unified-trading-pm/ops/coverage-override-policy.md § smoke-coverage).
#
# How to ratchet after the first green nightly:
#   1. Download the nightly GHA artifact `summary.json`.
#   2. For every entry in `services[]`, compute per-category green counts
#      (sum of `passed` across cells with matching `category`).
#   3. Edit this file to set `cells.<service>.<CATEGORY>` to that number.
#   4. Commit with message `chore(smoke): ratchet smoke-coverage floor to
#      <nightly-run-id>`.

version: 1
baseline_date: "2026-04-20"
description: "Initial zero-baseline. Ratchet on first green nightly smoke-matrix run."

# Cells are declared by explicit (service, category) pair. `null` = not supported
# by this service (skipped by enforcer). An integer = minimum green cell count.
