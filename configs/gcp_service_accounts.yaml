execution:
  owner: deployment-service maintainer + ikennaigboaka (operator)
  cadence: per-deploy + monthly drift audit
  verifier: |
    diff <(yq '.service_accounts | keys' configs/gcp_service_accounts.yaml) \
         <(gcloud iam service-accounts list --project=central-element-323112 --format='value(email)')
    # Expected: empty diff (SSOT matches provisioned state 1:1)
  last_executed: NEVER (pending sync_gcp_service_accounts.py provisioning script)
