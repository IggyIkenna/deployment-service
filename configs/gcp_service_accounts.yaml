# GCP per-service service-account matrix SSOT.
#
# Plan: api_keys_wallets_accounts_readiness_2026_05_10.md Phase 1.A.
# Mirror: codex/05-infrastructure/aws-iam-matrix.md (AWS-side equivalent).
#
# Schema: dict[service_name, ServiceAccountSpec].
# Per service: email + IAM role bindings + bucket access + secrets access.
#
# Verifier: gcloud projects get-iam-policy central-element-323112 + gcloud iam
# service-accounts list — must match 1:1 with this file.
#
# Naming convention: {service_short_name}-{env}@{project_id}.iam.gserviceaccount.com
# Env suffix: prod / staging / dev (3 envs per service).

version: 1
created: 2026-05-12
owner: ikenna-keys-wallets-tab (slot 4)
project_id: central-element-323112
region: asia-northeast1

# Closed set of service short names — mirrors aws-iam-matrix.md § 1
service_short_names:
  - instruments
  - mtds
  - mdps
  - features
  - strategy
  - execution
  - pbms
  - risk
  - alerting
  - signal-broadcast
  - deployment
  - client-reporting
  - trade-event
  - unified-trading-system-ui
  - batch-live-recon
  - disaster-recovery
  - oracle-aggregation
  - feature-onchain
  - feature-sports

service_accounts:
  instruments-prod:
    email: instruments-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin  # unified-trading-instruments-prod
      - roles/secretmanager.secretAccessor  # per-venue read keys
      - roles/pubsub.publisher  # instruments-events
      - roles/cloudscheduler.jobRunner  # nightly catalog refresh
    bucket_access:
      - unified-trading-instruments-prod
      - unified-trading-instrument-manifests-prod
    secrets_read:
      - api-football-key
      - footystats-key
      - soccer-football-info-key

  mtds-prod:
    email: mtds-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/pubsub.publisher  # market-tick-events
      - roles/cloudscheduler.jobRunner  # forward-poll
    bucket_access:
      - unified-trading-market-data-prod
      - unified-trading-instrument-manifests-prod   # read-only
    secrets_read:
      - "bybit-read-*"
      - "binance-read-*"
      - "okx-read-*"
      - "deribit-read-*"
      - "hyperliquid-read-*"
      - "aster-read-*"
      - helius-key
      - coingecko-key

  mdps-prod:
    email: mdps-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.publisher
      - roles/pubsub.subscriber  # market-tick-events
    bucket_access:
      - unified-trading-market-data-prod
      - unified-trading-market-data-derived-prod
    secrets_read: []  # no per-venue keys; reads MTDS output

  features-prod:
    email: features-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.publisher
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-features-prod
      - unified-trading-market-data-prod  # read-only
    secrets_read: []

  strategy-prod:
    email: strategy-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.publisher
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-strategies-prod
      - unified-trading-features-prod  # read-only
    secrets_read: []

  # CRITICAL: execution-service needs KMS Decrypter for May-23 cutover signing
  execution-prod:
    email: execution-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/cloudkms.cryptoKeyDecrypter   # CRITICAL — Phase 3.C.1 cutover path
      - roles/pubsub.publisher
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-execution-prod
    secrets_read:
      # Per-venue TRADE-scope keys (10 venues × 3 fields per scope)
      - "bybit-trade-*"
      - "binance-trade-*"
      - "okx-trade-*"
      - "deribit-trade-*"
      - "hyperliquid-trade-*"
      - "aster-trade-*"
      - "upbit-trade-*"
      - "kraken-trade-*"
      - "bitfinex-trade-*"
      - "bitget-trade-*"
      # Custody (per R9 RESOLVED 2026-05-12 — Cloud-KMS May-23 → Copper/Fireblocks June-1)
      - "*-wrapped"  # per-wallet envelope-encrypted PKs (May-23 cutover)
      - copper-api-key
      - copper-api-secret
      - copper-org-id
      - fireblocks-api-key
      - fireblocks-api-secret
      - ceffu-api-key
      - ceffu-api-secret
      # Prediction venues
      - polymarket-api-key
      - kalshi-api-key
    kms_decrypt_keys:
      # Per-asset_group Cloud HSM CMK (Phase 3.C.1 + custody-onboarding-checklist § B)
      - "projects/central-element-323112/locations/asia-northeast1/keyRings/wallets-prod/cryptoKeys/trading-defi-master-v1"
      - "projects/central-element-323112/locations/asia-northeast1/keyRings/wallets-prod/cryptoKeys/trading-cefi-master-v1"
      - "projects/central-element-323112/locations/asia-northeast1/keyRings/wallets-prod/cryptoKeys/trading-tradfi-master-v1"
      - "projects/central-element-323112/locations/asia-northeast1/keyRings/wallets-prod/cryptoKeys/trading-sports-master-v1"
      - "projects/central-element-323112/locations/asia-northeast1/keyRings/wallets-prod/cryptoKeys/trading-prediction-master-v1"

  pbms-prod:
    email: pbms-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor  # read keys for balance polling
      - roles/pubsub.publisher
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-positions-prod
    secrets_read:
      - "bybit-read-*"
      - "binance-read-*"
      - "okx-read-*"

  risk-prod:
    email: risk-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.publisher  # kill-switch-events
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-risk-prod
    secrets_read: []

  alerting-prod:
    email: alerting-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor  # Telegram bot token
      - roles/pubsub.subscriber  # all *-events
      - roles/pubsub.publisher  # alert-sent-events
    bucket_access:
      - unified-trading-alerting-prod
    secrets_read:
      - telegram-bot-token-prod

  signal-broadcast-prod:
    email: signal-broadcast-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/pubsub.publisher
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-signals-broadcast-prod
    secrets_read:
      - "counterparty-*"  # HMAC counterparty creds

  # CRITICAL: deployment-service provisions other services' resources
  deployment-prod:
    email: deployment-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.admin  # provisions buckets
      - roles/secretmanager.admin  # provisions secrets for other services
      - roles/compute.instanceAdmin.v1  # VM launchers
      - roles/iam.serviceAccountUser  # acts as service SAs
      - roles/cloudkms.admin  # CMK provisioning (Phase B.1.2)
    bucket_access:
      - unified-trading-deployment-prod
    secrets_read:
      - "*"  # admin scope

  client-reporting-prod:
    email: client-reporting-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.subscriber
    bucket_access:
      - unified-trading-client-reports-prod
      - unified-trading-features-prod      # read
      - unified-trading-risk-prod          # read
      - unified-trading-positions-prod     # read
    secrets_read: []

  trade-event-prod:
    email: trade-event-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.subscriber  # fills-events
    bucket_access:
      - unified-trading-trade-events-prod
    secrets_read: []

  unified-trading-system-ui-prod:
    email: unified-trading-system-ui-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/secretmanager.secretAccessor  # firebase-sa-json only
      - roles/run.invoker  # Cloud Run
    bucket_access: []
    secrets_read:
      - firebase-sa-json  # per Phase 9.J firebase-local.md

  batch-live-recon-prod:
    email: batch-live-recon-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.subscriber  # all *-events
      - roles/cloudscheduler.jobRunner  # nightly recon
    bucket_access:
      - unified-trading-recon-prod
    secrets_read: []

  disaster-recovery-prod:
    email: disaster-recovery-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/pubsub.publisher  # dr-drill-events + kill-switch-events (test scope)
      - roles/cloudscheduler.jobRunner  # DR drill
    bucket_access:
      - unified-trading-dr-prod
    secrets_read: []

  oracle-aggregation-prod:
    email: oracle-aggregation-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/pubsub.publisher
    bucket_access:
      - unified-trading-oracle-prod
    secrets_read:
      - chainlink-rpc-key
      # Pyth Hermes is HTTPS public endpoint — no Secret Manager entry

  feature-onchain-prod:
    email: feature-onchain-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/pubsub.publisher
    bucket_access:
      - unified-trading-features-onchain-prod
    secrets_read:
      - alchemy-key
      - helius-key

  feature-sports-prod:
    email: feature-sports-prod@central-element-323112.iam.gserviceaccount.com
    iam_roles:
      - roles/storage.objectAdmin
      - roles/secretmanager.secretAccessor
      - roles/pubsub.publisher
    bucket_access:
      - unified-trading-features-sports-prod
    secrets_read:
      - api-football-key
      - footystats-key
      - soccer-football-info-key

# Staging + dev environments mirror prod shape with _-staging / _-dev SA suffixes.
# Generated programmatically by deployment-service/scripts/iam/sync_gcp_service_accounts.py
