  # CRITICAL: execution-service is the only role with KMS Decrypt on trading CMKs.
  # DO NOT grant kms:Decrypt to any other role — Cloud-KMS custody signing is gated here.
  execution-prod:
    role_name: uts-execution-prod
    arn: "arn:aws:iam::427895769566:role/uts-execution-prod"
    trust_principals: [ecs-tasks.amazonaws.com, ec2.amazonaws.com]
    managed_policies:
      - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
    s3_access:
      read_write:
        - unified-trading-execution-prod
      read_only:
        - unified-trading-defi-config-prod
    secrets_read_prefix_patterns:
      - "bybit-trade-*"
      - "binance-trade-*"
      - "okx-trade-*"
      - "deribit-trade-*"
      - "hyperliquid-trade-*"
      - "aster-trade-*"
      - "copper-*"
      - "ceffu-*"
      - "csb-*-wrapped"  # CloudKMS envelope-encrypted wallet PKs
      - "apd-*-wrapped"
      - "gas-reserve-*-wrapped"
    sns_publish: [fills-events]
    sqs_consume: [signals-events]
    # 5 CMKs (one per asset_group): defi / cefi / tradfi / sports / prediction
    kms_decrypt:
      - "arn:aws:kms:ap-northeast-1:427895769566:alias/trading-defi-master-v1"
      - "arn:aws:kms:ap-northeast-1:427895769566:alias/trading-cefi-master-v1"
      - "arn:aws:kms:ap-northeast-1:427895769566:alias/trading-tradfi-master-v1"
      - "arn:aws:kms:ap-northeast-1:427895769566:alias/trading-sports-master-v1"
      - "arn:aws:kms:ap-northeast-1:427895769566:alias/trading-prediction-master-v1"
    ec2_launch: false
    ecs_run_task: false

