# AWS IAM roles SSOT for the unified-trading system.
# AWS equivalent of gcp_service_accounts.yaml (GCP-specific).
#
# Plan: api_keys_wallets_accounts_readiness_2026_05_10.md Phase 1.B.
# Codex: codex/05-infrastructure/aws-iam-matrix.md (shape + policy table).
# Mirror: configs/gcp_service_accounts.yaml (GCP-side per-service SA matrix).
#
# Role naming: uts-{service-short-name}-{env}  (e.g. uts-execution-prod)
# Account:     427895769566 (admin_od; ap-northeast-1 / Tokyo)
#
# Status: SHAPE-ONLY SSOT — IAM roles NOT yet provisioned.
#   Acceptance gate per Plan Phase 1.B:
#     aws iam list-roles --query 'Roles[?starts_with(RoleName, `uts-`)].RoleName'
#   Expected: 57 entries (19 services × 3 envs).
#
# Apply: bash scripts/aws/setup-iam-roles.sh --apply
#
# Staging + dev environments mirror prod shape with -staging / -dev suffixes.
# Inline policy tiering:
#   prod    — S3 rw on unified-trading-*-prod buckets; SM read on prod secrets.
#   staging — S3 rw on unified-trading-*-staging buckets; no prod write.
#   dev     — S3 rw on unified-trading-*-dev buckets; no prod/staging write.
#
# Trust principals for ALL roles (matches setup-iam-roles.sh):
#   ecs-tasks.amazonaws.com   (ECS Fargate service deployments)
#   ec2.amazonaws.com         (VM / EC2 batch/live launchers)

version: "1"
created: 2026-05-20
owner: slot7-hk
account_id: "427895769566"
region: "ap-northeast-1"
plan_ref: plans/active/api_keys_wallets_accounts_readiness_2026_05_10.md

# Service short-name closed set — mirrors gcp_service_accounts.yaml + aws-iam-matrix.md § 1
service_short_names:
  - instruments
  - mtds
  - mdps
  - features
  - strategy
  - execution
  - pbms
  - risk
  - alerting
  - signal-broadcast
  - deployment
  - client-reporting
  - trade-event
  - unified-trading-system-ui
  - batch-live-recon
  - disaster-recovery
  - oracle-aggregation
  - feature-onchain
  - feature-sports

# Prod-tier roles (explicit). Staging + dev follow same shape — see tail note.
roles:
  instruments-prod:
    role_name: uts-instruments-prod
    arn: "arn:aws:iam::427895769566:role/uts-instruments-prod"
    trust_principals: [ecs-tasks.amazonaws.com, ec2.amazonaws.com]
    managed_policies:
      - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
    s3_access:
      read_write:
        - unified-trading-instruments-prod
        - unified-trading-instrument-manifests-prod
    secrets_read_prefix_patterns:
      - api-football-key
      - footystats-key
      - soccer-football-info-key
    sns_publish: [instruments-events]
    sqs_consume: []
    kms_decrypt: []
    ec2_launch: false
    ecs_run_task: false

  mtds-prod:
