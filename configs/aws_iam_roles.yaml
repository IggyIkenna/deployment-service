# Staging + dev environments mirror prod shape with -staging / -dev suffixes.
# Key differences per tier:
#   staging — bucket names: unified-trading-*-staging; secret names: *-staging variants
#   dev     — bucket names: unified-trading-*-dev; secret names: *-dev variants
# Deny policies: staging/dev roles CANNOT write to prod-tier buckets (enforced via
# s3:PutObject deny on *-prod/ prefix in each staging/dev role's inline policy).
#
# Apply via: bash scripts/aws/setup-iam-roles.sh --apply --tier staging
#            bash scripts/aws/setup-iam-roles.sh --apply --tier dev

# Verification runbook
execution:
  owner: deployment-service maintainer + operator (hk)
  cadence: per-deploy + monthly drift audit
  verifier: |
    aws iam list-roles \
      --query 'Roles[?starts_with(RoleName, `uts-`)].RoleName' \
      --output table
    # Expected: 57 entries (19 services × 3 envs: prod / staging / dev)
  last_executed: NEVER  # pending aws CLI + aws sso login + setup-iam-roles.sh --apply
