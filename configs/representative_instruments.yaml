# Representative Instruments Configuration
# Maps underlyings to their representative venues/instruments for upstream dependency checking
#
# When features services check upstream data dependencies, they should verify data exists
# for the REPRESENTATIVE instrument/venue, not ALL possible venues.
# This prevents false "missing dependencies" when non-representative venues are down.
#
# Example: For BTC delta-one features, we only need BINANCE-FUTURES tick data to exist.
#          We don't care if OKEX or BYBIT data is missing for that date.

# =============================================================================
# features-delta-one-service
# Generates technical indicators, momentum, volume features from candle data
# Uses representative perpetual contracts for each underlying
# =============================================================================
features-delta-one-service:
  CEFI:
    # Major cryptocurrencies - use Binance Futures as primary liquidity venue
    BTC:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:BTC-USDT@LIN
      description: "Most liquid BTC perpetual"
    ETH:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:ETH-USDT@LIN
      description: "Most liquid ETH perpetual"
    SOL:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:SOL-USDT@LIN
      description: "Most liquid SOL perpetual"
    AVAX:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:AVAX-USDT@LIN
    ADA:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:ADA-USDT@LIN
    XRP:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:XRP-USDT@LIN
    DOGE:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:DOGE-USDT@LIN
    LINK:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:LINK-USDT@LIN
    MATIC:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:MATIC-USDT@LIN
    ATOM:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:ATOM-USDT@LIN
    APT:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:APT-USDT@LIN
    NEAR:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:NEAR-USDT@LIN
    LTC:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:LTC-USDT@LIN
    BNB:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:BNB-USDT@LIN
    TRX:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:TRX-USDT@LIN
    FIL:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:FIL-USDT@LIN
    XLM:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:XLM-USDT@LIN
    ALGO:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:ALGO-USDT@LIN
    VET:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:VET-USDT@LIN
    SUSHI:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:SUSHI-USDT@LIN
    CAKE:
      representative_venue: BINANCE-FUTURES
      representative_instrument: BINANCE-FUTURES:PERPETUAL:CAKE-USDT@LIN

  TRADFI:
    # TradFi uses venue-specific representative instruments
    ES:
      representative_venue: CME
      representative_instrument: CME:FUTURE:ES-{front_month}
      description: "S&P 500 E-mini front month"
    NQ:
      representative_venue: CME
      representative_instrument: CME:FUTURE:NQ-{front_month}
      description: "Nasdaq E-mini front month"
    VIX:
      representative_venue: CBOE
      representative_instrument: CBOE:INDEX:VIX
      description: "VIX index from CBOE"
    IBIT:
      representative_venue: NASDAQ
      representative_instrument: NASDAQ:ETF:IBIT-USD
      description: "iShares Bitcoin ETF"
    SPY:
      representative_venue: NYSE
      representative_instrument: NYSE:ETF:SPY-USD
      description: "S&P 500 ETF"
    KRW-USD:
      representative_venue: FX
      representative_instrument: FX:SPOT_PAIR:KRW-USD
      description: "KRW/USD FX rate for kimchi premium (data via Yahoo Finance)"

# =============================================================================
# features-volatility-service
# Generates IV surfaces, term structure, basis features
# Requires options/futures data - uses Deribit for crypto options
# =============================================================================
features-volatility-service:
  CEFI:
    # Volatility features require options data - only Deribit has crypto options
    BTC:
      representative_venue: DERIBIT
      representative_instrument: DERIBIT:OPTION:BTC-USD-OPTIONS
      options_underlying: BTC-USD
      futures_venue: BINANCE-FUTURES
      futures_instrument: BINANCE-FUTURES:PERPETUAL:BTC-USDT@LIN
      description: "Deribit options for IV surface, Binance for basis calculations"
    ETH:
      representative_venue: DERIBIT
      representative_instrument: DERIBIT:OPTION:ETH-USD-OPTIONS
      options_underlying: ETH-USD
      futures_venue: BINANCE-FUTURES
      futures_instrument: BINANCE-FUTURES:PERPETUAL:ETH-USDT@LIN
      description: "Deribit options for IV surface, Binance for basis calculations"

  TRADFI:
    # TradFi volatility from CME options and VIX
    ES:
      representative_venue: CME
      representative_instrument: CME:OPTION:ES-{front_month}-OPTIONS
      description: "S&P 500 E-mini options"
    VIX:
      representative_venue: CBOE
      representative_instrument: CBOE:INDEX:VIX
      description: "VIX is a volatility index itself"

# =============================================================================
# Upstream Dependency Mapping
# Maps services to their upstream data requirements
# =============================================================================
upstream_dependencies:
  features-delta-one-service:
    # Delta-one features need processed candles from market-data-processing-service
    upstream_service: market-data-processing-service
    required_data_types:
      CEFI: [trades, book_snapshot_5]
      TRADFI: [ohlcv_1m]
    check_method: representative # Only check representative instruments

  features-volatility-service:
    # Volatility features need options chain data from market-tick-data-service
    upstream_service: market-tick-data-service
    required_data_types:
      CEFI: [options_chain, derivative_ticker]
      TRADFI: [ohlcv_1m]
    check_method: representative # Only check representative instruments
