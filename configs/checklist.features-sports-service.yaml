  item_17b_required_buckets_exist:
    description: All required input/output buckets exist before deployment
    status: pending
    notes: 'Root service -- no upstream input buckets. Output bucket: features-sports-{project_id}.
      Requires Secret Manager secrets for external APIs.'
    verified_date: null
    gcp_buckets:
      outputs:
      - features-sports-test-project
      inputs: []
    aws_buckets:
      outputs:
      - unified-trading-features-sports-${AWS_ACCOUNT_ID}
      inputs: []
    secret_manager_secrets:
    - name: api-football-api-key
      env_var: API_FOOTBALL_SECRET_NAME
      description: API-Football (api-sports.io) API key for fixture data, team stats,
        lineups
      required: true
    - name: footystats-api-key
      env_var: FOOTYSTATS_SECRET_NAME
      description: FootyStats API key for xG data, advanced stats, weather
      required: true
    - name: odds-api-key
      env_var: ODDS_API_SECRET_NAME
      description: The Odds API key for cross-bookmaker odds aggregation
      required: true
    - name: open-meteo-api-key
      env_var: OPEN_METEO_SECRET_NAME
      description: Open-Meteo API key for weather forecasts (optional -- free tier
        available)
      required: false
    - name: soccer-football-info-api-key
      env_var: SOCCER_FOOTBALL_INFO_SECRET_NAME
      description: Soccer-Football-Info API key for referee data, additional stats
      required: true
    bigquery_datasets:
    - name: features_sports
      description: BigQuery dataset for sports feature external tables
      location: asia-northeast1
    pubsub_topics:
    - name: features-sports-fixtures-updated
      description: Published when new fixture data is ingested
    - name: features-sports-features-computed
      description: Published when feature vectors are computed for a batch
    pubsub_subscriptions:
    - name: features-sports-fixtures-updated-sub
      topic: features-sports-fixtures-updated
      description: Subscription for downstream consumers (ML training, strategy)
    - name: features-sports-features-computed-sub
      topic: features-sports-features-computed
      description: Subscription for downstream consumers
    iam_bindings:
    - role: roles/storage.objectAdmin
      member: serviceAccount:features-sports-service@{project_id}.iam.gserviceaccount.com
      resource: features-sports-{project_id}
      description: Read/write to sports features output bucket
    - role: roles/secretmanager.secretAccessor
      member: serviceAccount:features-sports-service@{project_id}.iam.gserviceaccount.com
      resource: projects/{project_id}/secrets/*
      description: Access Secret Manager secrets for API keys
    - role: roles/pubsub.publisher
      member: serviceAccount:features-sports-service@{project_id}.iam.gserviceaccount.com
      resource: projects/{project_id}/topics/features-sports-*
      description: Publish to sports features Pub/Sub topics
    - role: roles/bigquery.dataEditor
      member: serviceAccount:features-sports-service@{project_id}.iam.gserviceaccount.com
      resource: projects/{project_id}/datasets/features_sports
      description: Create/update external tables in features_sports dataset
