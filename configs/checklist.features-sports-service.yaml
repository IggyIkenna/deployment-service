# Deployment readiness delta — canonical compliance checklist: unified-trading-codex/10-audit/batch/checklist.features-sports-service.yaml
service_name: features-sports-service
last_updated: "2026-03-10"
owner: ""
execution_order: 20 # Post-commercialization — runs after all financial market services
auth_setup:
  local_auth_method: "adc" # adc | sa_key_file | none
  github_secret_name: "GH_PAT"
  cloudbuild_sa_roles: []
  inter_service_auth: "none" # none | oauth | mtls
  aws_secret_name: null
  # Venue credential secrets (Tranche B execution clients only)
  # Pattern: exec-{client}-{venue}-{account_type}
  # Resolved via CredentialsRegistry.exec_secret_for_client() in UCI
  exec_credentials_pattern: "exec-{client}-{venue}-{account_type}"
  # Service account secret (used for S2S auth Phase 0)
  # Pattern: {service}-service-account
  service_account_secret: null # e.g. execution-service-service-account

