# Cloud Providers Configuration
#
# Bucket name templates use ${VAR} substitution (resolved by substitute_env_vars):
#   ${DEPLOYMENT_ENV}  — staging | prod | development
#   ${GCP_PROJECT_ID}  — GCP project ID
#   ${AWS_ACCOUNT_ID}  — AWS account ID
#
# Per-category domains use a dict keyed by UPPER-case category name.
# Shared (no-category) domains use a plain string.

gcp:
  storage:
    features-delta-one:
      CEFI: "features-delta-one-cefi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      TRADFI: "features-delta-one-tradfi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      DEFI: "features-delta-one-defi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    features-volatility:
      CEFI: "features-volatility-cefi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      TRADFI: "features-volatility-tradfi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    features-onchain:
      CEFI: "features-onchain-cefi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      DEFI: "features-onchain-defi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    ml-models-store: "ml-models-store-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    ml-predictions-store: "ml-predictions-store-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    ml-configs-store: "ml-configs-store-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    strategy-store:
      CEFI: "strategy-store-cefi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      TRADFI: "strategy-store-tradfi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      DEFI: "strategy-store-defi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    execution-store:
      CEFI: "execution-store-cefi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      TRADFI: "execution-store-tradfi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
      DEFI: "execution-store-defi-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    # Sports pipeline buckets
    features-sports: "features-sports-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    # Per-asset-group market-data + instruments (NO env tier — single per asset_group).
    # Added 2026-05-08 (Tab 4 AWS Phase 1 smoke surfaced missing yaml entries — actual
    # buckets exist on both clouds but resolver couldn't find them).
    market-data:
      CEFI: "market-data-cefi-${GCP_PROJECT_ID}"
      DEFI: "market-data-defi-${GCP_PROJECT_ID}"
      TRADFI: "market-data-tradfi-${GCP_PROJECT_ID}"
    instruments-store:
      CEFI: "instruments-store-cefi-${GCP_PROJECT_ID}"
      DEFI: "instruments-store-defi-${GCP_PROJECT_ID}"
      TRADFI: "instruments-store-tradfi-${GCP_PROJECT_ID}"
    # Cross-cutting features-calendar (no asset_group, no env — single bucket).
    features-calendar: "features-calendar-${GCP_PROJECT_ID}"
    # Prediction pipeline buckets (Polymarket, Kalshi)
    instruments-store-prediction: "instruments-store-prediction-${GCP_PROJECT_ID}"
    market-data-tick-prediction: "market-data-tick-prediction-${GCP_PROJECT_ID}"
    features-prediction: "features-prediction-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    strategy-store-prediction: "strategy-store-prediction-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    execution-store-prediction: "execution-store-prediction-${DEPLOYMENT_ENV}-${GCP_PROJECT_ID}"
    # DeFi raw on-chain pools / swaps / events (Phase 2 AWS migration parity, 2026-05-07).
    # Existing GCS buckets were created ad-hoc per asset_group; codifying templates here so
    # both backends resolve from the same SSOT and the UCI bucket-resolver no longer relies
    # on hardcoded fallbacks. Project-suffixed names match existing GCS layout.
    dex-pools: "dex-pools-${GCP_PROJECT_ID}"
    dex-swaps: "dex-swaps-${GCP_PROJECT_ID}"
    evm-defi: "evm-defi-${GCP_PROJECT_ID}"
    eigenlayer-rewards: "eigenlayer-rewards-${GCP_PROJECT_ID}"
    solana-defi: "solana-defi-${GCP_PROJECT_ID}"
    # Per-asset-group pnl/positions/risk DeFi stores. Existing GCS layout is
    # `pnl-store-${GCP_PROJECT_ID}-defi` (asset_group as suffix); codified here so reads
    # always go through UCI bucket-resolver instead of inline f-string formatters.
    pnl-store-defi: "pnl-store-${GCP_PROJECT_ID}-defi"
    positions-store-defi: "positions-store-${GCP_PROJECT_ID}-defi"
    risk-store-defi: "risk-store-defi-${GCP_PROJECT_ID}"
    # Cross-cutting service buckets (events stream + config snapshots).
    events: "${GCP_PROJECT_ID}-events"
    config-store: "config-store-${GCP_PROJECT_ID}"
  container_registry:
    url_pattern: "{region}-docker.pkg.dev/${GCP_PROJECT_ID}/{repository}:{tag}"
    default_tag: "latest"

aws:
  storage:
    features-delta-one:
      CEFI: "unified-trading-features-delta-one-cefi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-features-delta-one-tradfi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-features-delta-one-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    features-volatility:
      CEFI: "unified-trading-features-volatility-cefi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-features-volatility-tradfi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    features-onchain:
      CEFI: "unified-trading-features-onchain-cefi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-features-onchain-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    ml-models-store: "unified-trading-ml-models-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    ml-predictions-store: "unified-trading-ml-predictions-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    ml-configs-store: "unified-trading-ml-configs-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    strategy-store:
      CEFI: "unified-trading-strategy-cefi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-strategy-tradfi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-strategy-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    execution-store:
      CEFI: "unified-trading-execution-cefi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-execution-tradfi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-execution-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    # Sports pipeline buckets
    features-sports: "unified-trading-features-sports-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    # Per-asset-group market-data + instruments (NO env tier — single per asset_group).
    # Mirrors GCP shape; AWS buckets actually exist (verified 2026-05-08 Tab 4
    # `aws s3 ls`): unified-trading-{market-data,instruments}-{cefi,defi,tradfi}-${AWS_ACCOUNT_ID}.
    market-data:
      CEFI: "unified-trading-market-data-cefi-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-market-data-defi-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-market-data-tradfi-${AWS_ACCOUNT_ID}"
    instruments-store:
      CEFI: "unified-trading-instruments-cefi-${AWS_ACCOUNT_ID}"
      DEFI: "unified-trading-instruments-defi-${AWS_ACCOUNT_ID}"
      TRADFI: "unified-trading-instruments-tradfi-${AWS_ACCOUNT_ID}"
    # Cross-cutting features-calendar (no asset_group, no env — single bucket).
    features-calendar: "unified-trading-features-calendar-${AWS_ACCOUNT_ID}"
    # Prediction pipeline buckets (Polymarket, Kalshi)
    instruments-store-prediction: "unified-trading-instruments-prediction-${AWS_ACCOUNT_ID}"
    market-data-tick-prediction: "unified-trading-market-data-prediction-${AWS_ACCOUNT_ID}"
    features-prediction: "unified-trading-features-prediction-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    strategy-store-prediction: "unified-trading-strategy-prediction-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    execution-store-prediction: "unified-trading-execution-prediction-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    # DeFi raw on-chain pools / swaps / events (Phase 2 AWS migration parity, 2026-05-07).
    # Mirrors GCP keys 1:1 so UCI bucket-resolver dispatches by CLOUD_PROVIDER env without
    # any per-key special-casing. Names follow `unified-trading-{kind}-{env}-{account}`
    # convention used by existing AWS templates.
    dex-pools: "unified-trading-dex-pools-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    dex-swaps: "unified-trading-dex-swaps-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    evm-defi: "unified-trading-evm-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    eigenlayer-rewards: "unified-trading-eigenlayer-rewards-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    solana-defi: "unified-trading-solana-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    # Per-asset-group DeFi pnl/positions/risk stores.
    pnl-store-defi: "unified-trading-pnl-store-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    positions-store-defi: "unified-trading-positions-store-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    risk-store-defi: "unified-trading-risk-store-defi-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    # Cross-cutting service buckets (events stream + config snapshots).
    events: "unified-trading-events-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
    config-store: "unified-trading-config-store-${DEPLOYMENT_ENV}-${AWS_ACCOUNT_ID}"
  container_registry:
    url_pattern: "{account_id}.dkr.ecr.{region}.amazonaws.com/{repository}:{tag}"
    default_tag: "latest"
