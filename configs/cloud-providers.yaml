# Cloud Providers Configuration
#
# Bucket name templates use ${VAR} substitution (resolved by substitute_env_vars in
# both `deployment_service.config.env_substitutor` and the canonical UTL resolver
# `unified_trading_library.cloud_interface.bucket_naming` — they agree on every var):
#   ${DEPLOYMENT_ENV_SHORT}  — 3-char form of DEPLOYMENT_ENV (dev | stg | prd; also
#                              `test` for the E2E `-test-` variant, `ci`). DERIVED from
#                              DEPLOYMENT_ENV (workspace vocab keeps the long form
#                              `development` / `staging` / `prod` everywhere except IN
#                              bucket names — per bucket_name_ssot Q5/A5 Scope A, to keep
#                              long bucket names under the 63-char GCS/S3 cap). Unset → `prd`.
#   ${GCP_PROJECT_ID}        — GCP project ID
#   ${AWS_ACCOUNT_ID}        — AWS account ID
#
# Per-category domains use a dict keyed by UPPER-case asset_group name; the bucket-name
# STRING under PREDICTION uses `pred` (4 chars) — the dict KEY stays `PREDICTION` per the
# asset_group convention; the resolver does not translate, the template carries `pred` directly.
# Shared (no-category) domains use a plain string.
#
# Kind aliases (consumer-facing kind → shorter yaml key, bucket-template-only — per Q5/A5):
#   features-cross-instrument → features-xinstrument   (UTL resolver `_KIND_ALIASES` bridges)
#   features-multi-timeframe  → features-mtf
# Consumers keep calling `resolve_bucket(kind="features-cross-instrument")`; only the yaml
# key + on-disk bucket name use the short form.

gcp:
  storage:
    # NOTE on shapes (Phase 0/0e, 2026-05-11 — bucket_name_ssot_canonicalisation_2026_05_10.md).
    # FIXED 2026-07-10 (bucket estate cleanup): this comment block was condensed from a ~38-line
    # consecutive-comment run that triggered a PyYAML scanner edge case (recursion-depth issue on
    # very long uninterrupted comment runs immediately before a mapping key) in the pre-commit
    # check-yaml hook's isolated PyYAML version — content unchanged, only reflowed/shortened.
    #   * Group B (`features-*` / `ml-*` / `strategy-store` / `execution-store`): derived, per-env,
    #     `{prefix}-{ag}-${DEPLOYMENT_ENV_SHORT}-${PROJECT_ID}` (env tier AFTER asset_group).
    #     Temporary env-split ROLLBACK (2026-05-19 Phase D, phase5_features_streaming_carry_staked_
    #     basis_mvp_2026_05_19.md): env-split buckets were empty/non-existent; the populated on-disk
    #     buckets are non-env-split — DROP ${DEPLOYMENT_ENV_SHORT}- for ALL Group B kinds
    #     (features-delta-one, features-volatility, features-onchain, features-xinstrument,
    #     features-mtf, strategy-store, execution-store, ml-artifacts, ml-training-artifacts).
    #     Re-enable per plans/active/bucket_env_split_rollout_2026_06.md Phase 1.
    #   * Group A (`instruments-store` / `market-data` / `features-calendar` / `*-prediction`): raw/
    #     cross-cutting, env-tiered per (b+) Phase 0e. `DEPLOYMENT_ENV=test` is the canonical
    #     `-test-` shape; on-disk flat buckets are legacy (migrate in code_freeze Phase 2.6).
    #     Still env-less (pending operator confirm, high blast radius): `events` (`{pid}-events`).
    #     Env-less workspace-wide: only `terraform-state` + `secrets` (not modelled here).
    #   * Prediction: dedicated flat keys (`instruments-store-prediction`, `market-data-tick-
    #     prediction`, `features-prediction`, `strategy-store-prediction`, `execution-store-
    #     prediction`) PLUS per-AG `PREDICTION:` entries in features-delta-one/volatility/
    #     xinstrument/mtf. Bucket-name STRING uses `pred` (4 chars, Q5/A5 Scope A).
    #     `features-cross-instrument`/`features-multi-timeframe` consumer kinds alias to the
    #     `features-xinstrument`/`features-mtf` yaml keys (UTL `_KIND_ALIASES`). Sports =
    #     `asset_group="sports"` in the per-AG dicts + the dedicated `features-sports` flat key —
    #     deliberate asymmetry, consolidate if it ever bites.
    # NOTE: features-delta-one env-split ROLLED BACK — non-env-split until provisioning lands.
    # SPORTS key REMOVED 2026-07-17 (asset-group parity sweep) — sports is not an accepted
    # delta-one asset_group (cli/parser.py CATEGORIES = CEFI/TRADFI/DEFI/PREDICTION). Bucket
    # confirmed empty and deleted.
    # features FOLD A (fold_a_cutover_spec, 2026-07-18): folded per-asset_group key; the 5 retired
    # per-kind buckets collapse into features-{ag}-${DEPLOYMENT_ENV_SHORT}-{pid}, per-kind → key prefix.
    features:
      CEFI: "features-cefi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      TRADFI: "features-tradfi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      DEFI: "features-defi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      PREDICTION: "features-pred-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      SPORTS: "features-sports-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # ml-store = FOLDED ml bucket (Fold B — bucket_fold_ml_2026_07_17.md). The five ml
    # kind-buckets (models / predictions / configs / training-artifacts / artifacts) collapse
    # into ONE env-tiered bucket; the per-kind separation becomes a top-level object-key PREFIX
    # (models/ | predictions/ | configs/ | training-artifacts/ | artifacts/). UTL's resolver
    # `_KIND_ALIASES` maps the five retired consumer kinds → this key. The five keys above are
    # RETAINED during the soft-transition reader-fallback window and retire at the delete phase.
    ml-store: "ml-store-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # strategy FOLD D (bucket_fold_execution_strategy_2026_07_17): already-flat bucket gains its
    # ${DEPLOYMENT_ENV_SHORT}- env tier; explicit strategy-store-test retired (tier derives it at env=test).
    strategy-store: "strategy-store-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # execution FOLD C (bucket_fold_execution_strategy_2026_07_17): folded per-asset_group dict ->
    # one env-tiered bucket; asset_group moves into a top-level object-key prefix ({ag}/execution/...).
    execution-store: "execution-store-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # portfolio-state FOLD E (bucket_fold_portfolio_state_2026_07_17) — LAST fold: 6 position/pnl/risk stores
    # -> ONE env-tiered bucket; per-domain prefixes. archetype-state/position-store-sports RETAINED (soft window).
    portfolio-state: "portfolio-state-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Sports pipeline buckets
    features-sports: "features-sports-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Commodity features bucket — non-env-split (flat); preserves existing on-disk name.
    # Env-tiering deferred to bucket_env_split_rollout_2026_06.md Phase 1.
    features-commodity: "commodity-signals-batch-${GCP_PROJECT_ID}"
    # Per-asset-group market-data + instruments. Env-tiered AFTER asset_group per (b+)
    # (operator direction 2026-05-11 — env tier extends to ALL bucket kinds incl. Group-A
    # raw-tick / instruments-store). bucket_name_ssot Phase 0e. The flat
    # `market-data-tick-cefi-{pid}` (no env) buckets on disk are legacy — env-tiered ones
    # get provisioned + the flat-bucket data migrated in code_freeze Phase 2.6.
    # NOTE: GCP shape includes `tick-` infix (e.g. market-data-tick-defi-...);
    # AWS shape does NOT (e.g. unified-trading-market-data-defi-...). Per-cloud
    # template captures the asymmetry; resolver hides it behind same `kind` key.
    market-data:
      CEFI: "market-data-tick-cefi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      DEFI: "market-data-tick-defi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      TRADFI: "market-data-tick-tradfi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      SPORTS: "market-data-tick-sports-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    instruments-store:
      CEFI: "instruments-store-cefi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      DEFI: "instruments-store-defi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      TRADFI: "instruments-store-tradfi-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
      SPORTS: "instruments-store-sports-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Cross-cutting features-calendar (no asset_group; env-tiered per (b+) Phase 0e).
    # Uncommented 2026-05-11 (Phase 0): the flat GCP bucket exists on disk (probed); env tier
    # added Phase 0e — flat `features-calendar-{pid}` migrates in code_freeze Phase 2.6.
    features-calendar: "features-calendar-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Prediction pipeline buckets (Polymarket, Kalshi) — env-tiered per (b+) Phase 0e.
    instruments-store-prediction: "instruments-store-pred-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    market-data-tick-prediction: "market-data-tick-pred-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    features-prediction: "features-pred-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    strategy-store-prediction: "strategy-store-pred-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # DeFi raw on-chain pools / swaps / events. Env-tiered per (b+) Phase 0e follow-up
    # (2026-05-11 — env tier extends to ALL kinds; mirrors the AWS side which was already
    # env-tiered). The existing flat `dex-pools-{pid}` etc. buckets on disk migrate to the
    # env-tiered names in code_freeze Phase 2.6 (2026-05-15→05-19). UCI bucket-resolver +
    # DeFi adapters resolve from this SSOT (no hardcoded fallbacks).
    # REMOVED 2026-07-10 (bucket estate cleanup, [[gcs_bucket_estate_cleanup_2026_07_10]]):
    # dex-swaps, evm-defi, solana-defi, lending-indices, oracle-prices, liquidations kinds.
    # Confirmed zero callers workspace-wide for resolve_bucket_name(kind=<these>) — every
    # writer for these DeFi reference-data types resolves get_write_bucket_name("market_data",
    # asset_group="defi") instead (the shared market-data-tick-defi-{env}-{pid} bucket), and no
    # manifest scanner or reader resolves these kinds either. The dedicated per-kind buckets
    # (flat + every env-tiered variant) were empty and deleted in the same cleanup. gas-fees REMOVED
    # 2026-07-12 (bucket estate cleanup follow-up) -- its last real caller
    # (data_manifest_handler.py) was fixed to resolve kind="tick-data" instead, leaving
    # zero callers for kind="gas-fees" workspace-wide; both dedicated buckets deleted.
    # eigenlayer-rewards REMOVED 2026-07-16 — its ONLY caller (eigenlayer_rewards_handler.py) was
    # repointed to kind="tick-data" (the shared market-data-tick-defi bucket), matching every other
    # DeFi handler; the 3 dedicated GCP buckets (flat + prd + test) were confirmed EMPTY and deleted.
    # dex-pools + lst-rates + perp-funding REMOVED 2026-07-13
    # ([[defi_dedicated_bucket_shared_migration_2026_07_13]]): every real reader/writer/
    # scanner migrated to kind="tick-data" (the shared market-data-tick-defi bucket), every
    # (venue, data_type, day) shard verified present there (6,941 gap objects backfilled
    # day-tuple-aware from the dedicated buckets), dedicated buckets retired.
    # REMOVED 2026-07-10 (bucket estate cleanup): pnl-store-defi, positions-store-defi,
    # risk-store-defi kinds. Confirmed zero callers workspace-wide — the real, live naming for
    # pnl/risk/positions is unified_trading_library/config_interface/paths/registry.py's
    # PATH_REGISTRY (`positions-store-{pid}` no-AG, `pnl-attribution-store-{pid}`,
    # `risk-metrics-store-{pid}`), which never went through this cloud-providers.yaml SSOT at
    # all. risk-and-exposure-service / pnl-attribution-service / position-balance-monitor-service
    # (the services these kinds were provisioned for) don't exist as repos in this workspace.
    # Cross-cutting service buckets. `config-store` env-tiered per (b+) Phase 0e follow-up
    # (mirrors AWS). `events` STILL env-less on GCP — `{pid}-events` is referenced workspace-wide
    # (per "no fire-and-forget VM launches": `gs://{pid}-events/events/{service}/...`) — needs
    # an operator confirm before env-tiering (high blast radius).
    events: "${GCP_PROJECT_ID}-events"
    config-store: "config-store-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Batch-live reconciliation (T1) inputs + reports. Added 2026-07-13 per
    # plans/active/issues/recon_bucket_missing_nightly_recon_failing_2026_07_13.md —
    # BLRS config.py previously defaulted to a hand-rolled recon-{pid} name whose bucket
    # never existed (nightly Cloud Run job failed 55/56 runs). Env-tiered kind chosen over
    # a prefix-in-existing-bucket (autonomous decide-and-document 2026-07-13): consistent
    # with the resolver architecture; +2 buckets (prd/test).
    # Path: gs://recon-{env}-{pid}/t1-recon/{ml,strategy,recon}/{date}/...
    recon: "recon-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Per-client NAV / PnL / positions / attribution parquets for the client-reporting MVP
    # (client_reporting_pnl_attribution_mvp_2026_05_10.md Phase 2). Cross-cutting; no asset_group axis.
    # Path: gs://{pid}-client-reports/{client_id}/{archetype}/{YYYY-MM-DD}/attribution.parquet
    client-reports: "${GCP_PROJECT_ID}-client-reports"
    # Per-client fee recognition + HWM ledger + daily statements
    # (wallet_treasury_client_flow_2026_05_10 Phase 4.C + 5.A).
    # Path: gs://{pid}-client-statements/{client_id}/fee_recognition/{YYYY-MM-DD}/*.parquet
    # Consumed by: client-reporting-api /hwm-timeline (Phase 5.C2).
    client-statements: "${GCP_PROJECT_ID}-client-statements"
    # DART manual-action audit log persistence (≥7 years retention per compliance).
    # Consumed by UAC unified_api_contracts/internal/manual_audit_paths.py BUCKET_KIND_MANUAL_AUDIT.
    # Phase 0i tail of bucket_name_ssot_canonicalisation_2026_05_10.md.
    manual-audit: "manual-audit-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # Immutable execution audit log — GCP Object Retention Lock ≥7 years (220752000s).
    # Provisioned via deployment-service/scripts/provision_audit_records_retention_lock.sh
    audit-records: "trading-audit-records-${DEPLOYMENT_ENV_SHORT}-${GCP_PROJECT_ID}"
    # DeFi execution validation results — Phase 2 AMM golden-swap + Phase 3C lending rate.
    # Flat naming (no env tier) intentional: validation runs target mainnet state and results
    # are environment-neutral. Path pattern:
    #   gs://{pid}-defi-validation/results/lending/{DATE}/{CORRELATION_ID}/results.json
    #   gs://{pid}-defi-validation/results/amm/{DATE}/{SHAPE}/{CORRELATION_ID}/results.json
    # Launchers: launch-aave-lending-rate-validation-vm.sh + launch-amm-golden-fixture-validation-vm.sh
    # Added 2026-05-13 (V2 VM-orchestration — defi_simulation_realism_2026_05_10.md Phase 2 + 3C).
    defi-validation: "${GCP_PROJECT_ID}-defi-validation"
  container_registry:
    url_pattern: "{region}-docker.pkg.dev/${GCP_PROJECT_ID}/{repository}:{tag}"
    default_tag: "latest"

aws:
  storage:
    # Phase 1 symmetry (2026-05-20, slot 2): AWS templates now mirror GCP templates 1:1
    # (same prefix, same tick- infix on market-data, same -store suffixes).
    # Only difference: ${AWS_ACCOUNT_ID} vs ${GCP_PROJECT_ID}.
    # On-disk AWS buckets use OLD names until Phase 5 migration renames them.
    # Migration: code_freeze_migrate_backfill_sequencing_2026_05_10.md Phase 5.
    # Audit: plans/audit/results/aws_gcp_bucket_symmetry_2026_05_20.csv
    # NOTE: features-delta-one env-split ROLLED BACK — mirrors GCP rollback (Phase D).
    # SPORTS key REMOVED 2026-07-17 (asset-group parity sweep) — mirrors the GCP section removal
    # above; delta-one is never computed for sports.
    # features FOLD A (fold_a_cutover_spec, 2026-07-18): folded per-asset_group key; mirrors GCP.
    features:
      CEFI: "features-cefi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      TRADFI: "features-tradfi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      DEFI: "features-defi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      PREDICTION: "features-pred-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      SPORTS: "features-sports-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # ml-store = FOLDED ml bucket (Fold B) — mirrors GCP; see the GCP § comment.
    ml-store: "ml-store-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # strategy FOLD D (bucket_fold_execution_strategy_2026_07_17): already-flat bucket gains its env tier;
    # redundant strategy-store-test retired (tier derives it). Mirrors GCP.
    strategy-store: "strategy-store-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # execution FOLD C (bucket_fold_execution_strategy_2026_07_17): folded per-asset_group dict ->
    # one env-tiered bucket; asset_group moves into an object-key prefix. Mirrors GCP.
    execution-store: "execution-store-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # portfolio-state FOLD E (bucket_fold_portfolio_state_2026_07_17) — 6 position/pnl/risk stores -> ONE
    # env-tiered bucket; per-domain prefixes. archetype-state/position-store-sports RETAINED. Mirrors GCP.
    portfolio-state: "portfolio-state-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Sports pipeline buckets
    features-sports: "features-sports-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Commodity features bucket — non-env-split (flat); mirrors GCP naming convention.
    features-commodity: "commodity-signals-batch-${AWS_ACCOUNT_ID}"
    # Per-asset-group market-data + instruments. Env-tiered per (b+) Phase 0e (mirrors GCP).
    # AWS now includes the `tick-` infix (Phase 1 symmetry 2026-05-20) — mirrors GCP shape.
    # On-disk `market-data-{ag}-{account}` (no tick-) buckets migrate in Phase 5.
    market-data:
      CEFI: "market-data-tick-cefi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      DEFI: "market-data-tick-defi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      TRADFI: "market-data-tick-tradfi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      SPORTS: "market-data-tick-sports-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    instruments-store:
      CEFI: "instruments-store-cefi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      DEFI: "instruments-store-defi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      TRADFI: "instruments-store-tradfi-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
      SPORTS: "instruments-store-sports-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Cross-cutting features-calendar (no asset_group; env-tiered per (b+) Phase 0e).
    features-calendar: "features-calendar-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Prediction pipeline buckets (Polymarket, Kalshi) — env-tiered per (b+) Phase 0e.
    instruments-store-prediction: "instruments-store-pred-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    market-data-tick-prediction: "market-data-tick-pred-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    features-prediction: "features-pred-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    strategy-store-prediction: "strategy-store-pred-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # REMOVED 2026-07-10 (bucket estate cleanup, [[gcs_bucket_estate_cleanup_2026_07_10]]) —
    # mirrors the GCP-section removal above: dex-swaps, evm-defi, solana-defi, lending-indices,
    # oracle-prices, liquidations. Confirmed zero callers workspace-wide. See the GCP section
    # comment for the full rationale + what was kept and why.
    # gas-fees REMOVED 2026-07-12 (bucket estate cleanup follow-up) -- mirrors the GCP
    # section removal above: last real caller fixed, zero callers left.
    # eigenlayer-rewards REMOVED 2026-07-16 — mirrors the GCP-section removal above: the only caller
    # (eigenlayer_rewards_handler.py, GCP-only) was repointed to kind="tick-data"; zero callers left.
    # dex-pools + lst-rates + perp-funding REMOVED 2026-07-13 — mirrors the GCP-section
    # removal above ([[defi_dedicated_bucket_shared_migration_2026_07_13]]).
    # REMOVED 2026-07-10 (bucket estate cleanup): pnl-store-defi, positions-store-defi,
    # risk-store-defi — mirrors the GCP-section removal above (same rationale: zero callers,
    # real naming is UTL PATH_REGISTRY, the provisioned-for services don't exist as repos).
    # Cross-cutting service buckets. `events` env-less (mirrors GCP ${GCP_PROJECT_ID}-events
    # project-first env-less shape; AWS uses account-suffix env-less shape — intentional
    # cloud-specific prefix, not a naming error).
    events: "unified-trading-events-${AWS_ACCOUNT_ID}"
    config-store: "config-store-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Batch-live reconciliation (mirrors GCP recon kind, 2026-07-13).
    recon: "recon-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Per-client reports — env-less mirrors GCP ${GCP_PROJECT_ID}-client-reports env-less shape.
    client-reports: "unified-trading-client-reports-${AWS_ACCOUNT_ID}"
    # Per-client fee recognition + HWM ledger + daily statements — env-less mirrors GCP.
    client-statements: "unified-trading-client-statements-${AWS_ACCOUNT_ID}"
    # DART manual-action audit log (mirrors GCP). ≥7 years retention per compliance.
    manual-audit: "manual-audit-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # Immutable execution audit log — S3 Object Lock COMPLIANCE mode ≥7 years.
    # Provisioned via deployment-service/scripts/provision_audit_records_retention_lock.sh
    audit-records: "trading-audit-records-${DEPLOYMENT_ENV_SHORT}-${AWS_ACCOUNT_ID}"
    # DeFi execution validation results — env-less mirrors GCP ${GCP_PROJECT_ID}-defi-validation.
    defi-validation: "unified-trading-defi-validation-${AWS_ACCOUNT_ID}"
  container_registry:
    url_pattern: "{account_id}.dkr.ecr.{region}.amazonaws.com/{repository}:{tag}"
    default_tag: "latest"
