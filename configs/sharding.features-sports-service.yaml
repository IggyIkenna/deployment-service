# Sharding Configuration: features-sports-service
# Generates sports betting features (team form, odds, xG, weather, etc.)
#
# NOTE: Sports features are sharded by LEAGUE (not by CEFI/TRADFI/DEFI category).
# Each league is an independent shard with its own fixture calendar.
# Output bucket is SHARED: features-sports-{project_id}

service: features-sports-service
description: Generate sports betting features from fixture and odds data

# Docker image (used by both Cloud Run and VM)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/features/sports-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: features-sports-service-job

# Sharding dimensions (order defines hierarchy - most decisive first)
dimensions:
  - name: league
    type: fixed
    values:
      - EPL            # English Premier League
      - LA_LIGA        # Spanish La Liga
      - BUNDESLIGA     # German Bundesliga
      - SERIE_A        # Italian Serie A
      - LIGUE_1        # French Ligue 1
      - CHAMPIONSHIP   # English Championship
      - EREDIVISIE     # Dutch Eredivisie
      - PRIMEIRA_LIGA  # Portuguese Primeira Liga
    description: Football league to process (each league is an independent shard)

  - name: feature_group
    type: fixed
    values:
      - team_form
      - h2h
      - league_stats
      - halftime
      - goal_timing
      - season_context
      - venue_context
      - referee
      - player_lineup
      - odds
      - xg
      - advanced_stats
      - weather
    description: Feature group to generate (maps to SportsFeatureVector field groups)

  - name: date
    type: date_range
    granularity: weekly
    description: Date range split into 7-day chunks (aligned to match-day windows)

# CLI argument mappings
cli_args:
  league: --league
  feature_group: --feature-group
  start_date: --start-date
  end_date: --end-date

# Service-specific CLI flags (per codex cli-standards: --operation compute --mode batch)
cli_flags:
  operation: "--operation compute"
  mode: "--mode batch"

# Optional CLI arguments (control arguments, not shard dimensions)
cli_optional:
  - name: force
    flag: --force
    description: Force reprocessing even if output exists
  - name: dry-run
    flag: --dry-run
    description: Don't upload to GCS, validate only

# Compute recommendations
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 32  # >= 2x RAM (16GB) for swap
    description: Light workload - mostly API calls and DataFrame operations
    gcsfuse_buckets: []
      # No GCSFuse needed - uses GCS API for reads/writes
  cloud_run:
    memory: 4Gi
    cpu: 2
    timeout_seconds: 3600

# Estimated runtime per shard
runtime:
  estimated_minutes: 15
  notes: Varies by league size (EPL ~380 fixtures/season, Championship ~552 fixtures/season).
    API rate limits may throttle external calls.
