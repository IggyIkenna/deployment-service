# AWS deployment manifest — position-balance-monitor-service
# Runtime: AWS App Runner (stateless HTTP polling service)
# Region: ap-northeast-1
# ECR: 427895769566.dkr.ecr.ap-northeast-1.amazonaws.com/position-balance-monitor-service:latest
# IAM role: uts-position-balance-monitor-prod (Phase 1.B)
# Deploy: aws apprunner create-service --cli-input-yaml file://configs/aws/position-balance-monitor-service.yaml

runtime: app_runner
service_name: uts-position-balance-monitor-prod
region: ap-northeast-1

image:
  uri: "427895769566.dkr.ecr.ap-northeast-1.amazonaws.com/position-balance-monitor-service:latest"
  port: 8080

compute:
  cpu: "1 vCPU"
  memory: "2 GB"

scaling:
  min_size: 1
  max_size: 2
  max_concurrency: 80

iam:
  instance_role_arn: "arn:aws:iam::427895769566:role/uts-position-balance-monitor-prod"
  access_role_arn: "arn:aws:iam::427895769566:role/uts-position-balance-monitor-prod"

health_check:
  path: /health
  interval: 10
  timeout: 5
  healthy_threshold: 1
  unhealthy_threshold: 3

env:
  DEPLOYMENT_ENV: prod
  CLOUD_PROVIDER: aws
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "427895769566"

secrets: []
