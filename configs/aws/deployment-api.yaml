# AWS deployment manifest — deployment-api
# Runtime: AWS App Runner (stateless HTTP, operator UX API)
# Region: ap-northeast-1
# ECR: 427895769566.dkr.ecr.ap-northeast-1.amazonaws.com/deployment-api:latest
# IAM role: uts-deployment-prod (Phase 1.B)
# Deploy: aws apprunner create-service --cli-input-yaml file://configs/aws/deployment-api.yaml

runtime: app_runner
service_name: uts-deployment-api-prod
region: ap-northeast-1

image:
  uri: "427895769566.dkr.ecr.ap-northeast-1.amazonaws.com/deployment-api:latest"
  port: 8004

compute:
  cpu: "1 vCPU"
  memory: "2 GB"

scaling:
  min_size: 1
  max_size: 2
  max_concurrency: 100

iam:
  instance_role_arn: "arn:aws:iam::427895769566:role/uts-deployment-prod"
  access_role_arn: "arn:aws:iam::427895769566:role/uts-deployment-prod"

health_check:
  path: /health
  interval: 10
  timeout: 5
  healthy_threshold: 1
  unhealthy_threshold: 3

env:
  DEPLOYMENT_ENV: prod
  CLOUD_PROVIDER: aws
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "427895769566"

secrets:
  - name: GH_PAT
    sm_path: unified-trading/GH_PAT
