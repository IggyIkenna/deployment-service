# Data Catalogue: features-sports-service
# =========================================
# BigQuery external table definitions for sports betting features.
# Dimensions: league x feature_group x date
# Source: sharding.features-sports-service.yaml
# Generated: 2026-03-01

service_name: "features-sports-service"
last_updated: "2026-03-01"
auto_refreshed: null
overall_completion_pct: 0.0
overall_dates_found: 0
overall_dates_expected: 0
status: "0% complete -- service not yet deployed"

known_exceptions:
  - "Post-commercialization service -- not part of financial markets MVP"
  - "Requires Secret Manager secrets: api-football-api-key, footystats-api-key, odds-api-key, open-meteo-api-key, soccer-football-info-api-key"

catalogue_dimensions:
  - league
  - feature_group
  - date

feature_groups:
  - team_form
  - h2h
  - league_stats
  - halftime
  - goal_timing
  - season_context
  - venue_context
  - referee
  - player_lineup
  - odds
  - xg
  - advanced_stats
  - weather

# ─── BigQuery External Tables ─────────────────────────────────────────────────
# Each table maps to Parquet files in GCS, queryable via BigQuery.

bigquery_external_tables:
  sports_features:
    description: "ML feature vectors for individual fixtures (one row per fixture)"
    dataset: features_sports
    table_name: sports_features
    source_format: PARQUET
    gcs_uri_pattern: "gs://features-sports-{project_id}/by_date/day={date}/league={league}/feature_group={feature_group}/features.parquet"
    hive_partitioning:
      mode: AUTO
      source_uri_prefix: "gs://features-sports-{project_id}/by_date/"
    schema:
      - name: fixture_id
        type: STRING
        description: "Canonical fixture identifier"
      - name: computed_at_utc
        type: TIMESTAMP
        description: "UTC timestamp when features were computed"
      # Team features
      - name: home_form_5
        type: FLOAT64
        description: "Home team form over last 5 matches"
      - name: away_form_5
        type: FLOAT64
        description: "Away team form over last 5 matches"
      - name: home_win_rate_season
        type: FLOAT64
        description: "Home team season win rate"
      - name: away_win_rate_season
        type: FLOAT64
        description: "Away team season win rate"
      - name: home_goals_scored_avg
        type: FLOAT64
        description: "Home team average goals scored"
      - name: away_goals_scored_avg
        type: FLOAT64
        description: "Away team average goals scored"
      - name: home_goals_conceded_avg
        type: FLOAT64
        description: "Home team average goals conceded"
      - name: away_goals_conceded_avg
        type: FLOAT64
        description: "Away team average goals conceded"
      - name: home_home_advantage_factor
        type: FLOAT64
        description: "Home advantage factor for home team"
      # H2H features
      - name: h2h_home_wins
        type: INT64
        description: "Head-to-head home wins"
      - name: h2h_draws
        type: INT64
        description: "Head-to-head draws"
      - name: h2h_away_wins
        type: INT64
        description: "Head-to-head away wins"
      - name: h2h_avg_goals
        type: FLOAT64
        description: "Head-to-head average goals"
      - name: h2h_matches_played
        type: INT64
        description: "Head-to-head matches played"
      # League features
      - name: league_avg_goals_per_game
        type: FLOAT64
        description: "League average goals per game"
      - name: league_home_win_rate
        type: FLOAT64
        description: "League home win rate"
      - name: league_btts_rate
        type: FLOAT64
        description: "League both-teams-to-score rate"
      - name: league_over_25_rate
        type: FLOAT64
        description: "League over 2.5 goals rate"
      # Halftime features
      - name: home_ht_goal_rate
        type: FLOAT64
        description: "Home team halftime goal rate"
      - name: away_ht_goal_rate
        type: FLOAT64
        description: "Away team halftime goal rate"
      # Goal timing features
      - name: home_early_goal_rate
        type: FLOAT64
        description: "Home team early goal rate"
      - name: home_late_goal_rate
        type: FLOAT64
        description: "Home team late goal rate"
      - name: away_late_concede_rate
        type: FLOAT64
        description: "Away team late concede rate"
      # Season context
      - name: match_week
        type: INT64
        description: "Match week number in the season"
      - name: season_stage
        type: STRING
        description: "Season stage (early, mid, late, playoff)"
      - name: home_relegation_pressure
        type: FLOAT64
        description: "Home team relegation pressure score"
      - name: away_relegation_pressure
        type: FLOAT64
        description: "Away team relegation pressure score"
      - name: home_title_pressure
        type: FLOAT64
        description: "Home team title race pressure score"
      # Venue context
      - name: venue_capacity
        type: INT64
        description: "Venue capacity"
      - name: venue_altitude_m
        type: FLOAT64
        description: "Venue altitude in meters"
      - name: venue_surface
        type: STRING
        description: "Playing surface type (grass, artificial)"
      - name: attendance_rate
        type: FLOAT64
        description: "Attendance rate as fraction of capacity"
      # Referee features
      - name: ref_cards_per_game
        type: FLOAT64
        description: "Referee average cards per game"
      - name: ref_penalty_rate
        type: FLOAT64
        description: "Referee penalty award rate"
      - name: ref_home_bias_score
        type: FLOAT64
        description: "Referee home bias score"
      # Player lineup features
      - name: home_key_player_absent
        type: BOOL
        description: "Whether home team key player is absent"
      - name: away_key_player_absent
        type: BOOL
        description: "Whether away team key player is absent"
      - name: home_lineup_strength
        type: FLOAT64
        description: "Home team lineup strength score"
      - name: away_lineup_strength
        type: FLOAT64
        description: "Away team lineup strength score"
      # Odds features
      - name: market_home_implied_prob
        type: FLOAT64
        description: "Market implied home win probability"
      - name: market_draw_implied_prob
        type: FLOAT64
        description: "Market implied draw probability"
      - name: market_away_implied_prob
        type: FLOAT64
        description: "Market implied away win probability"
      - name: market_overround
        type: FLOAT64
        description: "Market overround (vig)"
      - name: market_consensus_home_prob
        type: FLOAT64
        description: "Consensus home win probability across bookmakers"
      # xG features
      - name: understat_home_xg
        type: FLOAT64
        description: "Understat expected goals for home team"
      - name: understat_away_xg
        type: FLOAT64
        description: "Understat expected goals for away team"
      - name: footystats_home_xg
        type: FLOAT64
        description: "FootyStats expected goals for home team"
      - name: footystats_away_xg
        type: FLOAT64
        description: "FootyStats expected goals for away team"
      - name: poisson_home_win_prob
        type: FLOAT64
        description: "Poisson model home win probability"
      - name: poisson_draw_prob
        type: FLOAT64
        description: "Poisson model draw probability"
      - name: poisson_away_win_prob
        type: FLOAT64
        description: "Poisson model away win probability"
      - name: poisson_over_25_prob
        type: FLOAT64
        description: "Poisson model over 2.5 goals probability"
      # Advanced stats
      - name: home_shots_on_target_avg
        type: FLOAT64
        description: "Home team average shots on target"
      - name: away_shots_on_target_avg
        type: FLOAT64
        description: "Away team average shots on target"
      - name: home_corners_avg
        type: FLOAT64
        description: "Home team average corners"
      - name: away_corners_avg
        type: FLOAT64
        description: "Away team average corners"
      - name: home_possession_avg
        type: FLOAT64
        description: "Home team average possession"
      # Weather features
      - name: weather_temp_c
        type: FLOAT64
        description: "Temperature in Celsius"
      - name: weather_wind_speed_ms
        type: FLOAT64
        description: "Wind speed in m/s"
      - name: weather_precipitation_mm
        type: FLOAT64
        description: "Precipitation in mm"
      - name: weather_condition
        type: STRING
        description: "Weather condition category"

  sports_fixtures:
    description: "Canonical fixture definitions (one row per match)"
    dataset: features_sports
    table_name: sports_fixtures
    source_format: PARQUET
    gcs_uri_pattern: "gs://features-sports-{project_id}/fixtures/league={league}/season={season}/fixtures.parquet"
    hive_partitioning:
      mode: AUTO
      source_uri_prefix: "gs://features-sports-{project_id}/fixtures/"
    schema:
      - name: fixture_id
        type: STRING
        description: "Canonical fixture identifier"
      - name: home_team_id
        type: STRING
        description: "Home team canonical identifier"
      - name: home_team_name
        type: STRING
        description: "Home team display name"
      - name: away_team_id
        type: STRING
        description: "Away team canonical identifier"
      - name: away_team_name
        type: STRING
        description: "Away team display name"
      - name: league_id
        type: STRING
        description: "League canonical identifier"
      - name: league_name
        type: STRING
        description: "League display name"
      - name: league_country
        type: STRING
        description: "League country"
      - name: kickoff_utc
        type: TIMESTAMP
        description: "Kickoff time in UTC"
      - name: venue_id
        type: STRING
        description: "Venue canonical identifier"
      - name: venue_name
        type: STRING
        description: "Venue display name"
      - name: referee_id
        type: STRING
        description: "Referee canonical identifier"
      - name: referee_name
        type: STRING
        description: "Referee display name"
      - name: season
        type: STRING
        description: "Season identifier (e.g. 2024-2025)"
      - name: match_week
        type: INT64
        description: "Match week number"
      - name: source
        type: STRING
        description: "Data source (api_football, footystats, etc.)"

  sports_raw_odds:
    description: "Raw odds from bookmakers (one row per fixture x bookmaker x market)"
    dataset: features_sports
    table_name: sports_raw_odds
    source_format: PARQUET
    gcs_uri_pattern: "gs://features-sports-{project_id}/raw_odds/league={league}/date={date}/odds.parquet"
    hive_partitioning:
      mode: AUTO
      source_uri_prefix: "gs://features-sports-{project_id}/raw_odds/"
    schema:
      - name: fixture_id
        type: STRING
        description: "Canonical fixture identifier"
      - name: bookmaker_key
        type: STRING
        description: "Bookmaker identifier (betfair, pinnacle, etc.)"
      - name: market
        type: STRING
        description: "Market type (h2h, over_under, asian_handicap, etc.)"
      - name: home_odds
        type: NUMERIC
        description: "Decimal odds for home win"
      - name: draw_odds
        type: NUMERIC
        description: "Decimal odds for draw"
      - name: away_odds
        type: NUMERIC
        description: "Decimal odds for away win"
      - name: over_line
        type: NUMERIC
        description: "Over/under line (e.g. 2.5)"
      - name: over_odds
        type: NUMERIC
        description: "Decimal odds for over"
      - name: under_odds
        type: NUMERIC
        description: "Decimal odds for under"
      - name: handicap_line
        type: NUMERIC
        description: "Asian handicap line"
      - name: handicap_home_odds
        type: NUMERIC
        description: "Handicap home odds"
      - name: handicap_away_odds
        type: NUMERIC
        description: "Handicap away odds"
      - name: implied_home_prob
        type: NUMERIC
        description: "Implied probability for home win"
      - name: implied_draw_prob
        type: NUMERIC
        description: "Implied probability for draw"
      - name: implied_away_prob
        type: NUMERIC
        description: "Implied probability for away win"
      - name: margin
        type: NUMERIC
        description: "Bookmaker margin (overround)"
      - name: timestamp_utc
        type: TIMESTAMP
        description: "Odds snapshot timestamp in UTC"
      - name: source
        type: STRING
        description: "Data source (odds_api, betfair, pinnacle, etc.)"

  sports_mappings:
    description: "Cross-source ID mappings for teams, fixtures, players, and leagues"
    dataset: features_sports
    table_name: sports_mappings
    source_format: PARQUET
    gcs_uri_pattern: "gs://features-sports-{project_id}/mappings/entity_type={entity_type}/mappings.parquet"
    hive_partitioning:
      mode: AUTO
      source_uri_prefix: "gs://features-sports-{project_id}/mappings/"
    schema:
      - name: canonical_id
        type: STRING
        description: "Canonical entity identifier (fixture_id, team_id, player_id, league_id)"
      - name: entity_type
        type: STRING
        description: "Entity type (fixture, team, player, league)"
      - name: source
        type: STRING
        description: "Data source name (api_football, footystats, understat, etc.)"
      - name: source_id
        type: STRING
        description: "Source-specific identifier"
      - name: source_name
        type: STRING
        description: "Source-specific display name"
      - name: confidence
        type: FLOAT64
        description: "Mapping confidence score (0.0 to 1.0)"
      - name: last_verified_utc
        type: TIMESTAMP
        description: "Last time mapping was verified"

