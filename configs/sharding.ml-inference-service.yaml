# Sharding Configuration: ml-inference-service
# Generates ML predictions for trading signals using walk-forward models

service: ml-inference-service
description: Generate ML predictions using trained models with walk-forward selection

# Walk-forward model selection:
# For each inference date, automatically selects the most recent model
# trained BEFORE that date. E.g., inferring on 2024-07-15 uses model
# from training-period-2024-06.

# Docker image (used by both Cloud Run and VM)
docker_image: ${GCS_REGION:-asia-northeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-test-project}/ml-inference-service/ml-inference-service:latest

# Cloud Run Job name (must exist in GCP)
cloud_run_job_name: ml-inference-service-job

# Sharding dimensions (order defines hierarchy - most decisive first)
dimensions:
  - name: instrument
    type: fixed
    values: [BTC, ETH, SOL, SPY]
    description: Instrument to generate predictions for

  - name: timeframe
    type: fixed
    values: [1h, 4h]
    description: Prediction timeframe

  - name: target_type
    type: fixed
    values: [swing_high, swing_low]
    description: Prediction target type

  - name: date
    type: date_range
    granularity: daily
    description: Date range split into daily chunks

# CLI argument mappings
cli_args:
  instrument: --instrument-ids
  timeframe: --timeframes
  target_type: --target-types
  start_date: --start-date
  end_date: --end-date

# Service-specific CLI flags (per codex: --operation infer --mode batch)
cli_flags:
  operation: "--operation infer"
  mode: "--mode batch"

# Compute recommendations
compute:
  vm:
    machine_type: c2-standard-4
    disk_size_gb: 50
    description: Medium workload - model loading + inference
    gcsfuse_buckets: []
      # Disabled: Use GCS API for all I/O
  cloud_run:
    memory: 8Gi
    cpu: 2
    timeout_seconds: 3600

# Estimated runtime per shard
runtime:
  estimated_minutes: 15
  notes: Fast inference once models are loaded
