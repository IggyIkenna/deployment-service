# Paradise Workflow: 2-Day Data Pipeline Sprint
# ===============================================
# Goal: Get all data pipeline services (instruments through features) end-to-end
# populated with data for all instruments where possible.
#
# Generated: 2026-02-06
# Last Updated: 2026-02-06

# =============================================================================
# PREREQUISITES
# =============================================================================
prerequisites:
  description: "What every team member needs before starting"
  steps:
    - step: "Authenticate with GCP"
      command: "gcloud auth application-default login"
      verify: "gcloud compute instances list --project=test-project"

    - step: "Clone all repos into same parent directory"
      command: |
        for REPO in instruments-service market-tick-data-service market-data-processing-service \
          features-delta-one-service features-volatility-service features-onchain-service \
          features-calendar-service unified-trading-library deployment-service; do
          git clone git@github.com:IggyIkenna/$REPO.git
        done

    - step: "Run Deployment Service UI (the control center)"
      commands:
        - "cd deployment-service"
        - "source ./scripts/setup.sh"
        - "cd ui && npm install && cd .."
        - "./run-api.sh all"
      verify:
        backend: "http://127.0.0.1:8000/docs"
        frontend: "http://localhost:5173"
      notes: "This is the FINAL test for missing data and the tool to run batch deployments"

  cloud_deployment:
    description: "Alternatively use the cloud-hosted dashboard (no local setup)"
    url: "https://deployment-dashboard-cldtjniqvq-an.a.run.app/"
    what_it_is: "Same UI and API as local, served from a single Cloud Run service in GCP"
    how_updates_work: "Push to deployment-service triggers Cloud Build; quality gates (lint, tests) must pass before the service is auto-deployed to this URL. Failed gates block deploy until fixed."

# =============================================================================
# PIPELINE DEPENDENCY ORDER
# =============================================================================
# RESPECT THIS ORDER. Do not start downstream services until upstream data exists.
pipeline_order:
  description: "Services must be populated in this order due to data dependencies"
  chain:
    - order: 1
      service: instruments-service
      status: "FULLY DONE -- all data populated, all shards complete"
      action: "No work needed"

    - order: 2
      service: market-tick-data-service
      status: "SPRINT STARTING POINT -- everyone starts here"
      depends_on: [instruments-service]
      action: "Team parallelizes across venues/instrument_types/data_types"

    - order: 3
      service: market-data-processing-service
      depends_on: [market-tick-data-service, instruments-service]
      action: "Ikenna stabilizing ahead of team"

    - order: 4
      service: features-calendar-service
      depends_on: []
      action: "Independent -- can run in parallel with market data services"

    - order: 5
      service: features-delta-one-service
      depends_on: [market-data-processing-service, features-calendar-service]
      action: "Blocked until processed candles + calendar features exist"

    - order: 6
      service: features-volatility-service
      depends_on: [market-tick-data-service]
      action: "Reads raw tick data directly (options_chain, derivative_ticker)"

    - order: 7
      service: features-onchain-service
      depends_on: [market-data-processing-service]
      action: "Needs processed DeFi candles"

    - order: 8
      service: ml-training-service
      depends_on: [features-delta-one-service, features-volatility-service, features-onchain-service]
      action: "NOT IN SPRINT SCOPE -- blocked until all features populated"

    - order: 9
      service: ml-inference-service
      depends_on: [ml-training-service]
      action: "NOT IN SPRINT SCOPE"

    - order: 10
      service: strategy-service
      depends_on: [ml-inference-service, features-delta-one-service]
      action: "NOT IN SPRINT SCOPE"

    - order: 11
      service: execution-service
      depends_on: [strategy-service, market-tick-data-service, instruments-service]
      action: "NOT IN SPRINT SCOPE"

# =============================================================================
# KNOWN EXCEPTIONS
# =============================================================================
known_exceptions:
  - category: CEFI
    issue: "TARDIS API issue -- on hold until resolved"
    impact: "Skip ALL CEFI venues for market-tick-data-service until fixed"
    workaround: "Focus on TRADFI and DEFI venues first"

  - category: CEFI
    venue: HYPERLIQUID
    issue: "No liquidations data available from any source"
    impact: "liquidations data_type will always be missing for HYPERLIQUID"

  - category: CEFI
    venue: ASTER
    issue: "No liquidations -- endpoint returns maintenance error"
    impact: "liquidations data_type will always be missing for ASTER"

  - scope: "Sports betting"
    issue: "Entirely out of scope for this sprint and system"

# =============================================================================
# KNOWN PLATFORM ISSUES & WORKAROUNDS
# =============================================================================
platform_issues:
  description: "Known issues with the deployment UI and monitoring tools"

  gcp_console:
    url: "https://console.cloud.google.com/compute/instances?project=test-project"
    purpose: "Primary way to check VM status, logs, and whether deployments completed"
    notes: "VM name maps to the shard it's running. Click VM -> Logs for output."

  issue_1_logs_not_streaming:
    description: "UTD v2 UI does NOT stream logs in real-time"
    impact: "You cannot watch deployment progress live in the UI"
    workarounds:
      - "Use GCP Console directly: https://console.cloud.google.com/compute/instances?project=test-project"
      - "SSH into VM: gcloud compute ssh {vm-name} --project=test-project -- tail -f /var/log/syslog"
      - "Check Cloud Logging: https://console.cloud.google.com/logs?project=test-project"

  issue_2_deployment_state_slow:
    description: "Deployment state is slow to update in the UI"
    impact: "Completion with errors is NOT shown as a separate state -- may look like still running"
    workarounds:
      - "Check GCP Console for VM status (TERMINATED = done, regardless of success/failure)"
      - "Check logs for ERROR/CRITICAL entries"
      - "Check data status to verify if data was actually produced (the real canary)"

  issue_3_data_status_caching:
    description: "Data status results are cached for 30 minutes (TTL=1800s)"
    impact: "After a VM completes, data status may show stale results until cache expires"
    workarounds:
      - method: "UI"
        action: "Click refresh/force-refresh button in Data Status tab"
      - method: "API force_refresh"
        action: "GET /api/data-status/turbo?service={service}&force_refresh=true"
      - method: "API clear all cache"
        action: "POST /api/data-status/turbo/cache/clear"
      - method: "API check cache age"
        action: "GET /api/data-status/turbo/cache/stats"
      - method: "Wait"
        action: "Cache expires automatically after 30 minutes"
    config: "DATA_STATUS_CACHE_TTL_SECONDS env var (default 1800)"

  issue_4_missing_data_loading_slow:
    description: "Loading missing data in data status can be slow for large date ranges"
    impact: "Querying all dates for a service may take 1-3 minutes"
    workarounds:
      - "Use smaller date ranges (1 month at a time) for faster results"
      - "Use first_day_of_month_only=true for quick overview"
      - "The turbo endpoint is faster than the standard endpoint"

# =============================================================================
# THE WORKFLOW (80% of the work -- repeatable per service per shard)
# =============================================================================
workflow:
  description: |
    This is the repeatable process for every service and every shard.
    Each person picks a shard (venue + instrument_type + data_type),
    works through it, then moves to the next one.

  per_service_steps:
    - step: 1
      name: "Quick Start"
      action: "Follow the repo's QUICK_START_GUIDE.md (3-4 commands max)"
      location: "docs/QUICK_START_GUIDE.md or docs/deployment/QUICK_START_GUIDE.md"
      typical_commands:
        - "source ./scripts/setup.sh"
        - "uv pip install -e '.[dev]'"
        - "python -m {service} --help"

    - step: 2
      name: "Run Quality Gates Locally"
      action: "Run checks before touching anything. For pre-push workflow use quickmerge (it runs quality gates); this step is for local/CI-only runs."
      command: "scripts/quality-gates.sh"
      fallback: "pytest tests/ -x"

    - step: 3
      name: "Pick ONE Shard"
      action: "Choose 1 venue, 1 day, 1 instrument_type -- start SMALL"
      guidance:
        - "Check data-catalogue.{service}.yaml for unassigned shards"
        - "Write your name in the assignee field"
        - "Start with a recent date (e.g. 2025-01-01) for faster results"
        - "Pick a small venue first (UPBIT, CBOE) before large ones (BINANCE-SPOT)"

    - step: 4
      name: "Run Locally"
      action: "Execute the service CLI for your shard, check logs for failures"
      example: |
        # market-tick-data-service example
        python -m market_tick_data_service --mode download \
          --category TRADFI --venues NASDAQ \
          --start-date 2025-01-01 --end-date 2025-01-01 \
          --log-level DEBUG --max-results 5

    - step: 5
      name: "Fix and Commit"
      action: "Fix any errors, commit, push, ensure Cloud Build passes"
      commands:
        - "git add -A && git commit -m 'fix: {description}'"
        - "git push origin main"
      verify: "Check GitHub Actions / Cloud Build for green status"

    - step: 6
      name: "Check Build Succeeded"
      action: "Verify Cloud Build passed after pushing; deployment runs automatically once green"
      verify: "Check GitHub Actions / Cloud Build for green status"

    - step: 7
      name: "Check VM Logs"
      action: "Monitor the deployment in GCS UI"
      guidance:
        - "VM name maps to what shard it's running"
        - "Check Cloud Logging for the VM name"
        - "Look for ERROR or CRITICAL log levels"
        - "Look for clean 'COMPLETED' or 'SUCCESS' messages"

    - step: "7b"
      name: "Verify Data via Data Status (THE MAIN CANARY)"
      action: "Check data status in UTD v2 UI to confirm data was dumped"
      critical_notes:
        - "This is the PRIMARY way to verify a VM run succeeded"
        - "Data status has a 30-minute in-memory cache (TTL=1800s)"
        - "After a VM completes, you MUST refresh the cache to see new data"
      cache_refresh_options:
        - method: "UI"
          action: "Click the refresh/force-refresh button in the Data Status tab"
        - method: "API force_refresh"
          action: "GET /api/data-status/turbo?service={service}&force_refresh=true"
        - method: "API clear all cache"
          action: "POST /api/data-status/turbo/cache/clear"
        - method: "API check cache age"
          action: "GET /api/data-status/turbo/cache/stats"
        - method: "Wait"
          action: "Cache expires automatically after 30 minutes"
      cache_config: "DATA_STATUS_CACHE_TTL_SECONDS env var (default 1800)"

    - step: 8
      name: "Handle Failures"
      action: "If data not present or errors in logs"
      options:
        - "If error is obvious and easy to fix: fix it, commit, redeploy"
        - "If error is complex: forward to Ikenna with the log snippet"
        - "If error is a known exception (holidays, pre-launch dates): mark as expected"
      escalation: "Quick Slack/chat discussion -- don't spend more than 15 min debugging alone"

    - step: 9
      name: "Update Catalogue and Move On"
      action: "Update data-catalogue.{service}.yaml with results"
      fields_to_update:
        - "stage_1_has_run: true (if any data appeared)"
        - "stage_2_data_complete: true (if all dates populated)"
        - "latest_data_date: (the latest date with data)"
        - "notes: (any issues found)"
      then: "Pick the next shard and repeat from Step 3"

    - step: 10
      name: "Scale Up"
      action: "Once all shards verified for 1 day, run larger date ranges"
      guidance:
        - "Expand to 1 week, then 1 month"
        - "Use the UTD v2 UI 'Run Missing Data' button for batch operations"
        - "With cloud credits, even the biggest jobs take minutes to a couple hours"

# =============================================================================
# SPRINT STARTING POINTS
# =============================================================================
sprint_status:
  instruments_service:
    status: "FULLY DONE"
    notes: "All data populated. No work needed."

  market_tick_data_service:
    status: "SPRINT STARTING POINT"
    notes: |
      Everyone starts here. 23 venues x multiple instrument_types x data_types
      = plenty of parallel work. Claim a shard in data-catalogue.market-tick-data-service.yaml.
    categories_available:
      TRADFI: "Ready to go (6 venues, Databento API)"
      DEFI: "Ready to go (8 venues, The Graph / protocol APIs)"
      CEFI: "ON HOLD (TARDIS API issue)"

  market_data_processing_service:
    status: "Ikenna stabilizing"
    notes: "Ikenna works one repo ahead to ensure stable path for team"

  features_calendar_service:
    status: "Independent -- can start anytime"
    notes: "No upstream dependencies, generates from schedules"

  features_services:
    status: "Blocked on market-data-processing-service"
    notes: "Will become available once processed candles exist"

# =============================================================================
# PARALLELIZATION RULES
# =============================================================================
parallelization:
  rules:
    - "Multiple people CAN work on the same service (different shards)"
    - "Two people on same service: one does repo checklist, other does data tranches"
    - "Use assignee field in data-catalogue YAML to claim shards"
    - "Work in small chunks: 1 day or 1 week per shard at a time"
    - "Check logs for each chunk, fix issues, commit, then expand"
    - "NEVER run two VMs for the same shard simultaneously"

  example_task_split:
    person_A: "market-tick-data-service TRADFI NASDAQ (EQUITY + ETF)"
    person_B: "market-tick-data-service TRADFI CME (FUTURE + OPTION)"
    person_C: "market-tick-data-service DEFI UNISWAPV3-ETH (POOL)"
    ikenna: "market-data-processing-service (stabilizing for team)"

# =============================================================================
# QUICK REFERENCE: DATA-STATUS COMMANDS
# =============================================================================
data_status_commands:
  description: "Commands to check what data exists in GCS"

  cli:
    instruments: "python deploy.py data-status -s instruments-service --start-date 2024-01-01 --end-date 2026-02-01 --check-venues"
    tick_data: "python deploy.py data-status -s market-tick-data-service --start-date 2024-01-01 --end-date 2026-02-01 --check-data-types --check-venues"
    processing: "python deploy.py data-status -s market-data-processing-service --start-date 2024-01-01 --end-date 2026-02-01 --check-data-types --check-timeframes"
    delta_one: "python deploy.py data-status -s features-delta-one-service --start-date 2024-01-01 --end-date 2026-02-01 --check-feature-groups"
    volatility: "python deploy.py data-status -s features-volatility-service --start-date 2024-01-01 --end-date 2026-02-01 --check-feature-groups"
    onchain: "python deploy.py data-status -s features-onchain-service --start-date 2024-01-01 --end-date 2026-02-01 --check-feature-groups"
    calendar: "python deploy.py data-status -s features-calendar-service --start-date 2024-01-01 --end-date 2026-02-01"

  refresh_script: "python scripts/refresh_data_catalogue.py --all"
