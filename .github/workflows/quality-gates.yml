# Quality Gates for deployment-service
#
# Runs lint, type check, and tests. Clones workspace deps via GH_PAT.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-library.git ../unified-trading-library 2>/dev/null || \
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-services.git ../unified-trading-library 2>/dev/null || echo "Could not clone unified-trading-library"
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git ../unified-config-interface 2>/dev/null || echo "Could not clone unified-config-interface"
          else
            echo "::notice::GH_PAT not set - installing deps from PyPI/Artifact Registry only"
          fi

      - name: Install dependencies
        run: |
          [ -d "../unified-trading-library" ] && uv pip install --system -e ../unified-trading-library 2>/dev/null || true
          [ -d "../unified-config-interface" ] && uv pip install --system -e ../unified-config-interface 2>/dev/null || true
          uv pip install --system -e ".[dev]" || uv pip install --system -e .
          uv pip install --system ruff==0.15.0 basedpyright 2>/dev/null || true

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run quality gates
        run: bash scripts/quality-gates.sh --no-fix
