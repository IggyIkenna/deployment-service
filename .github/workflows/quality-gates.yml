# Quality Gates for deployment-service
#
# Runs lint, type check, and tests. Clones workspace deps via GH_PAT.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          if [ -n "$GH_PAT" ]; then
            for repo_remote in "unified-trading-library:IggyIkenna/unified-trading-library" "unified-config-interface:IggyIkenna/unified-config-interface"; do
              repo="${repo_remote%%:*}"
              remote="${repo_remote#*:}"
              dest="../${repo}"
              if git ls-remote -h "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$BRANCH" 2>/dev/null | head -1 | grep -q .; then
                git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || :
              else
                git clone -b main "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || :
              fi
            done
            [ -d "../unified-trading-library" ] || git clone -b main https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-services.git ../unified-trading-library 2>/dev/null || :
          else
            echo "::notice::GH_PAT not set - installing deps from PyPI/Artifact Registry only"
          fi

      - name: Install dependencies
        run: |
          [ -d "../unified-trading-library" ] && uv pip install --system -e ../unified-trading-library 2>/dev/null || :
          [ -d "../unified-config-interface" ] && uv pip install --system -e ../unified-config-interface 2>/dev/null || :
          uv pip install --system -e ".[dev]" || uv pip install --system -e .
          uv pip install --system ruff==0.15.0 basedpyright

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run quality gates
        run: bash scripts/quality-gates.sh --no-fix
