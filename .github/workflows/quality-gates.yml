# Quality Gates for deployment-service
#
# Runs lint, type check, and tests. Clones workspace deps via GH_PAT.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          if [ -n "$GH_PAT" ]; then
            for repo_remote in "unified-trading-library:IggyIkenna/unified-trading-library" "unified-config-interface:IggyIkenna/unified-config-interface"; do
              repo="${repo_remote%%:*}"
              remote="${repo_remote#*:}"
              dest="../${repo}"
              if git ls-remote -h "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$BRANCH" 2>/dev/null | head -1 | grep -q .; then
                git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || :
              else
                git clone -b main "https://x-access-token:${GH_PAT}@github.com/${remote}.git" "$dest" 2>/dev/null || :
              fi
            done
            [ -d "../unified-trading-library" ] || git clone -b main https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-services.git ../unified-trading-library 2>/dev/null || :
          else
            echo "::notice::GH_PAT not set - installing deps from PyPI/Artifact Registry only"
          fi

      - name: Install dependencies
        run: |
          uv venv .venv
          [ -d "../unified-trading-library" ] && uv pip install --python .venv/bin/python -e ../unified-trading-library 2>/dev/null || :
          [ -d "../unified-config-interface" ] && uv pip install --python .venv/bin/python -e ../unified-config-interface 2>/dev/null || :
          uv pip install --python .venv/bin/python -e ".[dev]" || uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python ruff==0.15.0 pytest pytest-cov pytest-asyncio pytest-timeout pytest-xdist basedpyright bandit pip-audit
      - name: Clone build scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
            || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true
          echo "✅ unified-trading-pm cloned for quality-gates base scripts"

      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex # RELATIVE sibling path — works on GHA
        continue-on-error: true

      - name: Run quality gates
        env:
          CLOUD_MOCK_MODE: "true"
          GCP_PROJECT_ID: "test-project"
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          bash scripts/quality-gates.sh --no-fix
      - name: Record CI status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0
          STATUS="${{ job.status == 'success' && 'PASSING' || 'FAILING' }}"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${{ github.event.repository.name }}\", \"status\": \"${STATUS}\", \"sha\": \"${{ github.sha }}\"}}"
