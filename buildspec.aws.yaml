# AWS CodeBuild equivalent of cloudbuild.yaml
# ARCHITECTURE: Test the artifact you deploy
#   1. Build Docker image
#   2. Run quality gates INSIDE the image
#   3. Push ONLY if tests pass
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-northeast-1"
    GCP_PROJECT_ID: "central-element-323112"
  exported-variables:
    - IMAGE_TAG

phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      - VERSION=$(git describe --tags --always 2>/dev/null || echo "unknown") && export VERSION && echo "$VERSION" > VERSION
      - echo "Building version $VERSION"
      - export IMAGE_TAG=$VERSION
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  pre_build:
    commands:
      - REPO_NAME=$(basename $(pwd))
      - ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME
      - aws ecr describe-repositories --repository-names $REPO_NAME || aws ecr create-repository --repository-name $REPO_NAME
      - GCP_SA_KEY=$(aws secretsmanager get-secret-value --secret-id unified-trading/github-actions-sa-key --query SecretString --output text)
      - echo "$GCP_SA_KEY" | docker login -u _json_key --password-stdin https://asia-northeast1-docker.pkg.dev
      - |
        GH_PAT_VAL=$(aws secretsmanager get-secret-value --secret-id github-pat --query SecretString --output text 2>/dev/null || echo "")
        if [ -n "$GH_PAT_VAL" ] && [ ! -d "unified-trading-pm" ]; then
          git clone --depth=1 --branch live-defi-rollout "https://$GH_PAT_VAL@github.com/IggyIkenna/unified-trading-pm.git" unified-trading-pm
          echo "Cloned unified-trading-pm"
        fi

  build:
    commands:
      - VERSION=$(cat VERSION)
      - REPO_NAME=$(basename $(pwd))
      - ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME
      - docker build -f Dockerfile --build-arg PROJECT_ID=$GCP_PROJECT_ID -t $ECR_REPO:$VERSION -t $ECR_REPO:latest .
      # In-image quality gates (ADVISORY — parity with cloudbuild.yaml step 4).
      # `scripts/quality-gates.sh` sources `unified-trading-pm/scripts/quality-gates-base/
      # base-service.sh` via a WORKSPACE_ROOT that the script RE-DERIVES from
      # `git rev-parse --show-toplevel` — which fails inside the image (no .git),
      # leaving WORKSPACE_ROOT empty → `source //unified-trading-pm/...` not found
      # → exit 127. GCP makes the identical step advisory; we match that here so
      # the build is not reddened by the pre-existing wiring gap. Making QG ACTUALLY
      # run in-container (honor the `-e WORKSPACE_ROOT=/workspace` already passed
      # below) is a template-level fix tracked in
      # plans/active/cloud_build_router_aws_parity_2026_06_10.md.
      - docker run --rm --entrypoint "" -v $(pwd)/unified-trading-pm:/workspace/unified-trading-pm -e CLOUD_BUILD=true -e CLOUD_MOCK_MODE=true -e CLOUD_PROVIDER=aws -e AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION -e WORKSPACE_ROOT=/workspace -e REPO_ROOT=/workspace $ECR_REPO:$VERSION /bin/bash -c "scripts/quality-gates.sh --no-fix --quick" && echo "✅ Quality gates passed" || echo "⚠️  Quality gates advisory failure — pre-existing PM-repo WORKSPACE_ROOT wiring, see cloud_build_router_aws_parity plan"
      - docker push $ECR_REPO --all-tags

  post_build:
    commands:
      - VERSION=$(cat VERSION)
      - REPO_NAME=$(basename $(pwd))
      - |
        if [ -n "$GH_PAT" ]; then
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME:$VERSION"
          curl -sS -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/IggyIkenna/$REPO_NAME/dispatches" -d "{\"event_type\":\"service-deployed\",\"client_payload\":{\"service_name\":\"$REPO_NAME\",\"version\":\"$VERSION\",\"image\":\"$IMAGE\"}}" || true
        fi
      # Library wheel publish — ONLY for repos wired to CodeArtifact. deployment-service
      # is a SERVICE (deployed as the Docker image above), so CODEARTIFACT_DOMAIN is
      # unset and this whole block is skipped. Use `python -m pip` (always present with
      # the python runtime) — `uv` is NOT installed in the CodeBuild env (install phase
      # sets only python 3.13), so the prior `uv pip install` exited 127 and reddened
      # every build.
      - |
        if [ -n "$CODEARTIFACT_DOMAIN" ]; then
          python -m pip install build twine
          python -m build --wheel --outdir dist/
          aws codeartifact login --tool twine --domain $CODEARTIFACT_DOMAIN --domain-owner $AWS_ACCOUNT_ID --repository unified-libraries || true
          python -m twine upload --repository codeartifact dist/*.whl || true
        fi

artifacts:
  files:
    - "**/*"

cache:
  paths:
    - "/root/.cache/uv/**/*"
