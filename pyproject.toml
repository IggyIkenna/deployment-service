[project]
name = "deployment-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Deployment orchestration engine (split from unified-trading-deployment-v3 2026-03-03)"
dependencies = [
    "unified-trading-library>=0.1.0",
    "unified-cloud-interface>=1.1.0",
    "unified-config-interface>=0.1.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "ruff==0.15.0",
    "basedpyright>=1.21.0,<2.0.0",
]

[project.scripts]
deploy-shards = "deployment_service.cli:main"

[tool.uv.sources]
unified-trading-library = { path = "../unified-trading-library" }
unified-events-interface = { path = "../unified-events-interface" }
unified-cloud-interface = { path = "../unified-cloud-interface" }
unified-config-interface = { path = "../unified-config-interface" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "G"]
ignore = ["E501", "E402", "G003", "G004", "G201", "G202", "SIM103", "B905"]
per-file-ignores = { "deployment_service/deployment/quota_broker_client.py" = ["E402"], "deployment_service/backends/provider_factory.py" = ["E402"] }

[tool.basedpyright]
pythonVersion = "3.13"
reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.report]
fail_under = 70  # ISS-028: target 70%. Currently at ~21% (8679 lines). 402 tests pass but mostly test configs/data. Need tests for backends/, pipeline/, deployment/, and services/ modules.
