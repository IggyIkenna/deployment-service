[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "deployment-service"
version = "0.1.0"
description = "Deployment orchestration service for Unified Trading System"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.4.0,<1.0.0",
    "unified-config-interface>=0.1.0,<1.0.0",
    "click>=8.0.0,<9.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "rich>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "ruff==0.15.0",
    "basedpyright>=1.18.0,<2.0.0",
    "pre-commit>=3.0,<4.0.0",
    "pip-audit>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deployment_service*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --cov=deployment_service --cov-report=term-missing --cov-fail-under=70"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "smoke: Smoke tests",
]

[tool.coverage.run]
branch = true
source = ["deployment_service"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.quality-gates]
repo_arch_tier = "devops"

[tool.basedpyright]
typeCheckingMode = "strict"
reportAny = "error"
useLibraryCodeForTypes = true
pythonVersion = "3.13"
