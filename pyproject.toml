[project]
name = "deployment-service"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
description = "Deployment orchestration engine (split from unified-trading-deployment-v3 2026-03-03)"
dependencies = [
    "unified-trading-library>=0.72.0,<1.0.0",
    "unified-api-contracts>=0.91.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "fastapi>=0.137.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "botocore>=1.34.0,<2.0.0",
    "google-cloud-run<1.0.0,>=0.15.0",
    "google-cloud-compute>=1.45.0,<2.0.0",
    "google-cloud-functions>=1.16.0,<2.0.0",
    "google-cloud-artifact-registry>=1.13.0,<2.0.0",
    "google-cloud-scheduler>=2.20.0,<3.0.0",
    "flask>=3.0.0,<4.0.0",
    "functions-framework>=3.8.0,<4.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pygments>=2.20.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
    "aiohttp>=3.14.1,<4.0.0",
    "web3>=6.20.0,<8.0.0",
    "py-solc-x>=2.0.3,<3.0.0",
]

[project.scripts]
deploy-shards = "deployment_service.cli.main:main"

[tool.uv]
# Transitive security pins (pip-audit) — keep at or above fix versions
override-dependencies = [
    # cryptography>=50.0.0 closes CVE-2026-69247 (PKCS#7 EnvelopedData decryption Bleichenbacher
    # oracle via distinguishable errors/timing, introduced in 44.0.0) found in 49.0.0 by pip-audit
    # fleet sweep 2026-08-03 (issues/cve_affected_pinned_deps_remediation_2026_06_18.md). No BACKWARDS
    # INCOMPATIBLE changes in the 50.0.0 changelog; deployment-service has no direct `cryptography`
    # import (transitive only).
    "cryptography>=50.0.0,<51.0.0",
]

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

# NOTE: deployment-api is a TEST-ONLY peer dep (tests/ import deployment_api; source never does).
# It is installed for tests via LOCAL_DEPS in scripts/quality-gates.sh, NOT declared here —
# deployment-api -> deployment-service is the real dependency direction (manifest reflects this).
# Keeping it as a [project.dependencies] / [tool.uv.sources] entry re-introduced the circular dep
# and broke dependency-alignment (manifest has no deployment-api). Removed 2026-06-04.

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = [
    "E402",
    "E501",
    "G201",
    "G202",
    "SIM103",
    "B905",
]

[tool.ruff.lint.mccabe]
max-complexity = 55

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]
"deployment_service/deployment/quota_broker_client.py" = ["E402"]
"deployment_service/backends/provider_factory.py" = ["E402"]
"deployment_service/backends/aws_batch.py" = ["C901"]
"deployment_service/backends/aws_ec2.py" = ["C901"]
"deployment_service/calculators/shard_dimensions.py" = ["C901"]
"deployment_service/calculators/shard_distribution.py" = ["C901"]
"deployment_service/calculators/base_calculator.py" = ["N818"]
"deployment_service/api/gunicorn.conf.py" = ["N999"]
"scripts/setup-buckets.py" = ["N999"]
"scripts/**/*.py" = ["C901"]
"tests/**/*.py" = ["C901", "B007", "SIM102", "SIM117", "N806", "N802", "RUF059", "RUF005", "RUF001", "RUF002", "RUF003", "RUF012", "RUF015", "RUF100", "C416"]
"tests/*.py" = ["C901", "B007", "SIM102", "SIM117", "N806", "N802", "RUF059", "RUF005", "RUF001", "RUF002", "RUF003", "RUF012", "RUF015", "RUF100", "C416"]









[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["deployment_service"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportAny = "error"
reportMissingTypeStubs = false
reportMissingParameterType = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedBaseClass = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportOperatorIssue = "none"
reportIndexIssue = "none"
reportGeneralTypeIssues = "none"
reportTypedDictNotRequiredAccess = "none"
reportImplicitRelativeImport = "none"
reportMissingImports = "none"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    ".",
    "../unified-trading-library",
    "../unified-api-contracts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
    "e2e: marks end-to-end tests (deselect with '-m \"not e2e\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "cli: mark test as CLI test",
]

[tool.coverage.run]
source = ["deployment_service"]
branch = true
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true
# Standalone loops / external-orchestration entry points are validated via
# integration smoke tests rather than unit coverage. live_deployment.py is
# a staging smoke harness and sports_trigger_scheduler.py is an infinite
# loop that shells out to the CLI — both resist meaningful unit testing.
omit = [
    "*/live_deployment.py",
    "*/sports_trigger_scheduler.py",
]

[tool.coverage.report]
# Aligned with MIN_COVERAGE in scripts/quality-gates.sh (72). The previous 76 floor
# did not match the per-repo QG setting and caused spurious failures.
fail_under = 70
omit = [
    "*/live_deployment.py",
    "*/sports_trigger_scheduler.py",
]

[tool.bandit]
skips = []

[build-system]
requires = [
    "hatchling",
"hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
